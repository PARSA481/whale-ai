<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Whale AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050914;
    --panel:#091522;
    --panel2:#0c1b2b;
    --border:rgba(255,255,255,.075);
    --text:#f4f8ff;
    --muted:#7e92a8;
    --blue:#2997ff;
    --blue2:#1268d4;
    --cyan:#35d5ff;
    --green:#43e49a;
    --danger:#ff6477;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        "Vazirmatn",
        "IRANSans",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(30,125,225,.20),
            transparent 40%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(0,160,255,.07),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #030711 0%,
            #07111f 52%,
            #040913 100%
        );
}

button,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    color:inherit;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100dvh;
    display:flex;
    overflow:hidden;
    position:relative;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:292px;
    flex:0 0 292px;
    height:100%;

    display:flex;
    flex-direction:column;

    background:
        linear-gradient(
            180deg,
            rgba(9,20,34,.98),
            rgba(5,13,24,.99)
        );

    border-left:1px solid var(--border);

    backdrop-filter:blur(24px);

    position:relative;
    z-index:50;
}

.sidebar::after{
    content:"";

    position:absolute;
    left:0;
    top:0;

    width:1px;
    height:100%;

    background:
        linear-gradient(
            transparent,
            rgba(41,151,255,.35),
            transparent
        );
}

/* =========================
   BRAND
========================= */

.brand{
    padding:18px;
    display:flex;
    align-items:center;
    gap:12px;

    border-bottom:1px solid var(--border);
}

.logo{
    width:46px;
    height:46px;
    flex:0 0 46px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #2fa8ff,
            #0754ad
        );

    box-shadow:
        0 10px 30px rgba(25,130,240,.23),
        inset 0 1px rgba(255,255,255,.28);
}

.logo img{
    width:32px;
    height:32px;
    object-fit:contain;
    display:block;
}

.brand-name{
    font-size:19px;
    font-weight:850;
    letter-spacing:-.5px;
}

.brand-tag{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

/* =========================
   NEW CHAT
========================= */

.new-chat{
    margin:16px;
    height:46px;

    border-radius:13px;

    border:1px solid rgba(65,166,255,.22);

    background:
        linear-gradient(
            135deg,
            rgba(41,151,255,.96),
            rgba(19,93,190,.96)
        );

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    font-size:12px;
    font-weight:800;

    box-shadow:
        0 10px 28px rgba(25,120,220,.18);

    transition:.18s;
}

.new-chat:hover{
    transform:translateY(-1px);
}

.new-chat:active{
    transform:scale(.98);
}

.new-chat svg{
    width:18px;
}

/* =========================
   HISTORY
========================= */

.history-head{
    padding:1px 17px 10px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.history-title{
    color:#8da1b7;
    font-size:11px;
    font-weight:700;
}

.history-count{
    color:#526a82;
    font-size:9px;
}

#historyList{
    flex:1;
    overflow-y:auto;
    padding:0 9px 12px;
}

.empty-history{
    text-align:center;
    color:#61768d;
    font-size:11px;
    padding:34px 12px;
    line-height:2;
}

/* =========================
   CONVERSATIONS
========================= */

.conversation{
    display:flex;
    align-items:center;
    gap:7px;

    min-height:53px;

    padding:7px 8px;
    margin-bottom:4px;

    border-radius:12px;

    border:1px solid transparent;

    transition:.18s;
}

.conversation:hover{
    background:rgba(255,255,255,.04);
    border-color:rgba(255,255,255,.045);
}

.conversation.active{
    background:
        linear-gradient(
            90deg,
            rgba(41,151,255,.13),
            rgba(41,151,255,.025)
        );

    border-color:rgba(41,151,255,.13);
}

.conv-icon{
    width:32px;
    height:32px;
    flex:0 0 32px;

    border-radius:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#82b5df;
    background:rgba(255,255,255,.045);
}

.conversation.active .conv-icon{
    color:#48aaff;
    background:rgba(41,151,255,.12);
}

.conv-icon svg{
    width:15px;
}

.conversation-info{
    flex:1;
    min-width:0;
    cursor:pointer;
}

.conversation-title{
    font-size:12px;
    color:#dbe7f4;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.conversation-count{
    margin-top:3px;
    color:#536a82;
    font-size:9px;
}

.delete-conversation{
    width:28px;
    height:28px;
    flex:0 0 28px;

    border-radius:8px;

    background:transparent;
    color:#52677d;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.18s;
}

.delete-conversation:hover{
    color:#ff7180;
    background:rgba(255,75,95,.1);
}

.delete-conversation svg{
    width:13px;
}

/* =========================
   SIDEBAR BOTTOM
========================= */

.sidebar-bottom{
    padding:10px;
    border-top:1px solid var(--border);
}

.clear-all{
    width:100%;
    height:36px;

    border-radius:9px;

    background:transparent;
    color:#61778d;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;

    font-size:10px;

    transition:.18s;
}

.clear-all:hover{
    background:rgba(255,70,90,.065);
    color:#ff7180;
}

.clear-all svg{
    width:13px;
    height:13px;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    height:100%;

    display:flex;
    flex-direction:column;

    position:relative;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    height:70px;
    flex:0 0 70px;

    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid var(--border);

    background:rgba(5,12,21,.72);

    backdrop-filter:blur(22px);

    position:relative;
    z-index:10;
}

.top-left{
    display:flex;
    align-items:center;
    gap:11px;
}

.mobile-menu{
    display:none;

    width:39px;
    height:39px;

    border-radius:10px;

    background:rgba(255,255,255,.05);
    border:1px solid var(--border);

    align-items:center;
    justify-content:center;
}

.mobile-menu svg{
    width:18px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
}

.status-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 0 4px rgba(66,230,154,.07),
        0 0 15px rgba(66,230,154,.6);
}

.status-name{
    font-size:13px;
    font-weight:800;
}

.status-text{
    color:#647a91;
    font-size:9px;
    margin-top:3px;
}

.top-actions{
    display:flex;
    gap:7px;
}

.top-btn{
    height:37px;
    padding:0 11px;

    display:flex;
    align-items:center;
    gap:6px;

    border-radius:10px;

    border:1px solid var(--border);

    background:rgba(255,255,255,.04);

    color:#b9c9da;

    font-size:10px;

    transition:.18s;
}

.top-btn:hover{
    background:rgba(255,255,255,.07);
    color:#fff;
}

.top-btn svg{
    width:14px;
}

/* =========================
   CHAT
========================= */

#chat{
    flex:1;

    overflow-y:auto;

    padding:
        30px
        max(20px,calc((100% - 960px)/2))
        145px;

    scroll-behavior:smooth;
}

/* =========================
   WELCOME
========================= */

.welcome{
    min-height:440px;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    text-align:center;

    animation:welcomeIn .55s ease;
}

.welcome-logo{
    width:88px;
    height:88px;

    border-radius:26px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        radial-gradient(
            circle at 30% 25%,
            #58c2ff,
            #1680e9 50%,
            #08428c
        );

    box-shadow:
        0 25px 65px rgba(19,123,229,.22),
        inset 0 1px rgba(255,255,255,.35);

    overflow:hidden;
}

.welcome-logo::before{
    content:"";

    position:absolute;
    inset:-8px;

    border-radius:32px;

    border:1px solid rgba(57,169,255,.12);

    animation:pulse 2.5s infinite;
}

.welcome-logo img{
    width:60px;
    height:60px;

    object-fit:contain;

    position:relative;
    z-index:2;

    filter:
        brightness(0)
        invert(1);
}

.welcome h1{
    margin-top:23px;

    font-size:29px;
    letter-spacing:-1px;
    font-weight:900;
}

.welcome p{
    color:#72879e;
    font-size:12px;
    margin-top:8px;
}

/* =========================
   QUICK ACTIONS
========================= */

.quick-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;

    width:min(690px,100%);

    margin-top:30px;
}

.quick{
    min-height:70px;

    padding:11px;

    text-align:right;

    border-radius:13px;

    border:1px solid var(--border);

    background:rgba(255,255,255,.025);

    color:#aebed0;

    transition:.2s;
}

.quick:hover{
    background:rgba(41,151,255,.06);
    border-color:rgba(41,151,255,.19);

    transform:translateY(-2px);
}

.quick-icon{
    width:28px;
    height:28px;

    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:6px;

    background:rgba(41,151,255,.09);
    color:#4eafff;
}

.quick-icon svg{
    width:15px;
}

.quick strong{
    display:block;

    font-size:10px;
    color:#d4dfeb;
}

.quick span{
    display:block;

    font-size:8px;
    color:#60768d;

    margin-top:2px;
}

/* =========================
   MESSAGES
========================= */

.message-row{
    display:flex;
    width:100%;

    margin:17px 0;

    animation:messageIn .2s ease;
}

.user-row{
    justify-content:flex-start;
}

.bot-row{
    justify-content:flex-end;
}

.avatar{
    width:34px;
    height:34px;

    flex:0 0 34px;

    border-radius:11px;

    margin:0 9px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.user-avatar{
    background:
        linear-gradient(
            145deg,
            #1b70cc,
            #104e96
        );

    color:#cce8ff;
}

.bot-avatar{
    background:
        linear-gradient(
            145deg,
            #15283f,
            #0b1727
        );

    border:1px solid rgba(255,255,255,.07);

    color:#42aaff;

    overflow:hidden;
}

.bot-avatar img{
    width:22px;
    height:22px;

    object-fit:contain;

    filter:
        brightness(0)
        invert(1);
}

/* =========================
   MESSAGE
========================= */

.message-box{
    max-width:min(76%,760px);
    min-width:0;
}

.message{
    padding:13px 16px;

    border-radius:17px;

    font-size:13px;
    line-height:1.95;

    white-space:pre-wrap;
    word-break:break-word;

    box-shadow:0 7px 25px rgba(0,0,0,.09);
}

.user-message{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #217fe8,
            #125bb5
        );

    border-bottom-left-radius:5px;
}

.bot-message{
    color:#dbe7f3;

    background:
        linear-gradient(
            145deg,
            rgba(16,31,49,.96),
            rgba(9,21,35,.96)
        );

    border:1px solid rgba(255,255,255,.065);

    border-bottom-right-radius:5px;
}

/* =========================
   MESSAGE ACTIONS
========================= */

.message-actions{
    direction:ltr;

    display:flex;
    gap:4px;

    margin-top:5px;
    padding-left:3px;
}

.message-action{
    height:26px;

    padding:0 7px;

    border-radius:7px;

    background:transparent;
    color:#647b92;

    display:flex;
    align-items:center;
    gap:4px;

    font-size:9px;

    transition:.15s;
}

.message-action:hover{
    color:#a8bed3;
    background:rgba(255,255,255,.045);
}

.message-action svg{
    width:12px;
}

/* =========================
   TYPING
========================= */

#typing{
    display:none;

    justify-content:flex-end;
    align-items:center;

    color:#667c92;

    font-size:10px;

    margin:4px 43px 18px 0;
}

.typing-box{
    display:flex;
    align-items:center;
    gap:9px;
}

.typing-dots{
    display:flex;
    gap:4px;
}

.typing-dots span{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#5f7d9b;

    animation:typing 1.1s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.15s;
}

.typing-dots span:nth-child(3){
    animation-delay:.3s;
}

/* =========================
   INPUT
========================= */

.input-area{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:20;

    padding:28px 20px 15px;

    background:
        linear-gradient(
            transparent,
            rgba(4,9,16,.91) 35%,
            rgba(4,9,16,.98)
        );
}

.input-container{
    width:min(900px,100%);
    margin:auto;
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:8px;

    padding:8px;

    min-height:60px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(16,32,51,.97),
            rgba(9,20,34,.97)
        );

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        0 20px 65px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.025);

    transition:.2s;
}

.input-box:focus-within{
    border-color:rgba(42,151,255,.43);

    box-shadow:
        0 20px 65px rgba(0,0,0,.4),
        0 0 0 3px rgba(42,151,255,.055);
}

.input-side{
    display:flex;
    gap:5px;
}

.input-tool{
    width:38px;
    height:38px;

    flex:0 0 38px;

    border-radius:10px;

    background:rgba(255,255,255,.045);
    color:#7990a8;

    display:flex;
    align-items:center;
    justify-content:center;
}

.input-tool:hover{
    color:#b8c9da;
    background:rgba(255,255,255,.07);
}

.input-tool svg{
    width:16px;
}

#input{
    flex:1;

    min-width:0;

    max-height:145px;

    resize:none;

    outline:none;
    border:0;

    background:transparent;

    color:#f5f8fc;

    font-size:13px;
    line-height:1.7;

    padding:8px 9px;
}

#input::placeholder{
    color:#5e748b;
}

/* =========================
   SEND / STOP BUTTON
========================= */

#send{
    width:43px;
    height:43px;

    flex:0 0 43px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #32a4ff,
            #1468d2
        );

    box-shadow:
        0 8px 22px rgba(30,125,230,.23);

    transition:
        transform .15s,
        background .15s,
        opacity .15s;
}

#send:hover{
    transform:translateY(-1px) scale(1.025);
}

#send:active{
    transform:scale(.95);
}

#send.stop{
    background:
        linear-gradient(
            145deg,
            #ff6476,
            #d83c53
        );
}

#send svg{
    width:18px;
    height:18px;
}

.input-hint{
    text-align:center;

    color:#43576c;

    font-size:9px;

    margin-top:7px;
}

/* =========================
   OVERLAY
========================= */

.overlay{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.48);

    backdrop-filter:blur(3px);

    z-index:40;
}

.overlay.show{
    display:block;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:6px;
    height:6px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:#1a2d43;
    border-radius:20px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes welcomeIn{
    from{
        opacity:0;
        transform:translateY(14px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.5;
    }

    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(.95);
        opacity:.35;
    }

    50%{
        transform:scale(1.06);
        opacity:.1;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .sidebar{
        position:fixed;

        right:-300px;
        top:0;

        width:292px;
        height:100%;

        transition:right .25s ease;

        box-shadow:
            -25px 0 70px rgba(0,0,0,.45);
    }

    .sidebar.open{
        right:0;
    }

    .mobile-menu{
        display:flex;
    }

    .topbar{
        height:64px;
        flex-basis:64px;

        padding:0 11px;
    }

    .top-actions .top-btn span{
        display:none;
    }

    .top-btn{
        width:38px;
        justify-content:center;
        padding:0;
    }

    #chat{
        padding:
            20px
            10px
            132px;
    }

    .welcome{
        min-height:420px;
        padding:10px;
    }

    .welcome-logo{
        width:76px;
        height:76px;
        border-radius:23px;
    }

    .welcome-logo img{
        width:49px;
        height:49px;
    }

    .welcome h1{
        font-size:22px;
    }

    .quick-actions{
        grid-template-columns:1fr;

        width:100%;
        max-width:390px;

        margin-top:24px;
    }

    .quick{
        min-height:59px;
    }

    .message-box{
        max-width:84%;
    }

    .message{
        font-size:12px;
        padding:11px 13px;
    }

    .avatar{
        width:30px;
        height:30px;
        flex-basis:30px;
        margin:0 6px;
    }

    .bot-avatar img{
        width:19px;
        height:19px;
    }

    .input-area{
        padding:21px 9px 9px;
    }

    .input-box{
        min-height:56px;
        border-radius:15px;
    }

    .input-tool{
        display:none;
    }

    #send{
        width:41px;
        height:41px;
        flex-basis:41px;
    }

    .input-hint{
        font-size:8px;
    }
}

@media(max-width:430px){

    .brand{
        padding:16px;
    }

    .welcome h1{
        font-size:21px;
    }

    .message-box{
        max-width:87%;
    }

    .status-text{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

    <div class="brand">

        <div class="logo">
            <img id="brandWhale" alt="Whale">
        </div>

        <div>
            <div class="brand-name">Whale AI</div>
            <div class="brand-tag">دستیار هوشمند نسل جدید</div>
        </div>

    </div>

    <button class="new-chat" id="newChatButton">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
        >
            <path d="M12 5v14"/>
            <path d="M5 12h14"/>
        </svg>

        گفت‌وگوی جدید

    </button>

    <div class="history-head">

        <div class="history-title">

<script>

/* =========================================================

========================================================= */

const WHALE_IMAGE =

        "cdn-icons-png.flaticon.com/",
        "512/8827/8827658.png"
    ].join("");

document.getElementById("brandWhale").src = WHALE_IMAGE;
document.getElementById("welcomeWhale").src = WHALE_IMAGE;


/* =========================================================
   STATE
========================================================= */

let currentConversationId = null;
let isSending = false;
let abortController = null;


/* =========================================================
   ELEMENTS
========================================================= */

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chat =

const sidebar =

const overlay =
    document.getElementById("overlay");

const statusText =
    document.getElementById("statusText");


/* =========================================================
   ICONS
========================================================= */

const icons = {

    user: `
        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"

    `,

            stroke-linejoin="round"
        >
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
    `,

    chat: `
        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
    `,

    trash: `
        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
        >
            <path d="M3 6h18"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
            <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
            <path d="M10 11v6"/>
            <path d="M14 11v6"/>
        </svg>
    `,

    stop: `
        <svg
            viewBox="0 0 24 24"
            fill="currentColor"
        >
            <rect
                x="6"
                y="6"
                width="12"
                height="12"

            />
        </svg>
    `,

    send: `
        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path d="M22 2 11 13"/>
            <path d="m22 2-7 20-4-9-9-4Z"/>
        </svg>
    `
};


/* =========================================================
   UI HELPERS
========================================================= */

function showWelcome(){
    welcome.style.display = "flex";
}

function hideWelcome(){
    welcome.style.display = "none";
}

function scrollBottom(){

    requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
    });

}


/* =========================================================
   SEND BUTTON
   مهم: هر بار وضعیت پایان پاسخ به این تابع برمی‌گردد.
========================================================= */

function setSendingUI(value){

    isSending = Boolean(value);

    if(isSending){

        send.classList.add("stop");

        send.title = "توقف";

        send.setAttribute(
            "aria-label",
            "توقف پاسخ"
        );

        send.innerHTML = icons.stop;

        statusText.textContent =
            "در حال پاسخ‌گویی...";

    }else{

        send.classList.remove("stop");

        send.title = "ارسال";

        send.setAttribute(
            "aria-label",
            "ارسال پیام"
        );

        send.innerHTML = icons.send;

        statusText.textContent =
            "آماده پاسخ‌گویی";

    }

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(text,type){

    hideWelcome();

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (type === "user"
            ? "user-row"
            : "bot-row");

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (type === "user"
            ? "user-avatar"
            : "bot-avatar");

    if(type === "user"){

        avatar.innerHTML =
            icons.user;

    }else{

        const image =
            document.createElement("img");

        image.src = WHALE_IMAGE;
        image.alt = "Whale";

        avatar.appendChild(image);

    }

    const box =
        document.createElement("div");

    box.className =
        "message-box";

    const message =
        document.createElement("div");

    message.className =
        "message " +
        (type === "user"
            ? "user-message"
            : "bot-message");

    message.textContent = text;

    box.appendChild(message);


    if(type === "bot"){

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";

        const copy =
            document.createElement("button");

        copy.className =
            "message-action";

        copy.innerHTML =
            icons.copy +
            "<span>کپی</span>";

        copy.onclick =
            async () => {

                try{

                    await navigator.clipboard
                        .writeText(
                            message.textContent
                        );

                    copy.innerHTML =
                        "✓ <span>کپی شد</span>";

                    setTimeout(() => {

                        copy.innerHTML =
                            icons.copy +
                            "<span>کپی</span>";

                    },1500);

                }catch(error){

                    console.error(error);

                }

            };

        actions.appendChild(copy);

        box.appendChild(actions);

    }


    if(type === "user"){

        row.appendChild(box);
        row.appendChild(avatar);

    }else{

        row.appendChild(avatar);
        row.appendChild(box);

    }

    chat.insertBefore(
        row,
        typing
    );

    scrollBottom();

    return message;

}


/* =========================================================
   CLEAR CHAT
========================================================= */

function clearChat(){

    chat
        .querySelectorAll(".message-row")
        .forEach(el => el.remove());

    showWelcome();

}


/* =========================================================
   NEW CONVERSATION
========================================================= */

async function createNewConversation(){

    try{

        const response =
            await fetch(
                "/conversations",
                {
                    method:"POST"
                }
            );

        if(!response.ok){

            throw new Error(
                "خطا در ساخت گفتگو"
            );

        }

        const data =
            await response.json();

        currentConversationId =
            data.id;

        clearChat();

        closeSidebar();

        await loadConversations();

        input.focus();

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    if(isSending){

        stopGeneration();

        return;

    }

    const text =
        input.value.trim();

    if(!text){
        return;
    }


    setSendingUI(true);

    addMessage(
        text,
        "user"
    );

    input.value = "";

    input.style.height = "auto";

    typing.style.display = "flex";

    abortController =
        new AbortController();

    let botMessage = null;


    try{

        const response =
            await fetch(
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:text,
                        conversation_id:
                            currentConversationId
                    }),

                    signal:
                        abortController.signal
                }
            );


        if(!response.ok){

            const errorData =
                await response
                    .json()
                    .catch(() => ({}));

            throw new Error(
                errorData.error ||
                "خطا در ارتباط با سرور"
            );

        }


        if(!response.body){

            throw new Error(
                "سرور جریان پاسخ را ارسال نکرد."
            );

        }


        typing.style.display = "none";

        botMessage =
            addMessage(
                "",
                "bot"
            );


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder("utf-8");

        let buffer = "";


        while(true){

            const result =
                await reader.read();


            if(result.done){

                /*
                    مهم:
                    حتی اگر سرور پیام done
                    نفرستد، پایان stream باعث
                    برگشت دکمه می‌شود.
                */

                break;

            }


            buffer +=
                decoder.decode(
                    result.value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split("\n");

            buffer =
                lines.pop();


            for(const line of lines){

                const clean =
                    line.trim();

                if(!clean){
                    continue;
                }


                try{

                    const data =
                        JSON.parse(clean);


                    if(data.type === "text"){

                        if(botMessage){

                            botMessage.textContent +=
                                data.content || "";

                            scrollBottom();

                        }

                    }


                    if(data.type === "done"){

                        if(
                            data.conversation_id !==
                            undefined
                        ){

                            currentConversationId =
                                data.conversation_id;

                        }

                    }


                    if(data.type === "error"){

                        if(botMessage){

                            botMessage.textContent =
                                data.content ||
                                "خطای نامشخص";

                        }

                    }

                }catch(parseError){

                    console.debug(
                        "Invalid stream line:",
                        clean
                    );

                }

            }

        }


        /*
            پاسخ کامل شده.
            دکمه همین‌جا به ارسال برمی‌گردد.
        */

        typing.style.display = "none";

        setSendingUI(false);

        await loadConversations();


    }catch(error){

        typing.style.display = "none";


        if(error.name === "AbortError"){

            if(botMessage){

                if(
                    !botMessage.textContent.trim()
                ){

                    botMessage.textContent =
                        "پاسخ متوقف شد.";

                }else{

                    botMessage.textContent +=
                        "\n\n— پاسخ متوقف شد —";

                }

            }

        }else{

            if(botMessage){

                botMessage.textContent =
                    "خطا: " +
                    (
                        error.message ||
                        "ارتباط با سرور برقرار نشد."
                    );

            }else{

                addMessage(
                    error.message ||
                    "ارتباط با سرور برقرار نشد.",
                    "bot"
                );

            }

            console.error(error);

        }

    }finally{

        /*
            این بخش تضمین می‌کند
            دکمه هیچ‌وقت روی STOP گیر نکند.
        */

        typing.style.display = "none";

        abortController = null;

        setSendingUI(false);

        input.focus();

    }

}


/* =========================================================
   STOP GENERATION
========================================================= */

function stopGeneration(){

    if(
        abortController
    ){

        abortController.abort();

        abortController = null;

    }

    typing.style.display = "none";

    setSendingUI(false);

}


/* =========================================================
   LOAD CONVERSATIONS
========================================================= */

async function loadConversations(){

    try{

        const response =
            await fetch(
                "/conversations"
            );

        if(!response.ok){

            throw new Error(
                "خطا در تاریخچه"
            );

        }

        const data =
            await response.json();

        historyList.innerHTML = "";

        historyCount.textContent =
            data.length +
            " گفتگو";


        if(!data.length){

            historyList.innerHTML = `
                <div class="empty-history">
                    هنوز گفت‌وگویی وجود ندارد.
                    <br>
                    اولین گفت‌وگوی خودت را شروع کن.
                </div>
            `;

            return;

        }


        data.forEach(
            conversation => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "conversation";


                if(
                    conversation.id ===
                    currentConversationId
                ){

                    row.classList.add(
                        "active"
                    );

                }


                const icon =
                    document.createElement(
                        "div"
                    );

                icon.className =
                    "conv-icon";

                icon.innerHTML =
                    icons.chat;


                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "conversation-info";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "conversation-title";

                title.textContent =
                    conversation.title ||
                    "گفت‌وگوی جدید";


                const count =
                    document.createElement(
                        "div"
                    );

                count.className =
                    "conversation-count";

                count.textContent =
                    (
                        conversation.message_count ||
                        0
                    ) +
                    " پیام";


                info.appendChild(title);
                info.appendChild(count);


                info.onclick =
                    () => {

                        openConversation(
                            conversation.id
                        );

                    };


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "delete-conversation";

                deleteButton.innerHTML =
                    icons.trash;

                deleteButton.title =
                    "حذف گفتگو";


                deleteButton.onclick =
                    event => {

                        event.stopPropagation();

                        deleteConversation(
                            conversation.id
                        );

                    };


                row.appendChild(icon);
                row.appendChild(info);
                row.appendChild(deleteButton);

                historyList.appendChild(row);

            }
        );

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(id){

    try{

        const response =
            await fetch(
                "/conversations/" +
                id +
                "/messages"
            );

        if(!response.ok){

            throw new Error(
                "خطا در دریافت گفتگو"
            );

        }

        const data =
            await response.json();

        currentConversationId = id;

        clearChat();


        data.forEach(message => {

            addMessage(
                message.content,
                message.role === "user"
                    ? "user"
                    : "bot"
            );

        });


        closeSidebar();

        await loadConversations();

        input.focus();

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   DELETE ONE CONVERSATION
========================================================= */

async function deleteConversation(id){

    if(
        !confirm(
            "این گفت‌وگو حذف شود؟"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                "/conversations/" +
                id,
                {
                    method:"DELETE"
                }
            );


        if(!response.ok){

            throw new Error(
                "خطا در حذف گفتگو"
            );

        }


        if(
            currentConversationId === id
        ){

            currentConversationId =
                null;

            clearChat();

        }


        await loadConversations();

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   DELETE ALL
========================================================= */

async function deleteAll(){

    if(
        !confirm(
            "همه گفت‌وگوها حذف شوند؟"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                "/conversations",
                {
                    method:"DELETE"
                }
            );


        if(!response.ok){

            throw new Error(
                "خطا در حذف گفتگوها"
            );

        }


        currentConversationId =
            null;

        clearChat();

        await loadConversations();

    }catch(error){

        console.error(error);

    }

}

    sidebar.classList.add(

    overlay.classList.add(

function closeSidebar(){

    sidebar.classList.remove(

    overlay.classList.remove(
        "show"

/* =========================================================
   INPUT AUTO RESIZE
========================================================= */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                145
            ) + "px";

    }
);


/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   BUTTON EVENTS
========================================================= */

send.addEventListener(
    "click",
    () => {

        sendMessage();

    }
);


document.getElementById(
    "newChatButton"
).addEventListener(
    "click",
    createNewConversation
);


document.getElementById(
    "clearAll"
).addEventListener(
    "click",
    deleteAll
);


document.getElementById(
    "mobileMenu"
).addEventListener(
    "click",
    openSidebar
);


document.getElementById(
    "historyButton"
).addEventListener(
    "click",
    openSidebar
);


overlay.addEventListener(
    "click",
    closeSidebar
);


/* =========================================================
   QUICK PROMPTS
========================================================= */

document
    .querySelectorAll(".quick")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                input.value =
                    button.dataset.prompt;

                input.dispatchEvent(
                    new Event("input")
                );

                input.focus();

            }
        );

    });


/* =========================================================
   INITIAL LOAD
========================================================= */

loadConversations();

input.focus();

</script>

</body>
</html>
