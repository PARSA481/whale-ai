<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Whale AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #0b0f14;
    --sidebar: #10151c;
    --panel: #151b23;
    --panel2: #1b222c;
    --border: rgba(255,255,255,.08);
    --text: #f3f5f7;
    --muted: #8d98a6;
    --accent: #58a6ff;
    --accent2: #2f81f7;
    --user: #1d4f91;
    --assistant: #151b23;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);

    height: 100vh;
    overflow: hidden;
}

button,
textarea {
    font-family: inherit;
}


/* =====================================================
   APP
   ===================================================== */

.app {
    display: flex;
    height: 100vh;
    width: 100%;
}


/* =====================================================
   SIDEBAR
   ===================================================== */

.sidebar {
    width: 290px;
    background: var(--sidebar);
    border-left: 1px solid var(--border);

    display: flex;
    flex-direction: column;

    transition: .25s;
}

.sidebar-header {
    padding: 18px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 21px;
    font-weight: 800;
}

.whale {
    width: 42px;
    height: 42px;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #2484ff,
            #1457b8
        );

    font-size: 24px;

    box-shadow:
        0 8px 30px rgba(37,132,255,.25);
}

.new-chat {
    width: 100%;

    border: 1px solid var(--border);

    background: var(--panel);

    color: var(--text);

    border-radius: 12px;

    padding: 12px;

    cursor: pointer;

    margin-top: 18px;

    font-size: 14px;

    transition: .2s;
}

.new-chat:hover {
    background: var(--panel2);
}

.conversations {
    flex: 1;

    overflow-y: auto;

    padding: 8px 12px;
}

.conversation {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 8px;

    padding: 11px 12px;

    border-radius: 10px;

    cursor: pointer;

    color: var(--muted);

    margin-bottom: 4px;

    transition: .2s;
}

.conversation:hover {
    background: var(--panel);
    color: var(--text);
}

.conversation.active {
    background: var(--panel2);
    color: var(--text);
}

.conversation-title {
    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    flex: 1;
}

.delete-conversation {
    opacity: 0;

    border: none;

    background: transparent;

    color: #ff6b6b;

    cursor: pointer;

    font-size: 16px;
}

.conversation:hover .delete-conversation {
    opacity: 1;
}

.sidebar-footer {
    padding: 14px;

    border-top: 1px solid var(--border);
}

.memory-btn {
    width: 100%;

    padding: 11px;

    border: 1px solid var(--border);

    border-radius: 10px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;
}

.memory-btn:hover {
    background: var(--panel);
    color: var(--text);
}


/* =====================================================
   MAIN
   ===================================================== */

.main {
    flex: 1;

    display: flex;

    flex-direction: column;

    min-width: 0;
}


/* =====================================================
   TOPBAR
   ===================================================== */

.topbar {
    height: 65px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    border-bottom: 1px solid var(--border);

    background: rgba(11,15,20,.85);

    backdrop-filter: blur(12px);
}

.topbar-title {
    font-weight: 700;
}

.status {
    display: flex;

    align-items: center;

    gap: 7px;

    color: var(--muted);

    font-size: 12px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #3fb950;

    box-shadow:
        0 0 10px #3fb950;
}

.menu-btn {
    display: none;

    border: none;

    background: transparent;

    color: white;

    font-size: 22px;

    cursor: pointer;
}


/* =====================================================
   CHAT
   ===================================================== */

.chat {
    flex: 1;

    overflow-y: auto;

    padding: 35px 20px 160px;
}

.chat-inner {
    max-width: 900px;

    margin: auto;
}

.welcome {
    text-align: center;

    padding-top: 10vh;
}

.welcome-whale {
    font-size: 65px;

    margin-bottom: 15px;
}

.welcome h1 {
    font-size: 30px;

    margin-bottom: 10px;
}

.welcome p {
    color: var(--muted);

    font-size: 15px;
}


/* =====================================================
   MESSAGE
   ===================================================== */

.message {
    display: flex;

    margin-bottom: 24px;

    gap: 12px;
}

.message.user {
    justify-content: flex-start;
}

.message.assistant {
    justify-content: flex-end;
}

.avatar {
    width: 36px;
    height: 36px;

    min-width: 36px;

    border-radius: 11px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: var(--panel2);

    font-size: 18px;
}

.message.user .avatar {
    order: 2;
}

.bubble {
    max-width: min(760px, 85%);

    padding: 13px 16px;

    border-radius: 16px;

    line-height: 1.9;

    font-size: 15px;

    white-space: normal;

    overflow-wrap: anywhere;
}

.message.user .bubble {
    background: var(--user);

    border-bottom-right-radius: 5px;
}

.message.assistant .bubble {
    background: var(--assistant);

    border: 1px solid var(--border);

    border-bottom-left-radius: 5px;
}

.bubble p {
    margin-bottom: 10px;
}

.bubble p:last-child {
    margin-bottom: 0;
}

.bubble h1,
.bubble h2,
.bubble h3 {
    margin: 12px 0 8px;
}

.bubble ul,
.bubble ol {
    padding-right: 22px;

    margin: 8px 0;
}

.bubble code {
    background: rgba(255,255,255,.08);

    padding: 2px 5px;

    border-radius: 5px;

    direction: ltr;
}

.bubble pre {
    direction: ltr;

    text-align: left;

    background: #090d12;

    border: 1px solid var(--border);

    padding: 14px;

    border-radius: 10px;

    overflow-x: auto;

    margin: 12px 0;
}

.bubble pre code {
    background: transparent;

    padding: 0;
}


/* =====================================================
   WEB SOURCES
   ===================================================== */

.sources {
    margin-top: 15px;

    border-top: 1px solid var(--border);

    padding-top: 12px;
}

.sources-title {
    font-size: 13px;

    color: var(--muted);

    margin-bottom: 8px;
}

.source {
    display: block;

    text-decoration: none;

    color: var(--text);

    background: rgba(255,255,255,.03);

    border: 1px solid var(--border);

    padding: 9px 11px;

    border-radius: 9px;

    margin-bottom: 6px;

    font-size: 13px;

    transition: .2s;
}

.source:hover {
    background: rgba(255,255,255,.07);
}

.source-url {
    display: block;

    color: var(--muted);

    font-size: 11px;

    direction: ltr;

    text-align: left;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    margin-top: 3px;
}


/* =====================================================
   TYPING
   ===================================================== */

.typing {
    display: flex;

    gap: 5px;

    align-items: center;

    padding: 8px;
}

.typing span {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--muted);

    animation:
        typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%, 60%, 100% {
        transform: translateY(0);
        opacity: .4;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}


/* =====================================================
   INPUT
   ===================================================== */

.input-area {
    position: fixed;

    bottom: 0;

    left: 290px;
    right: 0;

    padding: 15px 20px 20px;

    background:
        linear-gradient(
            transparent,
            var(--bg) 25%
        );
}

.input-inner {
    max-width: 900px;

    margin: auto;
}

.input-box {
    display: flex;

    align-items: flex-end;

    gap: 8px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 8px;

    box-shadow:
        0 12px 45px rgba(0,0,0,.3);
}

#messageInput {
    flex: 1;

    resize: none;

    max-height: 180px;

    min-height: 42px;

    background: transparent;

    border: none;

    outline: none;

    color: var(--text);

    padding: 10px 12px;

    font-size: 15px;

    line-height: 1.7;
}

#messageInput::placeholder {
    color: #697483;
}

.web-toggle {
    height: 42px;

    padding: 0 13px;

    border-radius: 11px;

    border: 1px solid var(--border);

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    white-space: nowrap;

    transition: .2s;
}

.web-toggle.active {
    color: white;

    background: rgba(47,129,247,.2);

    border-color: var(--accent);
}

.send-btn {
    width: 42px;
    height: 42px;

    border: none;

    border-radius: 12px;

    background: var(--accent2);

    color: white;

    cursor: pointer;

    font-size: 18px;

    transition: .2s;
}

.send-btn:hover {
    transform: translateY(-1px);

    filter: brightness(1.1);
}

.send-btn:disabled {
    opacity: .5;

    cursor: not-allowed;

    transform: none;
}

.input-hint {
    text-align: center;

    color: #66707d;

    font-size: 11px;

    margin-top: 8px;
}


/* =====================================================
   MEMORY MODAL
   ===================================================== */

.modal {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.65);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(520px, 92vw);

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 20px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.5);
}

.modal-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.close-btn {
    border: none;

    background: transparent;

    color: var(--muted);

    font-size: 20px;

    cursor: pointer;
}

.memory-form {
    display: flex;

    gap: 8px;

    margin-bottom: 15px;
}

.memory-form input {
    flex: 1;

    min-width: 0;

    background: var(--bg);

    color: var(--text);

    border: 1px solid var(--border);

    border-radius: 9px;

    padding: 10px;
}

.memory-form button {
    background: var(--accent2);

    color: white;

    border: none;

    border-radius: 9px;

    padding: 0 15px;

    cursor: pointer;
}

.memory-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    background: var(--bg);

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 10px;

    margin-bottom: 7px;
}

.memory-content {
    overflow: hidden;
}

.memory-key {
    font-weight: 700;

    font-size: 13px;
}

.memory-value {
    color: var(--muted);

    font-size: 12px;

    margin-top: 3px;

    overflow: hidden;

    text-overflow: ellipsis;
}

.memory-delete {
    border: none;

    background: transparent;

    color: #ff6b6b;

    cursor: pointer;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 800px) {

    .sidebar {
        position: fixed;

        z-index: 50;

        top: 0;
        bottom: 0;
        right: -300px;

        transition: right .25s;
    }

    .sidebar.open {
        right: 0;
    }

    .menu-btn {
        display: block;
    }

    .input-area {
        left: 0;
    }

    .topbar {
        padding: 0 13px;
    }

    .chat {
        padding-left: 10px;
        padding-right: 10px;
    }

    .bubble {
        max-width: 90%;
    }

    .web-toggle {
        font-size: 12px;

        padding: 0 9px;
    }

}

</style>

</head>


<body>

<div class="app">


    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">

            <div class="logo">

                <div class="whale">
                    🐋
                </div>

                <span>
                    Whale AI
                </span>

            </div>


            <button
                class="new-chat"
                onclick="newConversation()"
            >
                ＋ گفتگوی جدید
            </button>

        </div>


        <div
            class="conversations"
            id="conversationList"
        ></div>


        <div class="sidebar-footer">

            <button
                class="memory-btn"
                onclick="openMemory()"
            >
                🧠 حافظه Whale
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <!-- TOPBAR -->

        <header class="topbar">

            <div
                style="display:flex;align-items:center;gap:12px;"
            >

                <button
                    class="menu-btn"
                    onclick="toggleSidebar()"
                >
                    ☰
                </button>

                <div class="topbar-title">
                    Whale AI
                </div>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                <span id="statusText">
                    آماده
                </span>

            </div>

        </header>


        <!-- CHAT -->

        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-whale">
                        🐋
                    </div>

                    <h1>
                        به Whale AI خوش آمدی
                    </h1>

                    <p>
                        هر چیزی می‌خواهی بپرس.
                    </p>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-inner">

                <div class="input-box">


                    <textarea
                        id="messageInput"
                        placeholder="پیامت را بنویس..."
                        rows="1"
                    ></textarea>


                    <button
                        class="web-toggle"
                        id="webToggle"
                        onclick="toggleWeb()"
                    >
                        🌐 وب
                    </button>


                    <button
                        class="send-btn"
                        id="sendButton"
                        onclick="sendMessage()"
                    >
                        ➤
                    </button>

                </div>


                <div class="input-hint">
                    Enter برای ارسال • Shift + Enter برای خط جدید
                </div>

            </div>

        </div>

    </main>

</div>


<!-- MEMORY MODAL -->

<div
    class="modal"
    id="memoryModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <strong>
                🧠 حافظه Whale
            </strong>

            <button
                class="close-btn"
                onclick="closeMemory()"
            >
                ×
            </button>

        </div>


        <div class="memory-form">

            <input
                id="memoryKey"
                placeholder="کلید"
            >

            <input
                id="memoryValue"
                placeholder="مقدار"
            >

            <button
                onclick="addMemory()"
            >
                ذخیره
            </button>

        </div>


        <div id="memoryList"></div>

    </div>

</div>


<script>

/* =====================================================
   STATE
   ===================================================== */

let currentConversationId = null;

let webEnabled = false;

let sending = false;


/* =====================================================
   ELEMENTS
   ===================================================== */

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const statusText =
    document.getElementById("statusText");

const sidebar =
    document.getElementById("sidebar");


/* =====================================================
   MARKDOWN
   ===================================================== */

function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}


function markdown(text) {

    let html =
        escapeHtml(
            String(text)
        );


    html = html.replace(
        /```([\s\S]*?)```/g,
        function(_, code) {

            return (
                "<pre><code>" +
                code.trim() +
                "</code></pre>"
            );
        }
    );


    html = html.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );


    html = html.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
    );


    html = html.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
    );


    html = html.replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
    );


    html = html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );


    html = html.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    );


    html = html.replace(
        /^\- (.*)$/gm,
        "<li>$1</li>"
    );


    html = html.replace(
        /(<li>.*<\/li>)/gs,
        "<ul>$1</ul>"
    );


    html = html.replace(
        /\n/g,
        "<br>"
    );


    return html;
}


/* =====================================================
   SCROLL
   ===================================================== */

function scrollBottom() {

    setTimeout(() => {

        chat.scrollTop =
            chat.scrollHeight;

    }, 20);
}


/* =====================================================
   WELCOME
   ===================================================== */

function hideWelcome() {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {

        welcome.remove();

    }
}


/* =====================================================
   ADD MESSAGE
   ===================================================== */

function addMessage(
    role,
    content,
    sources = []
) {

    hideWelcome();


    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " + role;


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "👤"
            : "🐋";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.innerHTML =
        markdown(content);


    if (
        role === "assistant" &&
        sources &&
        sources.length
    ) {

        const sourceBox =
            document.createElement(
                "div"
            );

        sourceBox.className =
            "sources";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "sources-title";

        title.textContent =
            "🌐 منابع وب";


        sourceBox.appendChild(
            title
        );


        sources.forEach(
            source => {

                if (!source.url)
                    return;


                const link =
                    document.createElement(
                        "a"
                    );

                link.className =
                    "source";

                link.href =
                    source.url;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";


                link.innerHTML =
                    escapeHtml(
                        source.title ||
                        source.url
                    ) +
                    '<span class="source-url">' +
                    escapeHtml(
                        source.url
                    ) +
                    "</span>";


                sourceBox.appendChild(
                    link
                );

            }
        );


        bubble.appendChild(
            sourceBox
        );

    }


    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        bubble
    );


    chatInner.appendChild(
        wrapper
    );


    scrollBottom();

    return wrapper;
}


/* =====================================================
   TYPING
   ===================================================== */

function showTyping() {

    hideWelcome();


    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message assistant";

    wrapper.id =
        "typingMessage";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        "🐋";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.innerHTML = `
        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;


    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        bubble
    );


    chatInner.appendChild(
        wrapper
    );


    scrollBottom();
}


function hideTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {

        typing.remove();

    }
}


/* =====================================================
   SEND
   ===================================================== */

async function sendMessage() {

    if (sending)
        return;


    const message =
        input.value.trim();


    if (!message)
        return;


    sending = true;

    sendButton.disabled =
        true;

    statusText.textContent =
        "در حال پاسخ‌گویی...";


    input.value = "";

    autoResize();


    addMessage(
        "user",
        message
    );


    showTyping();


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                message,

                            conversation_id:
                                currentConversationId,

                            web:
                                webEnabled
                        })
                }
            );


        const data =
            await response.json();


        hideTyping();


        if (!response.ok) {

            addMessage(
                "assistant",
                "❌ " +
                (
                    data.error ||
                    "خطایی رخ داد."
                )
            );

            return;
        }


        currentConversationId =
            data.conversation_id;


        addMessage(
            "assistant",
            data.content,
            data.web || []
        );


        await loadConversations();


    } catch (error) {

        hideTyping();

        addMessage(
            "assistant",
            "❌ ارتباط با سرور برقرار نشد."
        );

        console.error(error);

    } finally {

        sending = false;

        sendButton.disabled =
            false;

        statusText.textContent =
            "آماده";

        input.focus();

    }
}


/* =====================================================
   ENTER
   ===================================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   AUTO RESIZE
   ===================================================== */

input.addEventListener(
    "input",
    autoResize
);


function autoResize() {

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";
}


/* =====================================================
   WEB
   ===================================================== */

function toggleWeb() {

    webEnabled =
        !webEnabled;


    const button =
        document.getElementById(
            "webToggle"
        );


    button.classList.toggle(
        "active",
        webEnabled
    );


    button.textContent =
        webEnabled
            ? "🌐 وب روشن"
            : "🌐 وب";

}


/* =====================================================
   NEW CONVERSATION
   ===================================================== */

async function newConversation() {

    try {

        const response =
            await fetch(
                "/conversations",
                {
                    method:
                        "POST"
                }
            );


        const data =
            await response.json();


        currentConversationId =
            data.id;


        chatInner.innerHTML = `
            <div class="welcome" id="welcome">

                <div class="welcome-whale">
                    🐋
                </div>

                <h1>
                    گفتگوی جدید
                </h1>

                <p>
                    آماده‌ام. چه کمکی از من می‌خواهی؟
                </p>

            </div>
        `;


        await loadConversations();

        closeSidebar();

        input.focus();


    } catch (error) {

        console.error(error);

    }
}


/* =====================================================
   LOAD CONVERSATIONS
   ===================================================== */

async function loadConversations() {

    try {

        const response =
            await fetch(
                "/conversations"
            );


        const conversations =
            await response.json();


        const list =
            document.getElementById(
                "conversationList"
            );


        list.innerHTML = "";


        conversations.forEach(
            conversation => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "conversation" +
                    (
                        currentConversationId ===
                        conversation.id
                            ? " active"
                            : ""
                    );


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "conversation-title";

                title.textContent =
                    conversation.title ||
                    "گفتگوی جدید";


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "delete-conversation";

                deleteButton.textContent =
                    "×";


                deleteButton.onclick =
                    function(event) {

                        event.stopPropagation();

                        deleteConversation(
                            conversation.id
                        );

                    };


                item.appendChild(
                    title
                );

                item.appendChild(
                    deleteButton
                );


                item.onclick =
                    function() {

                        loadConversation(
                            conversation.id
                        );

                    };


                list.appendChild(
                    item
                );

            }
        );


    } catch (error) {

        console.error(error);

    }
}


/* =====================================================
   LOAD ONE
   ===================================================== */

async function loadConversation(
    id
) {

    try {

        const response =
            await fetch(
                `/conversations/${id}/messages`
            );


        const messages =
            await response.json();


        currentConversationId =
            id;


        chatInner.innerHTML =
            "";


        messages.forEach(
            message => {

                addMessage(
                    message.role,
                    message.content
                );

            }
        );


        await loadConversations();

        closeSidebar();

        scrollBottom();


    } catch (error) {

        console.error(error);

    }
}


/* =====================================================
   DELETE CONVERSATION
   ===================================================== */

async function deleteConversation(
    id
) {

    if (
        !confirm(
            "این گفتگو حذف شود؟"
        )
    ) {

        return;

    }


    try {

        await fetch(
            `/conversations/${id}`,
            {
                method:
                    "DELETE"
            }
        );


        if (
            currentConversationId ===
            id
        ) {

            currentConversationId =
                null;


            chatInner.innerHTML = `
                <div class="welcome" id="welcome">

                    <div class="welcome-whale">
                        🐋
                    </div>

                    <h1>
                        Whale AI
                    </h1>

                    <p>
                        یک گفتگوی جدید شروع کن.
                    </p>

                </div>
            `;

        }


        await loadConversations();


    } catch (error) {

        console.error(error);

    }
}


/* =====================================================
   MEMORY
   ===================================================== */

async function openMemory() {

    document
        .getElementById(
            "memoryModal"
        )
        .classList.add(
            "show"
        );


    await loadMemory();

}


function closeMemory() {

    document
        .getElementById(
            "memoryModal"
        )
        .classList.remove(
            "show"
        );

}


async function loadMemory() {

    try {

        const response =
            await fetch(
                "/memory"
            );


        const data =
            await response.json();


        const list =
            document.getElementById(
                "memoryList"
            );


        list.innerHTML =
            "";


        data.memories.forEach(
            memory => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "memory-item";


                item.innerHTML = `
                    <div class="memory-content">
                        <div class="memory-key">
                            ${escapeHtml(memory.key)}
                        </div>

                        <div class="memory-value">
                            ${escapeHtml(memory.value)}
                        </div>
                    </div>
                `;


                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "memory-delete";

                button.textContent =
                    "حذف";


                button.onclick =
                    function() {

                        deleteMemory(
                            memory.key
                        );

                    };


                item.appendChild(
                    button
                );


                list.appendChild(
                    item
                );

            }
        );


    } catch (error) {

        console.error(error);

    }
}


async function addMemory() {

    const key =
        document
            .getElementById(
                "memoryKey"
            )
            .value
            .trim();


    const value =
        document
            .getElementById(
                "memoryValue"
            )
            .value
            .trim();


    if (!key || !value)
        return;


    await fetch(
        "/memory",
        {
            method:
                "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify({
                    key:
                        key,

                    value:
                        value
                })
        }
    );


    document
        .getElementById(
            "memoryKey"
        )
        .value = "";


    document
        .getElementById(
            "memoryValue"
        )
        .value = "";


    await loadMemory();

}


async function deleteMemory(
    key
) {

    await fetch(
        "/memory/" +
        encodeURIComponent(key),
        {
            method:
                "DELETE"
        }
    );


    await loadMemory();

}


/* =====================================================
   SIDEBAR
   ===================================================== */

function toggleSidebar() {

    sidebar.classList.toggle(
        "open"
    );

}


function closeSidebar() {

    sidebar.classList.remove(
        "open"
    );

}


/* =====================================================
   INIT
   ===================================================== */

async function init() {

    await loadConversations();

    input.focus();

}


init();

</script>
