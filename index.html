<script>

let currentConversationId = null;

let isSending = false;

let abortController = null;


/* =========================
   ELEMENTS
========================= */

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chat =
    document.getElementById("chat");

const typing =
    document.getElementById("typing");

const welcome =
    document.getElementById("welcome");

const historyButton =
    document.getElementById("historyButton");

const historyList =
    document.getElementById("historyList");

const newChatButton =
    document.getElementById("newChatButton");

const clearAll =
    document.getElementById("clearAll");

const mobileMenu =
    document.getElementById("mobileMenu");

const sidebar =
    document.getElementById("sidebar");

const modelStatus =
    document.getElementById("modelStatus");


/* =========================
   WELCOME
========================= */

function showWelcome(){

    welcome.style.display =
        "block";

}


function hideWelcome(){

    welcome.style.display =
        "none";

}


/* =========================
   SEND BUTTON STATE
========================= */

function setSendingState(){

    send.classList.add(
        "stop-mode"
    );

    send.textContent =
        "■";

    send.setAttribute(
        "aria-label",
        "توقف"
    );

    input.disabled = false;

    modelStatus.textContent =
        "در حال پاسخ‌گویی...";

}


function setIdleState(){

    send.classList.remove(
        "stop-mode"
    );

    send.textContent =
        "➤";

    send.setAttribute(
        "aria-label",
        "ارسال"
    );

    input.disabled = false;

    send.disabled = false;

    modelStatus.textContent =
        "آماده پاسخ‌گویی";

}


/* =========================
   STOP AI
========================= */

function stopGeneration(){

    if(
        abortController
    ){

        abortController.abort();

        abortController = null;

    }

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    text,
    type
){

    hideWelcome();


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row " +
        (
            type === "user"
                ? "user-row"
                : "bot-row"
        );


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar " +
        (
            type === "user"
                ? "user-avatar"
                : "bot-avatar"
        );


    avatar.textContent =
        type === "user"
            ? "👤"
            : "🐋";


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "message-box";


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        (
            type === "user"
                ? "user-message"
                : "bot-message"
        );


    message.textContent =
        text;


    box.appendChild(
        message
    );


    if(type === "bot"){

        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "message-actions";


        const copy =
            document.createElement(
                "button"
            );


        copy.className =
            "copy-btn";


        copy.textContent =
            "📋 کپی";


        copy.onclick =
            async function(){

                try{

                    await navigator.clipboard.writeText(
                        message.textContent
                    );

                    copy.textContent =
                        "✓ کپی شد";

                    setTimeout(
                        function(){

                            copy.textContent =
                                "📋 کپی";

                        },
                        1500
                    );

                }catch(error){

                    console.error(
                        error
                    );

                }

            };


        actions.appendChild(
            copy
        );

        box.appendChild(
            actions
        );

    }


    if(type === "user"){

        row.appendChild(
            box
        );

        row.appendChild(
            avatar
        );

    }else{

        row.appendChild(
            avatar
        );

        row.appendChild(
            box
        );

    }


    chat.insertBefore(
        row,
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return message;

}


/* =========================
   CLEAR CHAT
========================= */

function clearChat(){

    chat
        .querySelectorAll(
            ".message-row"
        )
        .forEach(
            element =>
                element.remove()
        );

    showWelcome();

}


/* =========================
   NEW CONVERSATION
========================= */

async function createNewConversation(){

    if(isSending){

        stopGeneration();

    }


    try{

        const response =
            await fetch(
                "/conversations",
                {
                    method:"POST"
                }
            );


        if(!response.ok){

            throw new Error(
                "خطا در ساخت گفتگو"
            );

        }


        const data =
            await response.json();


        currentConversationId =
            data.id;


        clearChat();


        sidebar.classList.remove(
            "open"
        );


        input.focus();


        await loadConversations();


    }catch(error){

        console.error(
            error
        );

    }

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    /*
     * اگر در حال پاسخ هستیم،
     * کلیک روی همان دکمه = توقف
     */

    if(isSending){

        stopGeneration();

        return;

    }


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    isSending = true;

    abortController =
        new AbortController();


    setSendingState();


    addMessage(
        text,
        "user"
    );


    input.value = "";

    input.style.height =
        "auto";


    typing.style.display =
        "flex";


    let botMessage = null;

    let streamFinished = false;


    try{

        const response =
            await fetch(
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/x-ndjson"
                    },

                    body:JSON.stringify({

                        message:text,

                        conversation_id:
                            currentConversationId

                    }),

                    signal:
                        abortController.signal
                }
            );


        if(!response.ok){

            let errorMessage =
                "خطا در ارتباط با سرور.";


            try{

                const errorData =
                    await response.json();


                if(
                    errorData.error
                ){

                    errorMessage =
                        errorData.error;

                }

            }catch(_){}


            throw new Error(
                errorMessage
            );

        }


        if(!response.body){

            throw new Error(
                "سرور پاسخی ارسال نکرد."
            );

        }


        typing.style.display =
            "none";


        botMessage =
            addMessage(
                "",
                "bot"
            );


        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder(
                "utf-8"
            );


        let buffer = "";


        while(true){

            const result =
                await reader.read();


            if(result.done){

                streamFinished =
                    true;

                break;

            }


            buffer +=
                decoder.decode(
                    result.value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split("\n");


            buffer =
                lines.pop() || "";


            for(
                const line of lines
            ){

                const cleanLine =
                    line.trim();


                if(!cleanLine){

                    continue;

                }


                let data;


                try{

                    data =
                        JSON.parse(
                            cleanLine
                        );

                }catch(error){

                    console.warn(
                        "Invalid stream data:",
                        cleanLine
                    );

                    continue;

                }


                if(
                    data.type ===
                    "text"
                ){

                    if(!botMessage){

                        botMessage =
                            addMessage(
                                "",
                                "bot"
                            );

                    }


                    botMessage.textContent +=
                        data.content || "";


                    chat.scrollTop =
                        chat.scrollHeight;

                }


                else if(
                    data.type ===
                    "done"
                ){

                    if(
                        data.conversation_id
                    ){

                        currentConversationId =
                            data.conversation_id;

                    }

                }


                else if(
                    data.type ===
                    "error"
                ){

                    if(!botMessage){

                        botMessage =
                            addMessage(
                                "",
                                "bot"
                            );

                    }


                    botMessage.textContent =
                        data.content ||
                        "خطایی رخ داد.";

                }

            }

        }


        /*
         * آخرین داده باقی‌مانده
         */

        if(buffer.trim()){

            try{

                const data =
                    JSON.parse(
                        buffer.trim()
                    );


                if(
                    data.type ===
                    "text"
                    &&
                    botMessage
                ){

                    botMessage.textContent +=
                        data.content || "";

                }


                if(
                    data.type ===
                    "done"
                    &&
                    data.conversation_id
                ){

                    currentConversationId =
                        data.conversation_id;

                }

            }catch(_){}

        }


        if(
            botMessage
            &&
            !botMessage.textContent.trim()
        ){

            botMessage.textContent =
                "پاسخی دریافت نشد.";

        }


        await loadConversations();


    }catch(error){

        /*
         * AbortError یعنی کاربر
         * خودش پاسخ را متوقف کرده.
         */

        if(
            error.name ===
            "AbortError"
        ){

            typing.style.display =
                "none";


            if(botMessage){

                if(
                    botMessage.textContent.trim()
                ){

                    botMessage.textContent +=
                        "\n\n⏹ پاسخ متوقف شد.";

                }else{

                    botMessage.textContent =
                        "⏹ پاسخ متوقف شد.";

                }

            }else{

                botMessage =
                    addMessage(
                        "⏹ پاسخ متوقف شد.",
                        "bot"
                    );

            }

        }

        else{

            console.error(
                "CHAT ERROR:",
                error
            );


            typing.style.display =
                "none";


            const message =
                error.message ||
                "ارتباط با سرور برقرار نشد.";


            if(botMessage){

                botMessage.textContent =
                    message;

            }else{

                addMessage(
                    message,
                    "bot"
                );

            }

        }

    }finally{

        /*
         * بسیار مهم:
         * بعد از هر حالت، ارسال دوباره
         * آزاد می‌شود.
         */

        typing.style.display =
            "none";


        isSending = false;


        abortController =
            null;


        setIdleState();


        input.focus();


        chat.scrollTop =
            chat.scrollHeight;

    }

}


/* =========================
   LOAD CONVERSATIONS
========================= */

async function loadConversations(){

    try{

        const response =
            await fetch(
                "/conversations"
            );


        if(!response.ok){

            throw new Error(
                "خطا در دریافت تاریخچه"
            );

        }


        const data =
            await response.json();


        historyList.innerHTML =
            "";


        if(
            !data.length
        ){

            historyList.innerHTML =
                `
                <div
                    style="
                    padding:15px;
                    color:#71869d;
                    font-size:12px;
                    text-align:center;
                    "
                >
                    هنوز گفت‌وگویی وجود ندارد.
                </div>
                `;

            return;

        }


        data.forEach(
            conversation => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "conversation";


                if(
                    conversation.id ===
                    currentConversationId
                ){

                    row.classList.add(
                        "active"
                    );

                }


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "conversation-info";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "conversation-title";


                title.textContent =
                    conversation.title ||
                    "گفت‌وگوی جدید";


                const count =
                    document.createElement(
                        "div"
                    );


                count.className =
                    "conversation-count";


                count.textContent =
                    conversation.message_count +
                    " پیام";


                info.appendChild(
                    title
                );

                info.appendChild(
                    count
                );


                info.onclick =
                    function(){

                        openConversation(
                            conversation.id
                        );

                    };


                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-conversation";


                deleteButton.textContent =
                    "🗑";


                deleteButton.onclick =
                    function(event){

                        event.stopPropagation();


                        deleteConversation(
                            conversation.id
                        );

                    };


                row.appendChild(
                    info
                );

                row.appendChild(
                    deleteButton
                );


                historyList.appendChild(
                    row
                );

            }
        );


    }catch(error){

        console.error(
            error
        );

    }

}


/* =========================
   OPEN CONVERSATION
========================= */

async function openConversation(
    id
){

    if(isSending){

        stopGeneration();

    }


    try{

        const response =
            await fetch(
                "/conversations/" +
                id +
                "/messages"
            );


        if(!response.ok){

            throw new Error(
                "خطا در دریافت گفتگو"
            );

        }


        const data =
            await response.json();


        currentConversationId =
            id;


        clearChat();


        data.forEach(
            message => {

                addMessage(
                    message.content,
                    message.role ===
                    "user"
                        ? "user"
                        : "bot"
                );

            }
        );


        sidebar.classList.remove(
            "open"
        );


        await loadConversations();


        input.focus();


    }catch(error){

        console.error(
            error
        );

    }

}


/* =========================
   DELETE
========================= */

async function deleteConversation(
    id
){

    if(
        !confirm(
            "این گفت‌وگو حذف شود؟"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                "/conversations/" +
                id,
                {
                    method:"DELETE"
                }
            );


        if(!response.ok){

            throw new Error(
                "خطا در حذف گفتگو"
            );

        }


        if(
            currentConversationId ===
            id
        ){

            currentConversationId =
                null;

            clearChat();

        }


        await loadConversations();


    }catch(error){

        console.error(
            error
        );

    }

}
