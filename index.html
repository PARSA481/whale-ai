```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Whale AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050914;
    --bg2:#08111f;
    --panel:rgba(9,18,31,.82);
    --panel2:rgba(14,27,45,.88);
    --border:rgba(255,255,255,.085);
    --border2:rgba(255,255,255,.13);
    --text:#f5f8ff;
    --muted:#8ea0b7;
    --muted2:#61748c;
    --blue:#2d8cff;
    --blue2:#1266d7;
    --cyan:#42c8ff;
    --green:#38dc8a;
    --danger:#ff6378;
    --user:#176fd4;
    --bot:#0d1a2c;
    --shadow:0 25px 80px rgba(0,0,0,.35);
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    color:var(--text);
    font-family:
        Inter,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(28,105,185,.30),
            transparent 38%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(20,90,180,.13),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #03060d,
            #07111e 52%,
            #040812
        );
}

button,
textarea,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:305px;
    height:100vh;
    flex:0 0 305px;

    display:flex;
    flex-direction:column;

    background:
        linear-gradient(
            180deg,
            rgba(8,18,31,.94),
            rgba(5,12,22,.96)
        );

    border-left:1px solid var(--border);
    backdrop-filter:blur(25px);

    z-index:100;

    transition:
        transform .3s ease,
        width .3s ease;
}

.brand{
    padding:20px;
    display:flex;
    align-items:center;
    gap:13px;
    border-bottom:1px solid var(--border);
}

.logo{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #39a5ff,
            #1452a5
        );

    box-shadow:
        0 10px 35px rgba(35,137,255,.25),
        inset 0 1px 1px rgba(255,255,255,.25);

    font-size:25px;
}

.brand-name{
    font-size:19px;
    font-weight:800;
    letter-spacing:-.3px;
}

.brand-desc{
    margin-top:3px;
    color:var(--muted);
    font-size:11px;
}

.new-chat{
    margin:18px;
    padding:13px 15px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    border-radius:13px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue2)
        );

    box-shadow:
        0 10px 30px rgba(35,137,255,.18);

    font-weight:700;

    transition:.2s;
}

.new-chat:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.sidebar-section-title{
    padding:0 19px 10px;

    color:var(--muted2);

    font-size:11px;
    font-weight:700;
}

#historyList{
    flex:1;
    overflow-y:auto;
    padding:0 10px 15px;
}

#historyList::-webkit-scrollbar,
#chat::-webkit-scrollbar{
    width:6px;
}

#historyList::-webkit-scrollbar-thumb,
#chat::-webkit-scrollbar-thumb{
    background:#1a3048;
    border-radius:20px;
}

.conversation{
    min-height:58px;

    display:flex;
    align-items:center;
    gap:8px;

    margin:3px 0;
    padding:9px 10px;

    border:1px solid transparent;
    border-radius:12px;

    transition:.18s;
}

.conversation:hover{
    background:rgba(255,255,255,.045);
    border-color:var(--border);
}

.conversation.active{
    background:
        linear-gradient(
            90deg,
            rgba(35,137,255,.15),
            rgba(35,137,255,.045)
        );

    border-color:
        rgba(35,137,255,.18);
}

.conversation-info{
    flex:1;
    min-width:0;
    cursor:pointer;
}

.conversation-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    font-size:13px;
    color:#e7eef8;
}

.conversation-count{
    margin-top:5px;
    color:var(--muted2);
    font-size:10px;
}

.delete-conversation{
    width:29px;
    height:29px;

    border-radius:8px;

    background:transparent;
    color:#62758c;

    opacity:.65;

    transition:.2s;
}

.conversation:hover .delete-conversation{
    opacity:1;
}

.delete-conversation:hover{
    color:#ff6d80;
    background:rgba(255,70,90,.09);
}

.sidebar-bottom{
    padding:13px;
    border-top:1px solid var(--border);
}

.clear-all{
    width:100%;
    padding:10px;

    border-radius:10px;

    background:transparent;
    color:#73869d;

    font-size:12px;

    transition:.2s;
}

.clear-all:hover{
    color:#ff7182;
    background:rgba(255,255,255,.035);
}

/* =====================================================
   MAIN
===================================================== */

.main{
    min-width:0;
    flex:1;
    height:100vh;

    display:flex;
    flex-direction:column;

    position:relative;
}

.topbar{
    height:72px;
    flex:0 0 72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    border-bottom:1px solid var(--border);

    background:
        rgba(4,10,18,.68);

    backdrop-filter:blur(22px);

    z-index:30;
}

.model-info{
    display:flex;
    align-items:center;
    gap:10px;
}

.status{
    width:9px;
    height:9px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 0 4px rgba(56,220,138,.08),
        0 0 15px rgba(56,220,138,.65);
}

.model-name{
    font-size:14px;
    font-weight:800;
}

.model-status{
    margin-top:3px;
    color:var(--muted);
    font-size:10px;
}

.top-actions{
    display:flex;
    gap:7px;
}

.top-button{
    height:38px;
    padding:0 12px;

    display:flex;
    align-items:center;
    gap:7px;

    border:1px solid var(--border);

    border-radius:10px;

    background:rgba(255,255,255,.045);
    color:#d5e0ec;

    font-size:12px;

    transition:.2s;
}

.top-button:hover{
    background:rgba(255,255,255,.075);
    border-color:var(--border2);
}

.mobile-menu{
    display:none;

    width:38px;
    height:38px;

    margin-left:8px;

    border-radius:10px;

    background:rgba(255,255,255,.055);
    color:white;

    font-size:18px;
}

/* =====================================================
   CHAT
===================================================== */

#chat{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:
        25px
        max(20px,calc((100% - 980px)/2))
        30px;

    scroll-behavior:smooth;
}

.welcome{
    max-width:900px;
    margin:0 auto;

    padding-top:8vh;

    text-align:center;

    animation:fadeIn .55s ease;
}

.welcome-logo{
    width:92px;
    height:92px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:28px;

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(255,255,255,.25),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #39a8ff,
            #0b3b79
        );

    box-shadow:
        0 25px 65px rgba(20,120,255,.22),
        inset 0 1px 1px rgba(255,255,255,.25);

    font-size:45px;
}

.welcome h1{
    margin-top:25px;

    font-size:
        clamp(28px,4vw,42px);

    letter-spacing:-1.5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #9ecaff
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.welcome p{
    margin-top:10px;

    color:var(--muted);

    font-size:13px;
}

.quick-actions{
    margin:32px auto 0;

    max-width:720px;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:10px;
}

.quick-card{
    padding:16px 13px;

    border:1px solid var(--border);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );

    color:#dbe7f4;

    text-align:right;

    transition:.2s;
}

.quick-card:hover{
    transform:translateY(-2px);

    border-color:
        rgba(66,164,255,.28);

    background:
        rgba(35,137,255,.075);
}

.quick-icon{
    font-size:20px;
}

.quick-title{
    margin-top:9px;
    font-size:12px;
    font-weight:700;
}

.quick-desc{
    margin-top:4px;
    color:var(--muted2);
    font-size:10px;
}

.message-row{
    display:flex;
    align-items:flex-start;

    margin:20px 0;

    animation:messageIn .25s ease;
}

.user-row{
    justify-content:flex-start;
}

.bot-row{
    justify-content:flex-end;
}

.avatar{
    width:34px;
    height:34px;
    flex:0 0 34px;

    margin:0 8px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    font-size:16px;
}

.user-avatar{
    background:
        linear-gradient(
            145deg,
            #216ec4,
            #10477f
        );
}

.bot-avatar{
    background:
        linear-gradient(
            145deg,
            #19334f,
            #0c1828
        );

    border:1px solid var(--border);
}

.message-box{
    max-width:min(78%,760px);
}

.message{
    padding:14px 17px;

    border-radius:17px;

    font-size:14px;
    line-height:1.9;

    white-space:pre-wrap;
    word-break:break-word;
}

.user-message{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #1d7ce5,
            #145cad
        );

    border-bottom-left-radius:5px;

    box-shadow:
        0 8px 25px rgba(0,80,180,.12);
}

.bot-message{
    background:
        linear-gradient(
            145deg,
            rgba(18,34,53,.96),
            rgba(10,22,37,.96)
        );

    border:1px solid var(--border);

    border-bottom-right-radius:5px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.12);
}

.message-actions{
    display:flex;
    direction:ltr;

    gap:5px;

    margin-top:5px;
}

.copy-btn{
    padding:4px 7px;

    border-radius:7px;

    background:transparent;
    color:#7890a9;

    opacity:.6;

    font-size:10px;

    transition:.2s;
}

.copy-btn:hover{
    opacity:1;
    background:rgba(255,255,255,.05);
}

#typing{
    display:none;

    align-items:center;
    justify-content:flex-end;

    margin:7px 0 15px;

    color:var(--muted);

    font-size:11px;
}

.typing-dots{
    display:flex;
    gap:4px;

    margin-right:8px;
}

.typing-dots span{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#7894af;

    animation:bounce 1s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.15s;
}

.typing-dots span:nth-child(3){
    animation-delay:.3s;
}

/* =====================================================
   INPUT
===================================================== */

.input-wrapper{
    padding:
        12px
        20px
        19px;

    background:
        linear-gradient(
            transparent,
            rgba(4,9,16,.96) 35%
        );

    z-index:20;
}

.input-box{
    max-width:980px;
    margin:auto;

    display:flex;
    align-items:flex-end;
    gap:8px;

    padding:9px;

    border:1px solid rgba(255,255,255,.10);

    border-radius:18px;

    background:
        rgba(11,24,40,.94);

    box-shadow:
        0 20px 55px rgba(0,0,0,.28);

    transition:.2s;
}

.input-box:focus-within{
    border-color:
        rgba(45,140,255,.48);

    box-shadow:
        0 0 0 3px rgba(45,140,255,.07),
        0 20px 55px rgba(0,0,0,.28);
}

.input-tools{
    display:flex;
    gap:5px;
    padding-bottom:3px;
}

.tool-button{
    width:38px;
    height:38px;

    border-radius:11px;

    background:rgba(255,255,255,.045);
    border:1px solid transparent;

    color:#91a6bc;

    transition:.2s;
}

.tool-button:hover{
    color:#dcecff;
    background:rgba(255,255,255,.075);
    border-color:var(--border);
}

#input{
    flex:1;

    min-width:0;

    max-height:150px;

    resize:none;

    outline:none;
    border:0;

    background:transparent;

    color:white;

    padding:8px 9px;

    line-height:1.65;
    font-size:14px;
}

#input::placeholder{
    color:#62778e;
}

#send{
    width:44px;
    height:44px;
    flex:0 0 44px;

    border-radius:13px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #2e98ff,
            #1263c8
        );

    box-shadow:
        0 8px 25px rgba(35,137,255,.2);

    font-size:18px;

    transition:.2s;
}

#send:hover{
    transform:translateY(-1px) scale(1.025);
}

#send:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
}

.hint{
    max-width:980px;
    margin:7px auto 0;

    text-align:center;

    color:#4f6278;

    font-size:9px;
}

/* =====================================================
   SEARCH / FILE READY UI
===================================================== */

.feature-pill{
    position:relative;
}

.feature-pill.active{
    color:#62b6ff;

    background:
        rgba(35,137,255,.09);

    border-color:
        rgba(35,137,255,.25);
}

.feature-pill::after{
    content:"به‌زودی";

    position:absolute;

    top:-7px;
    left:-5px;

    padding:2px 5px;

    border-radius:5px;

    background:#132a43;

    color:#7290ad;

    font-size:7px;

    opacity:0;

    transition:.2s;
}

.feature-pill:hover::after{
    opacity:1;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

    .sidebar{
        position:fixed;

        top:0;
        right:0;

        transform:translateX(105%);

        box-shadow:
            -25px 0 70px rgba(0,0,0,.45);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        padding:0 12px;
    }

    .top-actions{
        display:none;
    }

    #chat{
        padding:
            18px
            12px
            25px;
    }

    .message-box{
        max-width:84%;
    }

    .welcome{
        padding-top:45px;
    }

    .welcome-logo{
        width:76px;
        height:76px;
        border-radius:23px;
        font-size:37px;
    }

    .welcome h1{
        font-size:27px;
    }

    .quick-actions{
        grid-template-columns:1fr;
        max-width:360px;
    }

    .input-wrapper{
        padding:8px 9px 12px;
    }

    .input-tools{
        display:none;
    }
}

@media(max-width:480px){

    .sidebar{
        width:290px;
        flex-basis:290px;
    }

    .message{
        font-size:13px;
        padding:12px 14px;
    }

    .avatar{
        width:30px;
        height:30px;
        flex-basis:30px;
        margin:0 5px;
    }

    .welcome p{
        font-size:12px;
    }
}

/* =====================================================
   ANIMATION
===================================================== */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes bounce{
    0%,60%,100%{
        transform:translateY(0);
    }

    30%{
        transform:translateY(-4px);
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar" id="sidebar">

    <div class="brand">

        <div class="logo">🐋</div>

        <div>
            <div class="brand-name">Whale AI</div>
            <div class="brand-desc">دستیار هوشمند نسل جدید</div>
        </div>

    </div>

    <button class="new-chat" id="newChatButton">
        <span>＋</span>
        <span>گفت‌وگوی جدید</span>
    </button>

    <div class="sidebar-section-title">
        گفتگوهای اخیر
    </div>

    <div id="historyList"></div>

    <div class="sidebar-bottom">

        <button class="clear-all" id="clearAll">
            🗑 حذف همه گفتگوها
        </button>

    </div>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

<header class="topbar">

    <div class="model-info">

        <button
            class="mobile-menu"
            id="mobileMenu"
        >
            ☰
        </button>

        <div class="status"></div>

        <div>
            <div class="model-name">
                Whale AI
            </div>

            <div class="model-status">
                آماده پاسخ‌گویی
            </div>
        </div>

    </div>

    <div class="top-actions">

        <button
            class="top-button"
            id="historyButton"
        >
            🗂
            <span>تاریخچه</span>
        </button>

    </div>

</header>


<!-- =====================================================
     CHAT
===================================================== -->

<section id="chat">

    <div
        class="welcome"
        id="welcome"
    >

        <div class="welcome-logo">
            🐋
        </div>

        <h1>
            با Whale AI شروع کن
        </h1>

        <p>
            بپرس، تحلیل کن، یاد بگیر و ایده‌پردازی کن.
        </p>


        <div class="quick-actions">

            <button
                class="quick-card"
                data-prompt="یک موضوع را برای من به زبان ساده توضیح بده."
            >

                <div class="quick-icon">
                    💡
                </div>

                <div class="quick-title">
                    توضیح یک موضوع
                </div>

                <div class="quick-desc">
                    مفاهیم سخت را ساده یاد بگیر
                </div>

            </button>


            <button
                class="quick-card"
                data-prompt="برای مطالعه امروز یک برنامه منظم پیشنهاد بده."
            >

                <div class="quick-icon">
                    📚
                </div>

                <div class="quick-title">
                    کمک در مطالعه
                </div>

                <div class="quick-desc">
                    برنامه‌ریزی و یادگیری
                </div>

            </button>


            <button
                class="quick-card"
                data-prompt="یک ایده خلاقانه برای یک پروژه نرم‌افزاری پیشنهاد بده."
            >

                <div class="quick-icon">
                    ⚡
                </div>

                <div class="quick-title">
                    ایده‌پردازی
                </div>

                <div class="quick-desc">
                    ساخت و توسعه ایده‌ها
                </div>

            </button>

        </div>

    </div>


    <div id="typing">

        در حال دریافت پاسخ

        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

</section>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="input-wrapper">

    <div class="input-box">

        <div class="input-tools">

            <!-- آماده برای File Analysis -->
            <button
                class="tool-button feature-pill"
                id="fileButton"
                title="تحلیل فایل"
            >
                📎
            </button>

            <!-- آماده برای Web Search -->
            <button
                class="tool-button feature-pill"
                id="webButton"
                title="جست‌وجوی وب"
            >
                🌐
            </button>

        </div>

        <textarea
            id="input"
            rows="1"
            placeholder="پیامت را برای Whale AI بنویس..."
            autocomplete="off"
        ></textarea>

        <button
            id="send"
            title="ارسال"
        >
            ➤
        </button>

    </div>

    <div class="hint">
        Enter برای ارسال • Shift + Enter برای خط جدید
    </div>

</div>

</main>

</div>


<script>

let currentConversationId = null;
let isSending = false;

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chat =
    document.getElementById("chat");

const typing =
    document.getElementById("typing");

const welcome =
    document.getElementById("welcome");

const historyButton =
    document.getElementById("historyButton");

const historyList =
    document.getElementById("historyList");

const newChatButton =
    document.getElementById("newChatButton");

const clearAll =
    document.getElementById("clearAll");

const mobileMenu =
    document.getElementById("mobileMenu");

    document.getElementById("sidebar");

/* =====================================================
   WELCOME
===================================================== */

function showWelcome(){

    welcome.style.display = "block";

}


function hideWelcome(){

    welcome.style.display = "none";

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(text,type){

    hideWelcome();

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (
            type === "user"
                ? "user-row"
                : "bot-row"
        );


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            type === "user"
                ? "user-avatar"
                : "bot-avatar"
        );

    avatar.textContent =
        type === "user"
            ? "👤"
            : "🐋";


    const box =
        document.createElement("div");

    box.className =
        "message-box";


    const message =
        document.createElement("div");

    message.className =
        "message " +
        (
            type === "user"
                ? "user-message"
                : "bot-message"
        );

    message.textContent =
        text;


    box.appendChild(message);


    if(type === "bot"){

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.className =
            "copy-btn";

        copy.textContent =
            "📋 کپی";


        copy.onclick =
            async () => {

                try{

                    await navigator.clipboard.writeText(
                        message.textContent
                    );

                    copy.textContent =
                        "✓ کپی شد";

                    setTimeout(
                        () => {
                            copy.textContent =
                                "📋 کپی";
                        },
                        1500
                    );

                }catch(error){

                    console.error(error);

                }

            };


        actions.appendChild(copy);

        box.appendChild(actions);

    }


    if(type === "user"){

        row.appendChild(box);
        row.appendChild(avatar);

    }else{

        row.appendChild(avatar);
        row.appendChild(box);

    }


    chat.insertBefore(
        row,
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return message;
}


/* =====================================================
   CLEAR CHAT
===================================================== */

function clearChat(){

    chat
        .querySelectorAll(".message-row")
        .forEach(
            element => element.remove()
        );

    showWelcome();

}


/* =====================================================
   NEW CONVERSATION
===================================================== */

async function createNewConversation(){

    try{

        const response =
            await fetch(
                "/conversations",
                {
                    method:"POST"
                }
            );


        if(!response.ok){

            throw new Error(
                "خطا در ساخت گفتگو"
            );

        }


        const data =
            await response.json();


        currentConversationId =
            data.id;


        clearChat();

        sidebar.classList.remove("open");

        input.focus();

        await loadConversations();

    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    if(isSending){
        return;
    }


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    isSending = true;

    send.disabled = true;


    addMessage(
        text,
        "user"
    );


    input.value = "";

    input.style.height =
        "auto";


    typing.style.display =
        "flex";


    try{

        const response =
            await fetch(
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:text,

                        conversation_id:
                            currentConversationId

                    })
                }
            );


        if(!response.ok){

            const errorData =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );


            throw new Error(
                errorData.error ||
                "خطا در ارتباط با سرور"
            );

        }


        typing.style.display =
            "none";


        const botMessage =
            addMessage(
                "",
                "bot"
            );


        if(!response.body){

            throw new Error(
                "پاسخ سرور قابل دریافت نیست."
            );

        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder(
                "utf-8"
            );


        let buffer = "";


        while(true){

            const result =
                await reader.read();


            if(result.done){
                break;
            }


            buffer +=
                decoder.decode(
                    result.value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split("\n");


            buffer =
                lines.pop();


            for(const line of lines){

                const cleanLine =
                    line.trim();


                if(!cleanLine){
                    continue;
                }


                try{

                    const data =
                        JSON.parse(
                            cleanLine
                        );


                    if(
                        data.type ===
                        "text"
                    ){

                        botMessage.textContent +=
                            data.content;

                        chat.scrollTop =
                            chat.scrollHeight;

                    }


                    if(
                        data.type ===
                        "done"
                    ){

                        currentConversationId =
                            data.conversation_id;

                    }


                    if(
                        data.type ===
                        "error"
                    ){

                        botMessage.textContent =
                            data.content;

                    }

                }catch(error){

                    console.log(
                        "داده نامعتبر:",
                        cleanLine
                    );

                }

            }

        }


        await loadConversations();


    }catch(error){

        typing.style.display =
            "none";


        addMessage(
            error.message ||
            "ارتباط با سرور برقرار نشد.",
            "bot"
        );


        console.error(error);

    }


    typing.style.display =
        "none";


    isSending = false;

    send.disabled = false;

    input.focus();

}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations(){

    try{

        const response =
            await fetch(
                "/conversations"
            );


        if(!response.ok){

            throw new Error(
                "خطا در دریافت تاریخچه"
            );

        }


        const data =
            await response.json();


        historyList.innerHTML =
            "";


        if(data.length === 0){

            historyList.innerHTML =
                `
                <div
                    style="
                    padding:18px;
                    color:#647990;
                    font-size:11px;
                    text-align:center;
                    "
                >
                    هنوز گفت‌وگویی وجود ندارد.
                </div>
                `;

            return;

        }


        data.forEach(
            conversation => {

                const row =
                    document.createElement("div");


                row.className =
                    "conversation";


                if(
                    conversation.id ===
                    currentConversationId
                ){

                    row.classList.add(
                        "active"
                    );

                }


                const info =
                    document.createElement("div");

                info.className =
                    "conversation-info";


                const title =
                    document.createElement("div");

                title.className =
                    "conversation-title";

                title.textContent =
                    conversation.title ||
                    "گفت‌وگوی جدید";


                const count =
                    document.createElement("div");

                count.className =
                    "conversation-count";

                count.textContent =
                    (
                        conversation.message_count ||
                        0
                    ) +
                    " پیام";


                info.appendChild(title);
                info.appendChild(count);


                info.onclick =
                    () => {

                        openConversation(
                            conversation.id
                        );

                    };


                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete-conversation";

                deleteButton.textContent =
                    "🗑";


                deleteButton.onclick =
                    event => {

                        event.stopPropagation();

                        deleteConversation(
                            conversation.id
                        );

                    };


                row.appendChild(info);
                row.appendChild(deleteButton);


                historyList.appendChild(row);

            }
        );


    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(id){

    try{

        const response =
            await fetch(
                "/conversations/" +
                id +
                "/messages"
            );


        if(!response.ok){

            throw new Error(
                "خطا در دریافت گفتگو"
            );

        }


        const data =
            await response.json();


        currentConversationId =
            id;


        clearChat();


        data.forEach(
            message => {

                addMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "bot"
                );

            }
        );


        sidebar.classList.remove("open");

        await loadConversations();

        input.focus();


    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteConversation(id){

    if(
        !confirm(
            "این گفت‌وگو حذف شود؟"
        )
    ){
        return;
    }


    try{

        const response =
            await fetch(
                "/conversations/" +
                id,
                {
                    method:"DELETE"
                }
            );


        if(!response.ok){

            throw new Error(
                "خطا در حذف گفتگو"
            );

        }


        if(
            currentConversationId === id
        ){

            currentConversationId =
                null;

            clearChat();

        }


        await loadConversations();


    }catch(error){

        console.error(error);

    }

}
