
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#080b12" id="themeColor">
<title>Whale AI</title>

<style>
:root{
--bg:#080b12;
--bg2:#0d1119;
--bg3:#111824;
--surface:#121a28;
--surface-hover:#182238;
--border:#202837;
--border-strong:#29364b;
--text:#f4f7fb;
--text2:#bbc4d2;
--muted:#7f8a9d;
--accent:#5b8cff;
--accent-hover:#4079f3;
--user:#1b2941;
--assistant:#111923;
--input:#111824;
--code:#080d15;
--scroll:#273345;
--shadow:rgba(0,0,0,.30);
--glow:rgba(91,140,255,.18);
}

body.light{
--bg:#f4f7fb;
--bg2:#fff;
--bg3:#eef2f7;
--surface:#fff;
--surface-hover:#edf2f9;
--border:#dce3ed;
--border-strong:#cbd5e3;
--text:#172033;
--text2:#475569;
--muted:#718096;
--accent:#3975ee;
--accent-hover:#2864db;
--user:#e7efff;
--assistant:#fff;
--input:#fff;
--code:#f1f4f8;
--scroll:#c4cedc;
--shadow:rgba(32,52,80,.13);
--glow:rgba(57,117,238,.14);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
margin:0;
padding:0;
}

body{
background:var(--bg);
color:var(--text);
font-family:Inter,"Segoe UI",Arial,sans-serif;
overflow:hidden;
}

button,input,textarea{
font:inherit;
}

button{
border:0;
outline:0;
}

.app{
width:100%;
height:100dvh;
display:flex;
overflow:hidden;
}

.sidebar{
width:280px;
min-width:280px;
height:100%;
background:var(--bg2);
border-right:1px solid var(--border);
display:flex;
flex-direction:column;
padding:16px;
z-index:100;
}

.brand{
display:flex;
align-items:center;
gap:11px;
padding:6px 6px 18px;
}

.brand-logo{
width:43px;
height:43px;
border-radius:13px;
object-fit:cover;
background:var(--surface);
border:1px solid var(--border-strong);
box-shadow:0 8px 25px var(--glow);
}

.brand-name{
font-size:18px;
font-weight:700;
}

.brand-subtitle{
margin-top:3px;
font-size:11px;
color:var(--muted);
}

.new-chat{
width:100%;
height:44px;
border:1px solid var(--border-strong);
border-radius:12px;
background:var(--surface);
color:var(--text);
cursor:pointer;
font-size:13px;
font-weight:600;
margin-bottom:18px;
transition:.2s;
}

.new-chat:hover{
background:var(--surface-hover);
border-color:var(--accent);
}

.sidebar-title{
color:var(--muted);
font-size:11px;
font-weight:600;
padding:0 7px 8px;
text-transform:uppercase;
letter-spacing:.5px;
}

.conversations{
flex:1;
overflow-y:auto;
min-height:0;
}

.conversation{
width:100%;
display:flex;
align-items:center;
gap:8px;
padding:10px 9px;
margin-bottom:3px;
border-radius:10px;
color:var(--text2);
cursor:pointer;
transition:.2s;
}

.conversation:hover{
background:var(--surface-hover);
}

.conversation.active{
background:var(--user);
color:var(--text);
}

.conversation-text{
flex:1;
min-width:0;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
font-size:13px;
}

.delete-conversation{
width:25px;
height:25px;
border-radius:7px;
background:transparent;
color:var(--muted);
cursor:pointer;
opacity:0;
}

.conversation:hover .delete-conversation{
opacity:1;
}

.delete-conversation:hover{
background:rgba(255,80,100,.1);
color:#ff7180;
}

.sidebar-bottom{
border-top:1px solid var(--border);
margin-top:10px;
padding-top:10px;
}

.sidebar-button{
width:100%;
background:transparent;
color:var(--text2);
text-align:left;
padding:10px;
border-radius:9px;
cursor:pointer;
font-size:12px;
}

.sidebar-button:hover{
background:var(--surface-hover);
color:var(--text);
}

.main{
flex:1;
min-width:0;
min-height:0;
display:flex;
flex-direction:column;
position:relative;
background:
radial-gradient(
circle at 50% -20%,
rgba(64,121,243,.1),
transparent 45%
);
}

.topbar{
height:62px;
min-height:62px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
background:rgba(8,11,18,.82);
border-bottom:1px solid var(--border);
backdrop-filter:blur(18px);
z-index:20;
}

body.light .topbar{
background:rgba(244,247,251,.82);
}

.topbar-left{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}

.topbar-title{
font-size:14px;
font-weight:650;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.status{
display:flex;
align-items:center;
gap:7px;
color:var(--muted);
font-size:11px;
}

.status-dot{
width:7px;
height:7px;
border-radius:50%;
background:#37d98b;
box-shadow:0 0 12px rgba(55,217,139,.65);
}

.theme-button,
.mobile-menu{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid var(--border);
border-radius:10px;
background:var(--surface);
color:var(--text2);
cursor:pointer;
}

.theme-button:hover,
.mobile-menu:hover{
border-color:var(--accent);
background:var(--surface-hover);
}

.theme-icon{
width:18px;
height:18px;
}

.chat{
flex:1;
min-height:0;
overflow-y:auto;
padding:28px 18px 180px;
}

.chat-inner{
width:100%;
max-width:920px;
margin:0 auto;
}

.welcome{
min-height:calc(100dvh - 250px);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:35px 20px;
}

.welcome-logo{
width:72px;
height:72px;
border-radius:22px;
object-fit:cover;
margin-bottom:19px;
box-shadow:0 14px 45px var(--glow);
}

.welcome h1{
margin:0;
font-size:29px;
letter-spacing:-.7px;
}

.welcome p{
margin:10px 0 0;
color:var(--muted);
font-size:13px;
}

.message-row{
display:flex;
width:100%;
margin-bottom:20px;
}

.message-row.user{
justify-content:flex-end;
}

.message-row.assistant{
justify-content:flex-start;
}

.message{
max-width:min(82%,760px);
border-radius:16px;
padding:12px 15px;
line-height:1.8;
font-size:14px;
overflow-wrap:anywhere;
word-break:break-word;
box-shadow:0 8px 30px rgba(0,0,0,.04);
}

.user-message{
background:var(--user);
border:1px solid var(--border-strong);
border-bottom-right-radius:5px;
}

.assistant-message{
background:var(--assistant);
border:1px solid var(--border);
border-bottom-left-radius:5px;
}

.message-role{
color:var(--muted);
font-size:10px;
margin-bottom:5px;
font-weight:600;
}

.message-content{
white-space:normal;
}

.message-actions{
display:flex;
align-items:center;
gap:5px;
margin-top:9px;
padding-top:7px;
border-top:1px solid var(--border);
opacity:.65;
}

.message-action{
display:inline-flex;
align-items:center;
gap:5px;
height:28px;
padding:0 8px;
border-radius:7px;
background:transparent;
color:var(--muted);
cursor:pointer;
font-size:11px;
transition:.18s;
}

.message-action:hover{
background:var(--surface-hover);
color:var(--text);
opacity:1;
}

.message-action svg{
width:14px;
height:14px;
}

.message-action.copied{
color:#37d98b;
}

.message h1,
.message h2,
.message h3{
margin:13px 0 7px;
line-height:1.4;
}

.message h1{font-size:20px}
.message h2{font-size:17px}
.message h3{font-size:15px}

.message p{
margin:5px 0;
}

.message ul,
.message ol{
margin:8px 0;
padding-left:23px;
}

.message li{
margin-bottom:4px;
}

.message a{
color:var(--accent);
text-decoration:none;
}

.message a:hover{
text-decoration:underline;
}

.message code{
background:var(--code);
border:1px solid var(--border);
border-radius:5px;
padding:2px 5px;
font-family:Consolas,monospace;
direction:ltr;
unicode-bidi:plaintext;
}

.message pre{
margin:10px 0;
padding:13px;
background:var(--code);
border:1px solid var(--border);
border-radius:10px;
overflow-x:auto;
direction:ltr;
text-align:left;
white-space:pre-wrap;
}

.file-card{
display:flex;
align-items:center;
gap:9px;
padding:8px 10px;
margin-bottom:8px;
border-radius:9px;
background:var(--surface);
border:1px solid var(--border-strong);
font-size:12px;
}

.file-name{
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.thinking{
display:flex;
align-items:center;
gap:9px;
color:var(--muted);
font-size:12px;
}

.thinking-dots{
display:flex;
gap:4px;
}

.thinking-dots span{
width:6px;
height:6px;
border-radius:50%;
background:var(--accent);
animation:thinking 1.1s infinite;
}

.thinking-dots span:nth-child(2){animation-delay:.14s}
.thinking-dots span:nth-child(3){animation-delay:.28s}

@keyframes thinking{
0%,65%,100%{transform:translateY(0);opacity:.35}
32%{transform:translateY(-4px);opacity:1}
}

.input-area{
position:absolute;
left:0;
right:0;
bottom:0;
padding:16px 18px 18px;
background:linear-gradient(to bottom,transparent,var(--bg) 28%);
z-index:30;
}

.input-container{
max-width:920px;
margin:0 auto;
}

.composer{
background:var(--input);
border:1px solid var(--border-strong);
border-radius:17px;
overflow:hidden;
box-shadow:0 15px 45px var(--shadow);
transition:.2s;
}

.composer:focus-within{
border-color:var(--accent);
box-shadow:0 15px 45px var(--glow);
}

.file-preview{
display:none;
padding:9px 12px 0;
}

.file-preview.show{
display:block;
}

.file-preview-inner{
display:inline-flex;
align-items:center;
gap:8px;
max-width:100%;
padding:7px 9px;
border:1px solid var(--border-strong);
background:var(--surface);
border-radius:9px;
font-size:12px;
}

.remove-file{
width:23px;
height:23px;
border-radius:6px;
background:transparent;
color:var(--muted);
cursor:pointer;
}

#messageInput{
width:100%;
min-height:52px;
max-height:170px;
resize:none;
border:0;
outline:none;
background:transparent;
color:var(--text);
padding:15px 16px 5px;
font-size:14px;
line-height:1.65;
overflow-y:auto;
}

#messageInput::placeholder{
color:var(--muted);
}

.composer-bottom{
display:flex;
align-items:center;
justify-content:space-between;
padding:7px 9px 9px;
}

.composer-tools{
display:flex;
align-items:center;
gap:5px;
}

.tool-button{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
background:transparent;
color:var(--muted);
cursor:pointer;
transition:.2s;
}

.tool-button:hover,
.tool-button.active{
background:var(--surface-hover);
color:var(--text);
}

.search-button.active{
color:var(--accent);
background:var(--user);
}

.search-indicator{
position:absolute;
right:5px;
top:5px;
width:6px;
height:6px;
border-radius:50%;
background:var(--accent);
display:none;
}

.search-button{
position:relative;
}

.search-button.active .search-indicator{
display:block;
}

.send-button{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:var(--accent);
color:white;
cursor:pointer;
transition:.2s;
}

.send-button:hover{
background:var(--accent-hover);
transform:translateY(-1px);
}

.send-button.stop{
background:#c94b5d;
}

.send-button:disabled{
cursor:not-allowed;
opacity:.75;
}

.hidden{
display:none!important;
}

.sidebar-overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:90;
}

::-webkit-scrollbar{
width:7px;
}

::-webkit-scrollbar-track{
background:transparent;
}

::-webkit-scrollbar-thumb{
background:var(--scroll);
border-radius:10px;
}

.mobile-menu{
display:none;
}

@media(max-width:800px){

.sidebar{
position:fixed;
top:0;
bottom:0;
left:-290px;
box-shadow:12px 0 45px rgba(0,0,0,.4);
transition:left .22s ease;
}

.sidebar.open{
left:0;
}

.sidebar-overlay.open{
display:block;
}

.mobile-menu{
display:flex;
}

.topbar{
height:57px;
min-height:57px;
padding:0 12px;
}

.status{
display:none;
}

.chat{
padding:18px 10px 160px;
}

.message{
max-width:91%;
font-size:13px;
line-height:1.75;
border-radius:14px;
}

.input-area{
padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}

.composer{
border-radius:15px;
}

#messageInput{
min-height:48px;
font-size:16px;
}

.welcome h1{
font-size:23px;
}

.welcome-logo{
width:62px;
height:62px;
}

.message-actions{
opacity:1;
}

}

@media(prefers-reduced-motion:reduce){
*{
animation-duration:.01ms!important;
transition-duration:.01ms!important;
}
}
</style>
</head>

<body>

<script>
"use strict";

/* =========================================================
   STATE
========================================================= */

let currentConversationId=null;
let selectedFile=null;
let selectedFileText="";
let webSearchEnabled=false;
let isSending=false;
let activeController=null;
let lastUserPrompt="";
let lastUserConversationId=null;

/* =========================================================
   ELEMENTS
========================================================= */

const chat=document.getElementById("chat");
const chatInner=document.getElementById("chatInner");
const messageInput=document.getElementById("messageInput");
const sendButton=document.getElementById("sendButton");
const sendIcon=document.getElementById("sendIcon");
const conversationsElement=document.getElementById("conversations");
const webSearchButton=document.getElementById("webSearchButton");
const themeButton=document.getElementById("themeButton");
const themeIcon=document.getElementById("themeIcon");
const themeColor=document.getElementById("themeColor");

/* =========================================================
   API
========================================================= */

async function fetchJson(url,options={}){

    let response;

    try{
        response=await fetch(url,{
            ...options,
            cache:"no-store"
        });
    }catch(error){
        throw new Error(
            "Network error: the server is unreachable."
        );
    }

    let data={};

    const contentType=
        response.headers.get("content-type")||"";

    if(contentType.includes("application/json")){
        try{
            data=await response.json();
        }catch{
            data={};
        }
    }else{
        try{
            const text=await response.text();
            data={error:text};
        }catch{
            data={};
        }
    }

    if(!response.ok){

        const message=
            data.error||
            data.message||
            `Server error (${response.status})`;

        throw new Error(message);
    }

    return data;
}

/* =========================================================
   THEME
========================================================= */

function getSavedTheme(){
    try{
        return localStorage.getItem("whale-ai-theme");
    }catch{
        return null;
    }
}

function saveTheme(theme){
    try{
        localStorage.setItem("whale-ai-theme",theme);
    }catch{}
}

function applyTheme(theme){

    const light=theme==="light";

    document.body.classList.toggle("light",light);

    themeButton.title=
        light
        ?"Switch to Dark Mode"
        :"Switch to Light Mode";

    themeButton.setAttribute(
        "aria-label",
        themeButton.title
    );

    themeColor.content=
        light
        ?" #f4f7fb".trim()
        :"#080b12";

    if(light){

        themeIcon.innerHTML=`
        <path d="M21 12.79A9 9 0 1 1 11.21 3
        7 7 0 0 0 21 12.79Z"></path>`;
    }else{

        themeIcon.innerHTML=`
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>`;
    }

    saveTheme(theme);
}

function toggleTheme(){

    const light=
        document.body.classList.contains("light");

    applyTheme(light?"dark":"light");
}

/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

    document
    .getElementById("sidebar")
    .classList.toggle("open");

    document
    .getElementById("sidebarOverlay")
    .classList.toggle("open");
}

function closeMobileSidebar(){

    document
    .getElementById("sidebar")
    .classList.remove("open");

    document
    .getElementById("sidebarOverlay")
    .classList.remove("open");
}

/* =========================================================
   WEB SEARCH
========================================================= */

function toggleWebSearch(){

    webSearchEnabled=!webSearchEnabled;

    webSearchButton.classList.toggle(
        "active",
        webSearchEnabled
    );

    webSearchButton.title=
        webSearchEnabled
        ?"Web Search: ON"
        :"Web Search: OFF";
}

/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations(){

    try{

        const data=
            await fetchJson("/conversations");

        conversationsElement.innerHTML="";

        if(!Array.isArray(data)) return;

        data.forEach(conversation=>{

            const item=document.createElement("div");

            item.className="conversation";

            if(
                Number(conversation.id)===
                Number(currentConversationId)
            ){
                item.classList.add("active");
            }

            item.onclick=()=>{
                loadConversation(conversation.id);
            };

            const text=document.createElement("div");

            text.className="conversation-text";

            text.textContent=
                conversation.title||"New Chat";

            const deleteButton=
                document.createElement("button");

            deleteButton.className=
                "delete-conversation";

            deleteButton.textContent="×";

            deleteButton.title="Delete chat";

            deleteButton.onclick=event=>{

                event.stopPropagation();

                deleteConversation(
                    conversation.id
                );
            };

            item.appendChild(text);
            item.appendChild(deleteButton);

            conversationsElement.appendChild(item);
        });

    }catch(error){

        console.error("LOAD CONVERSATIONS:",error);
    }
}

async function newConversation(){

    if(isSending) stopGeneration();

    try{

        const data=
            await fetchJson("/conversations",{
                method:"POST"
            });

        currentConversationId=data.id;

        clearChat();

        document.getElementById(
            "topbarTitle"
        ).textContent="New Chat";

        removeFile();

        await loadConversations();

        closeMobileSidebar();

        messageInput.focus();

    }catch(error){

        showSystemError(
            "Could not create a new chat.",
            error
        );
    }
}

async function loadConversation(id){

    if(isSending) stopGeneration();

    try{

        const messages=
            await fetchJson(
                `/conversations/${id}/messages`
            );

        currentConversationId=Number(id);

        clearChat();

        if(Array.isArray(messages)){

            messages.forEach(message=>{

                addMessage(
                    message.role,
                    message.content,
                    message.file_name||"",
                    false
                );
            });
        }

        const conversations=
            await fetchJson("/conversations");

        const conversation=
            conversations.find(
                item=>
                    Number(item.id)===
                    Number(id)
            );

        document.getElementById(
            "topbarTitle"
        ).textContent=
            conversation
            ?conversation.title
            :"Chat";

        await loadConversations();

        closeMobileSidebar();

        scrollToBottom();

    }catch(error){

        showSystemError(
            "Could not load this chat.",
            error
        );
    }
}

async function deleteConversation(id){

    if(!confirm("Delete this chat?")) return;

    try{

        await fetchJson(
            `/conversations/${id}`,
            {
                method:"DELETE"
            }
        );

        if(
            Number(currentConversationId)===
            Number(id)
        ){

            currentConversationId=null;

            clearChat();

            document.getElementById(
                "topbarTitle"
            ).textContent="New Chat";
        }

        await loadConversations();

    }catch(error){

        showSystemError(
            "Could not delete the chat.",
            error
        );
    }
}

async function clearAllConversations(){

    if(!confirm("Delete all chats?")) return;

    try{

        await fetchJson(
            "/conversations",
            {
                method:"DELETE"
            }
        );

        currentConversationId=null;

        clearChat();

        document.getElementById(
            "topbarTitle"
        ).textContent="New Chat";

        await loadConversations();

    }catch(error){

        showSystemError(
            "Could not delete the chats.",
            error
        );
    }
}

/* =========================================================
   CHAT
========================================================= */

function clearChat(){

    chatInner.innerHTML=`
    <div class="welcome" id="welcome">
        <img
            class="welcome-logo"
            src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f40b.svg"
            alt="Whale"
        >
        <h1>Welcome to Whale AI</h1>
        <p>
            Ask anything, upload a file, or enable Web Search.
        </p>
    </div>`;
}

function addMessage(
    role,
    content,
    fileName="",
    allowActions=true
){

    const welcome=
        document.getElementById("welcome");

    if(welcome) welcome.remove();

    const row=document.createElement("div");

    row.className=
        "message-row "+
        (role==="user"?"user":"assistant");

    const message=document.createElement("div");

    message.className=
        "message "+
        (role==="user"
        ?"user-message"
        :"assistant-message");

    const roleText=document.createElement("div");

    roleText.className="message-role";

    roleText.textContent=
        role==="user"
        ?"You"
        :"Whale AI";

    message.appendChild(roleText);

    if(fileName){

        const fileCard=
            document.createElement("div");

        fileCard.className="file-card";

        fileCard.innerHTML=`
            <span>📎</span>
            <span class="file-name"></span>
        `;

        fileCard.querySelector(
            ".file-name"
        ).textContent=fileName;

        message.appendChild(fileCard);
    }

    const contentElement=
        document.createElement("div");

    contentElement.className="message-content";

    contentElement.innerHTML=
        formatMarkdown(content);

    message.appendChild(contentElement);

    if(allowActions){

        const actions=
            document.createElement("div");

        actions.className="message-actions";

        const copy=
            createActionButton(
                "Copy",
                copyMessage
            );

        copy.dataset.content=String(content??"");

        actions.appendChild(copy);

        if(role==="assistant"){

            const regenerate=
                createActionButton(
                    "Regenerate",
                    regenerateLastResponse
                );

            actions.appendChild(regenerate);
        }

        message.appendChild(actions);
    }

    row.appendChild(message);

    chatInner.appendChild(row);

    scrollToBottom();
}

function createActionButton(text,handler){

    const button=
        document.createElement("button");

    button.className="message-action";

    button.innerHTML=`
    <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
    <span>${escapeHtml(text)}</span>`;

    button.onclick=event=>{
        event.stopPropagation();
        handler(button);
    };

    return button;
}

async function copyMessage(button){

    const text=
        button.dataset.content||"";

    try{

        await navigator.clipboard.writeText(text);

        button.classList.add("copied");

        button.querySelector("span").textContent=
            "Copied";

        setTimeout(()=>{

            button.classList.remove("copied");

            button.querySelector("span").textContent=
                "Copy";

        },1400);

    }catch{

        const area=
            document.createElement("textarea");

        area.value=text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        button.querySelector("span").textContent=
            "Copied";

        setTimeout(()=>{
            button.querySelector("span").textContent=
                "Copy";
        },1400);
    }
}

/* =========================================================
   REGENERATE
========================================================= */

async function regenerateLastResponse(){

    if(isSending) return;

    if(!lastUserPrompt) return;

    const rows=
        [...chatInner.querySelectorAll(
            ".message-row.assistant"
        )];

    if(rows.length){

        rows[rows.length-1].remove();
    }

    await sendMessage({
        overrideText:lastUserPrompt,
        regenerate:true
    });
}

/* =========================================================
   MARKDOWN
========================================================= */

function escapeHtml(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatMarkdown(text){

    let source=
        escapeHtml(
            String(text??"")
        );

    const codeBlocks=[];

    source=
        source.replace(
            /```([\s\S]*?)```/g,
            (_,code)=>{

                const token=
                    `___CODE_${codeBlocks.length}___`;

                codeBlocks.push(
                    `<pre><code>${code.trim()}</code></pre>`
                );

                return token;
            }
        );

    source=
        source.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );

    source=
        source.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
        );

    source=
        source.replace(
            /^# (.*)$/gm,
            "<h1>$1</h1>"
        );

    source=
        source.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    source=
        source.replace(
            /\*([^*\n]+)\*/g,
            "<em>$1</em>"
        );

    source=
        source.replace(
            /`([^`\n]+)`/g,
            "<code>$1</code>"
        );

    source=
        source.replace(
            /^[-*] (.*)$/gm,
            "<li>$1</li>"
        );

    source=
        source.replace(
            /((?:<li>.*<\/li>\s*)+)/gs,
            "<ul>$1</ul>"
        );

    source=
        source.replace(
            /\n/g,
            "<br>"
        );

    codeBlocks.forEach(
        (block,index)=>{

            source=
                source.replace(
                    `___CODE_${index}___`,
                    block
                );
        }
    );

    return source;
}

/* =========================================================
   THINKING
========================================================= */

function showThinking(){

    removeThinking();

    const row=
        document.createElement("div");

    row.className=
        "message-row assistant";

    row.id="thinkingMessage";

    row.innerHTML=`
    <div class="message assistant-message">

        <div class="message-role">
            Whale AI
        </div>

        <div class="thinking">

            <div class="thinking-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <span id="thinkingText">
                ${webSearchEnabled
                ?"Searching the web"
                :"Thinking"}
            </span>

        </div>
    </div>`;

    chatInner.appendChild(row);

    scrollToBottom();
}

function removeThinking(){

}

/* =========================================================
   SEND
========================================================= */

function handleSendButton(){

    if(isSending){

        stopGeneration();

        return;
    }

    sendMessage();
}

async function sendMessage(options={}){

    if(isSending) return;

    const override=
        options.overrideText;

    const text=
        override!==undefined
        ?String(override).trim()
        :messageInput.value.trim();

    if(
        !text &&
        !selectedFileText
    ){
        return;
    }

    isSending=true;

    activeController=
        new AbortController();

    updateSendButton(true);

    const fileName=
        selectedFile
        ?selectedFile.name
        :"";

    if(!options.regenerate){

        addMessage(
            "user",
            text||"[Attached file]",
            fileName,
            true
        );

        lastUserPrompt=text;

        lastUserConversationId=
            currentConversationId;

        messageInput.value="";

        autoResize();
    }

    showThinking();

    try{

        const data=
            await fetchJson(
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    signal:
                        activeController.signal,

                    body:
                        JSON.stringify({
                            message:text,

                            conversation_id:
                                currentConversationId,

                            file_name:fileName,

                            file_text:
                                selectedFileText,

                            web_search:
                                webSearchEnabled,

                            regenerate:
                                !!options.regenerate
                        })
                }
            );

        removeThinking();

        if(data.conversation_id!==undefined){

            currentConversationId=
                data.conversation_id;
        }

        addMessage(
            "assistant",
            data.content||
            "No response received.",
            "",
            true
        );

        removeFile();

        await loadConversations();

    }catch(error){

        removeThinking();

        if(error.name==="AbortError"){

            addMessage(
                "assistant",
                "Generation stopped.",
                "",
                true
            );

        }else{

            console.error(
                "SEND ERROR:",
                error
            );

            addMessage(
                "assistant",
                `Server error: ${error.message}`,
                "",
                true
            );
        }

    }finally{

        isSending=false;

        activeController=null;

        updateSendButton(false);

        messageInput.focus();
    }
}

function stopGeneration(){

    if(activeController){

        activeController.abort();
    }
}

function updateSendButton(sending){

    if(sending){

        sendButton.classList.add("stop");

        sendButton.title=
            "Stop generating";

        sendIcon.innerHTML=`
        <rect
            x="6"
            y="6"
            width="12"
            height="12"
            rx="2"
        />`;

    }else{

        sendButton.classList.remove("stop");

        sendButton.title="Send";

        sendIcon.innerHTML=`
        <path d="M22 2 11 13"></path>
        <path d="m22 2-7 20-4-9-9-4Z"></path>`;
    }
}

/* =========================================================
   FILES
========================================================= */

async function handleFile(event){

    const file=
        event.target.files[0];

    if(!file) return;

    if(file.size>20*1024*1024){

        alert(
            "Maximum file size is 20 MB."
        );

        event.target.value="";

        return;
    }

    selectedFile=file;

    selectedFileText="";

    document.getElementById(
        "fileName"
    ).textContent=file.name;

    document.getElementById(
        "filePreview"
    ).classList.add("show");

    try{

        const formData=new FormData();

        formData.append("file",file);

        const data=
            await fetchJson(
                "/upload",
                {
                    method:"POST",
                    body:formData
                }
            );

        selectedFileText=
            data.text||"";

        if(!selectedFileText){

            alert(
                "No readable text was extracted from this file."
            );
        }

    }catch(error){

        console.error(
            "UPLOAD:",
            error
        );

        alert(
            error.message||
            "File upload failed."
        );

        removeFile();
    }
}

function removeFile(){

    selectedFile=null;

    selectedFileText="";

    document.getElementById(
        "fileInput"
    ).value="";

    document.getElementById(
        "filePreview"
    ).classList.remove("show");

    document.getElementById(
        "fileName"
    ).textContent="";
}

/* =========================================================
   TEXTAREA
========================================================= */

function autoResize(){

    messageInput.style.height="auto";

    messageInput.style.height=
        Math.min(
            messageInput.scrollHeight,
            170
        )+"px";
}

messageInput.addEventListener(
    "input",
    autoResize
);

messageInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey &&
            !event.isComposing
        ){

            event.preventDefault();

            if(!isSending){
                sendMessage();
            }
        }
    }
);

/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom(){

    requestAnimationFrame(()=>{

        chat.scrollTo({
            top:chat.scrollHeight,
            behavior:"smooth"
        });
    });
}

/* =========================================================
   MEMORY
========================================================= */

async function showMemory(){

    try{

        const data=
            await fetchJson("/memory");

        if(
            !data.memories||
            data.memories.length===0
        ){

            alert(
                "Whale Memory is empty."
            );

            return;
        }

        const text=
            data.memories
            .map(
                memory=>
                    `${memory.key}: ${memory.value}`
            )
            .join("\n");

        alert(
            "Whale Memory\n\n"+
            text
        );

    }catch(error){

        showSystemError(
            "Could not load memory.",
            error
        );
    }
}

/* =========================================================
   ERROR
========================================================= */

function showSystemError(prefix,error){

    console.error(prefix,error);

    alert(
        prefix+
        "\n\n"+
        (
            error?.message||
            "Unknown server error."
        )
    );
}
