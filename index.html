<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Whale AI</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#050914;
    --bg2:#08111f;
    --panel:rgba(10,20,35,.78);
    --panel2:rgba(15,29,48,.9);
    --border:rgba(255,255,255,.08);
    --border2:rgba(255,255,255,.13);
    --text:#f4f8ff;
    --muted:#8499b0;
    --blue:#278cff;
    --blue2:#1263d1;
    --cyan:#42c8ff;
    --user:#1675df;
    --bot:#0d1b2d;
    --danger:#ff6577;
    --shadow:0 20px 60px rgba(0,0,0,.3);
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    color:var(--text);
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(25,104,185,.35),
            transparent 38%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(20,70,140,.15),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #030711,
            #071321 55%,
            #030811
        );
}

button,
textarea,
input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:292px;
    height:100vh;
    flex:0 0 292px;
    display:flex;
    flex-direction:column;

    background:
        linear-gradient(
            180deg,
            rgba(7,16,29,.96),
            rgba(5,12,22,.94)
        );

    border-left:1px solid var(--border);
    backdrop-filter:blur(25px);

    z-index:100;
    transition:.28s ease;
}

.brand{
    padding:20px 19px;
    display:flex;
    align-items:center;
    gap:13px;
    border-bottom:1px solid var(--border);
}

.brand-logo{
    width:49px;
    height:49px;
    flex:0 0 49px;
    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    background:
        radial-gradient(
            circle at 30% 20%,
            #62c9ff,
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #278dff,
            #0b397b
        );

    box-shadow:
        0 10px 35px rgba(35,137,255,.3),
        inset 0 1px 1px rgba(255,255,255,.25);
}

.brand-title{
    font-size:20px;
    font-weight:800;
    letter-spacing:.2px;
}

.brand-subtitle{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
}

.new-chat{
    margin:17px;
    padding:14px 15px;

    border-radius:14px;

    color:white;
    font-size:13px;
    font-weight:700;

    background:
        linear-gradient(
            135deg,
            #278eff,
            #125fca
        );

    box-shadow:
        0 10px 30px rgba(35,137,255,.2);

    transition:.2s;
}

.new-chat:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.new-chat:active{
    transform:scale(.98);
}

.history-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px 10px;

    color:var(--muted);
    font-size:11px;
    font-weight:600;
}

#historyList{
    flex:1;
    overflow-y:auto;
    padding:0 10px 15px;
}

.conversation{
    position:relative;

    display:flex;
    align-items:center;
    gap:8px;

    padding:11px 10px;
    margin-bottom:5px;

    border:1px solid transparent;
    border-radius:12px;

    transition:.18s;
}

.conversation:hover{
    background:rgba(255,255,255,.045);
    border-color:rgba(255,255,255,.04);
}

.conversation.active{
    background:
        linear-gradient(
            90deg,
            rgba(35,137,255,.15),
            rgba(35,137,255,.04)
        );

    border-color:rgba(35,137,255,.12);
}

.conversation-info{
    min-width:0;
    flex:1;
    cursor:pointer;
}

.conversation-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    font-size:12px;
}

.conversation-count{
    margin-top:4px;
    color:#647a91;
    font-size:10px;
}

.delete-conversation{
    padding:6px;
    border-radius:8px;

    background:transparent;
    color:#667c92;

    opacity:.45;
    transition:.2s;
}

.conversation:hover .delete-conversation{
    opacity:1;
}

.delete-conversation:hover{
    color:var(--danger);
    background:rgba(255,80,100,.1);
}

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border);
}

.clear-all{
    width:100%;
    padding:10px;

    border-radius:10px;

    color:#788da3;
    background:transparent;

    font-size:11px;
}

.clear-all:hover{
    color:var(--danger);
    background:rgba(255,255,255,.04);
}

/* =========================
   MAIN
========================= */

.main{
    min-width:0;
    flex:1;
    height:100vh;

    display:flex;
    flex-direction:column;

    position:relative;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    height:72px;
    flex:0 0 72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    background:rgba(5,12,21,.65);
    border-bottom:1px solid var(--border);

    backdrop-filter:blur(22px);

    z-index:10;
}

.model-info{
    display:flex;
    align-items:center;
    gap:10px;
}

.status-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#35db82;

    box-shadow:
        0 0 12px rgba(53,219,130,.75);
}

.model-name{
    font-size:14px;
    font-weight:800;
}

.model-status{
    margin-top:3px;
    color:var(--muted);
    font-size:10px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.top-button{
    padding:9px 12px;

    border-radius:10px;

    color:#c8d8e8;

    background:rgba(255,255,255,.045);
    border:1px solid var(--border);

    transition:.2s;
}

.top-button:hover{
    background:rgba(255,255,255,.08);
    border-color:var(--border2);
}

.mobile-menu{
    display:none;

    width:39px;
    height:39px;

    border-radius:11px;

    color:white;
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);

    font-size:17px;
}

/* =========================
   CHAT
========================= */

#chat{
    flex:1;
    overflow-y:auto;

    padding:
        35px
        max(20px, calc((100% - 920px) / 2))
        30px;
}

.welcome{
    max-width:700px;
    margin:auto;

    padding:55px 20px 35px;

    text-align:center;

    animation:fadeIn .5s ease;
}

.welcome-logo{
    width:94px;
    height:94px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:30px;

    font-size:48px;

    background:
        radial-gradient(
            circle at 30% 20%,
            #58c7ff,
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #258cff,
            #0a397b
        );

    box-shadow:
        0 20px 60px rgba(35,137,255,.25),
        inset 0 1px 2px rgba(255,255,255,.25);
}

.welcome h1{
    margin:22px 0 8px;

    font-size:30px;
    letter-spacing:-.5px;
}

.welcome p{
    margin:0;

    color:var(--muted);
    font-size:13px;
}

.quick-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;

    max-width:690px;

    margin:30px auto 0;
}

.quick-card{
    padding:15px 12px;

    text-align:right;

    border-radius:14px;

    color:#cbd9e7;

    background:rgba(255,255,255,.035);
    border:1px solid var(--border);

    transition:.2s;
}

.quick-card:hover{
    transform:translateY(-2px);
    background:rgba(35,137,255,.07);
    border-color:rgba(35,137,255,.2);
}

.quick-icon{
    font-size:20px;
    margin-bottom:8px;
}

.quick-title{
    font-size:12px;
    font-weight:700;
}

.quick-desc{
    margin-top:4px;
    color:#6e849b;
    font-size:10px;
}

/* =========================
   MESSAGES
========================= */

.message-row{
    display:flex;
    margin:17px 0;

    animation:
        messageIn
        .25s
        ease;
}

.message-row.user-row{
    justify-content:flex-start;
}

.message-row.bot-row{
    justify-content:flex-end;
}

.avatar{
    width:34px;
    height:34px;
    flex:0 0 34px;

    margin:0 8px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    font-size:16px;
}

.user-avatar{
    background:
        linear-gradient(
            145deg,
            #237fe3,
            #124c91
        );
}

.bot-avatar{
    background:
        linear-gradient(
            145deg,
            #172b43,
            #0d1929
        );

    border:1px solid rgba(255,255,255,.07);
}

.message-box{
    max-width:min(78%,740px);
}

.message{
    padding:14px 17px;

    border-radius:18px;

    line-height:1.85;

    white-space:pre-wrap;
    word-break:break-word;

    font-size:14px;
}

.user-message{
    background:
        linear-gradient(
            135deg,
            #1c7be2,
            #125eaf
        );

    border-bottom-left-radius:5px;

    box-shadow:
        0 8px 25px rgba(20,100,190,.12);
}

.bot-message{
    background:
        linear-gradient(
            145deg,
            rgba(16,31,49,.95),
            rgba(11,23,38,.95)
        );

    border:1px solid rgba(255,255,255,.065);

    border-bottom-right-radius:5px;
}

.message-actions{
    display:flex;
    gap:5px;

    margin-top:5px;

    direction:ltr;
}

.copy-btn{
    padding:4px 8px;

    border-radius:7px;

    background:transparent;

    color:#8096ad;

    font-size:10px;

    opacity:.6;
}

.copy-btn:hover{
    opacity:1;
    background:rgba(255,255,255,.05);
}

/* =========================
   TYPING
========================= */

#typing{
    display:none;

    align-items:center;
    justify-content:flex-end;

    margin:10px 0 16px;

    color:var(--muted);

    font-size:11px;
}

.typing-dots{
    display:flex;
    gap:4px;

    margin-right:8px;
}

.typing-dots span{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#7892ad;

    animation:bounce 1s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.15s;
}

.typing-dots span:nth-child(3){
    animation-delay:.3s;
}

/* =========================
   COMPOSER
========================= */

.input-wrapper{
    padding:12px 20px 18px;

    background:
        linear-gradient(
            transparent,
            rgba(4,10,17,.98) 35%
        );
}

.input-box{
    max-width:920px;

    margin:auto;

    display:flex;
    align-items:flex-end;
    gap:8px;

    padding:9px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(16,32,51,.97),
            rgba(9,22,37,.97)
        );

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 18px 55px rgba(0,0,0,.3);

    transition:.2s;
}

.input-box:focus-within{
    border-color:rgba(39,140,255,.48);

    box-shadow:
        0 0 0 3px rgba(39,140,255,.07),
        0 18px 55px rgba(0,0,0,.3);
}

.tool-buttons{
    display:flex;
    gap:5px;
    padding-bottom:1px;
}

.tool-button{
    width:38px;
    height:38px;

    border-radius:11px;

    color:#91a7bd;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.05);

    transition:.2s;
}

.tool-button:hover{
    color:white;
    background:rgba(255,255,255,.08);
}

#input{
    flex:1;
    min-width:0;

    max-height:145px;

    resize:none;

    outline:none;
    border:0;

    background:transparent;

    color:white;

    padding:9px 8px;

    font-size:14px;
    line-height:1.7;
}

#input::placeholder{
    color:#647b92;
}

#send{
    width:43px;
    height:43px;
    flex:0 0 43px;

    border-radius:13px;

    color:white;

    background:
        linear-gradient(
            145deg,
            #2993ff,
            #1263c7
        );

    font-size:18px;

    box-shadow:
        0 8px 22px rgba(35,137,255,.2);

    transition:.2s;
}

#send:hover{
    transform:scale(1.04);
}

#send:active{
    transform:scale(.97);
}

#send:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.hint{
    text-align:center;

    margin-top:8px;

    color:#4e6378;

    font-size:9px;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:#1b3047;
    border-radius:10px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes bounce{
    0%,60%,100%{
        transform:translateY(0);
    }

    30%{
        transform:translateY(-5px);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    .sidebar{
        position:fixed;

        right:-305px;
        top:0;

        width:292px;

        box-shadow:
            -25px 0 60px rgba(0,0,0,.4);
    }

    .sidebar.open{
        right:0;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        height:65px;
        flex-basis:65px;

        padding:0 12px;
    }

    .top-button{
        font-size:11px;
        padding:8px 9px;
    }

    #chat{
        padding:20px 11px 20px;
    }

    .welcome{
        padding-top:38px;
    }

    .welcome-logo{
        width:78px;
        height:78px;
        border-radius:25px;
        font-size:39px;
    }

    .welcome h1{
        font-size:23px;
    }

    .quick-actions{
        grid-template-columns:1fr;
        gap:8px;
    }

    .quick-card{
        padding:12px;
    }

    .message-box{
        max-width:84%;
    }

    .message{
        font-size:13px;
        padding:12px 14px;
    }

    .input-wrapper{
        padding:8px 8px 12px;
    }

    .tool-button{
        display:none;
    }

    .input-box{
        border-radius:16px;
    }

    .hint{
        font-size:8px;
    }
}

@media(max-width:420px){

    .model-status{
        display:none;
    }

    .history-button-text{
        display:none;
    }

    .message-box{
        max-width:88%;
    }

    .avatar{
        width:30px;
        height:30px;
        flex-basis:30px;
        margin:0 5px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="brand-logo">
                🐋
            </div>

            <div>
                <div class="brand-title">
                    Whale AI
                </div>

                <div class="brand-subtitle">
                    دستیار هوشمند شما
                </div>
            </div>

        </div>


        <button
            class="new-chat"
            id="newChatButton"
        >
            ＋ گفت‌وگوی جدید
        </button>


        <div class="history-heading">
            <span>گفت‌وگوهای اخیر</span>
        </div>


        <div id="historyList">

        </div>


        <div class="sidebar-bottom">

            <button
                class="clear-all"
                id="clearAll"
            >
                🗑 حذف همه گفتگوها
            </button>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">


        <!-- TOPBAR -->

        <header class="topbar">

            <div class="model-info">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                >
                    ☰
                </button>


                <div class="status-dot"></div>


                <div>

                    <div class="model-name">
                        Whale AI
                    </div>

                    <div class="model-status">
                        آماده پاسخ‌گویی
                    </div>

                </div>

            </div>


            <div class="top-actions">

                <button
                    class="top-button"
                    id="historyButton"
                >
                    🗂
                    <span class="history-button-text">
                        تاریخچه
                    </span>
                </button>

            </div>

        </header>


        <!-- CHAT -->

        <section id="chat">


            <!-- WELCOME -->

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-logo">
                    🐋
                </div>


                <h1>
                    به Whale AI خوش آمدی
                </h1>


                <p>
                    فکر کن، بپرس، کشف کن.
                    Whale AI آماده است.
                </p>


                <div class="quick-actions">

                    <button
                        class="quick-card"
                        onclick="usePrompt('یک موضوع جالب برای یادگیری امروز پیشنهاد بده')"
                    >

                        <div class="quick-icon">
                            💡
                        </div>

                        <div class="quick-title">
                            ایده بگیر
                        </div>

                        <div class="quick-desc">
                            یک موضوع جدید برای یادگیری
                        </div>

                    </button>


                    <button
                        class="quick-card"
                        onclick="usePrompt('این موضوع را به زبان ساده توضیح بده')"
                    >

                        <div class="quick-icon">
                            🧠
                        </div>

                        <div class="quick-title">
                            یاد بگیر
                        </div>

                        <div class="quick-desc">
                            مفاهیم سخت را ساده کن
                        </div>

                    </button>


                    <button
                        class="quick-card"
                        onclick="usePrompt('برای من یک برنامه مطالعه مناسب طراحی کن')"
                    >

                        <div class="quick-icon">
                            📚
                        </div>

                        <div class="quick-title">
                            برنامه‌ریزی
                        </div>

                        <div class="quick-desc">
                            برنامه‌ای متناسب با هدف تو
                        </div>

                    </button>

                </div>

            </div>


            <!-- TYPING -->

            <div id="typing">

                در حال نوشتن

                <div class="typing-dots">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-wrapper">

            <div class="input-box">


                <div class="tool-buttons">

                    <!-- فعلاً UI هستند -->

                    <button
                        class="tool-button"
                        id="fileButton"
                        title="افزودن فایل — به‌زودی"
                        type="button"
                    >
                        📎
                    </button>


                    <button
                        class="tool-button"
                        id="webButton"
                        title="جست‌وجوی وب — به‌زودی"
                        type="button"
                    >
                        🌐
                    </button>

                </div>


                <textarea
                    id="input"
                    rows="1"
                    placeholder="پیامت را برای Whale AI بنویس..."
                    autocomplete="off"
                ></textarea>


                <button
                    id="send"
                    title="ارسال"
                >
                    ➤
                </button>

            </div>


            <div class="hint">
                Enter برای ارسال
                •
                Shift + Enter برای خط جدید
            </div>

        </div>

    </main>

</div>


<script>

/* =========================
   STATE
========================= */

let currentConversationId = null;
let isSending = false;


/* =========================
   ELEMENTS
========================= */

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chat =
    document.getElementById("chat");

const typing =
    document.getElementById("typing");

const welcome =
    document.getElementById("welcome");

const historyButton =
    document.getElementById("historyButton");

const historyList =
    document.getElementById("historyList");

const newChatButton =
    document.getElementById("newChatButton");

const clearAll =
    document.getElementById("clearAll");

const mobileMenu =
    document.getElementById("mobileMenu");

const sidebar =
    document.getElementById("sidebar");

const fileButton =
    document.getElementById("fileButton");

const webButton =
    document.getElementById("webButton");


/* =========================
   WELCOME
========================= */

function showWelcome(){

    welcome.style.display = "block";

}


function hideWelcome(){

    welcome.style.display = "none";

}


/* =========================
   QUICK PROMPTS
========================= */

function usePrompt(text){

    input.value = text;

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            145
        ) + "px";

    input.focus();

}


/* =========================
   MESSAGE
========================= */

function addMessage(text,type){

    hideWelcome();


    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (
            type === "user"
                ? "user-row"
                : "bot-row"
        );


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            type === "user"
                ? "user-avatar"
                : "bot-avatar"
        );


    avatar.textContent =
        type === "user"
            ? "👤"
            : "🐋";


    const box =
        document.createElement("div");

    box.className =
        "message-box";


    const message =
        document.createElement("div");

    message.className =
        "message " +
        (
            type === "user"
                ? "user-message"
                : "bot-message"
        );


    message.textContent = text;


    box.appendChild(message);


    if(type === "bot"){

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.className =
            "copy-btn";

        copy.textContent =
            "📋 کپی";


        copy.onclick =
            async () => {

                try{

                    await navigator.clipboard.writeText(
                        message.textContent
                    );

                    copy.textContent =
                        "✓ کپی شد";


                    setTimeout(
                        () => {

                            copy.textContent =
                                "📋 کپی";

                        },
                        1500
                    );

                }catch(error){

                    console.error(error);

                }

            };


        actions.appendChild(copy);

        box.appendChild(actions);

    }


    if(type === "user"){

        row.appendChild(box);
        row.appendChild(avatar);

    }else{

        row.appendChild(avatar);
        row.appendChild(box);

    }


    chat.insertBefore(
        row,
        typing
    );


    chat.scrollTop =
        chat.scrollHeight;


    return message;

}


/* =========================
   CLEAR CHAT
========================= */

function clearChat(){

    chat
        .querySelectorAll(
            ".message-row"
        )
        .forEach(
            element =>
                element.remove()
        );


    showWelcome();

}


/* =========================
   NEW CONVERSATION
========================= */

async function createNewConversation(){

    try{

        const response =
            await fetch(
                "/conversations",
                {
                    method:"POST"
                }
            );


        if(!response.ok){

            throw new Error(
                "خطا در ساخت گفتگو"
            );

        }


        const data =
            await response.json();


        currentConversationId =
            data.id;


        clearChat();


        sidebar.classList.remove(
            "open"
        );


        input.focus();


        await loadConversations();

    }catch(error){

        console.error(error);

    }

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    if(isSending){
        return;
    }


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    isSending = true;

    send.disabled = true;


    addMessage(
        text,
        "user"
    );


    input.value = "";

    input.style.height =
        "auto";


    typing.style.display =
        "flex";


    try{

        const response =
            await fetch(
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:text,

                        conversation_id:
                            currentConversationId

                    })
                }
            );


        if(!response.ok){

            const errorData =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );


            throw new Error(
                errorData.error ||
                "خطا در ارتباط با سرور"
            );

        }


        typing.style.display =
            "none";


        const botMessage =
            addMessage(
                "",
                "bot"
            );


        if(!response.body){

            throw new Error(
                "پاسخی از سرور دریافت نشد."
            );

        }


        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder(
                "utf-8"
            );


        let buffer = "";


        while(true){

            const result =
                await reader.read();


            if(result.done){
                break;
            }


            buffer +=
                decoder.decode(
                    result.value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split("\n");


            buffer =
                lines.pop();


            for(
                const line of lines
            ){

                const cleanLine =
                    line.trim();


                if(!cleanLine){
                    continue;
                }


                try{

                    const data =
                        JSON.parse(
                            cleanLine
                        );


                    if(
                        data.type ===
                        "text"
                    ){

                        botMessage.textContent +=
                            data.content;


                        chat.scrollTop =
                            chat.scrollHeight;

                    }


                    if(
                        data.type ===
                        "done"
                    ){

                        currentConversationId =
                            data.conversation_id;

                    }


                    if(
                        data.type ===
                        "error"
                    ){

                        botMessage.textContent =
                            data.content;

                    }

                }catch(error){

                    console.log(
                        "داده نامعتبر:",
                        cleanLine
                    );

                }

            }

        }


        await loadConversations();


    }catch(error){

        typing.style.display =
            "none";


        addMessage(
            error.message ||
            "ارتباط با سرور برقرار نشد.",
            "bot"
        );


        console.error(error);

    }


    typing.style.display =
        "none";


    isSending = false;

    send.disabled = false;

    input.focus();

}


/* =========================
   LOAD CONVERSATIONS
========================= */

async function loadConversations(){

    try{

        const response =
            await fetch(
                "/conversations"
            );


        if(!response.ok){

            throw new Error(
                "خطا در دریافت تاریخچه"
            );

        }


        const data =
            await response.json();


        historyList.innerHTML =
            "";


        if(data.length === 0){

            historyList.innerHTML =
                `
                <div
                    style="
                    padding:18px 10px;
                    color:#637990;
                    font-size:11px;
                    text-align:center;
                    "
                >
                    هنوز گفت‌وگویی وجود ندارد.
                </div>
                `;

            return;

        }


        data.forEach(
            conversation => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "conversation";


                if(
                    conversation.id ===
                    currentConversationId
                ){

                    row.classList.add(
                        "active"
                    );

                }


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "conversation-info";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "conversation-title";


                title.textContent =
                    conversation.title ||
                    "گفت‌وگوی جدید";


                const count =
                    document.createElement(
                        "div"
                    );


                count.className =
                    "conversation-count";


                count.textContent =
                    conversation.message_count +
                    " پیام";


                info.appendChild(title);

                info.appendChild(count);


                info.onclick =
                    () => {

                        openConversation(
                            conversation.id
                        );

                    };


                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-conversation";


                deleteButton.textContent =
                    "🗑";


                deleteButton.onclick =
                    event => {

                        event.stopPropagation();


                        deleteConversation(
                            conversation.id
                        );

                    };


                row.appendChild(info);

                row.appendChild(
                    deleteButton
                );


                historyList.appendChild(
                    row
                );

            }
        );

    }catch(error){

        console.error(error);

    }

}


/* =========================
   OPEN CONVERSATION
========================= */

async function openConversation(id){

    try{

        const response =
            await fetch(
                "/conversations/" +
                id +
                "/messages"
            );


        if(!response.ok){

            throw new Error(
                "خطا در دریافت گفتگو"
            );

        }


        const data =
            await response.json();


        currentConversationId =
            id;


        clearChat();


        data.forEach(
            message => {

                addMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "bot"
                );

            }
        );


        sidebar.classList.remove(
            "open"
        );


        await loadConversations();


        input.focus();

    }catch(error){

        console.error(error);

    }

}


/* =========================
   DELETE CONVERSATION
========================= */

async function deleteConversation(id){

    if(
        !confirm(
            "این گفت‌وگو حذف شود؟"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                "/conversations/" +
                id,
                {
                    method:"DELETE"
                }
            );


        if(!response.ok){

            throw new Error(
                "خطا در حذف گفتگو"
            );

        }


        if(
            currentConversationId ===
            id
        ){

            currentConversationId =
                null;

            clearChat();

        }


        await loadConversations();

    }catch(error){

        console.error(error);

    }

}


/* =========================
   DELETE ALL
========================= */

clearAll.onclick =
    async () => {

        if(
            !confirm(
                "همه گفت‌وگوها حذف شوند؟"
            )
        ){

            return;

        }


        try{

            const response =
                await fetch(
                    "/conversations",
                    {
                        method:"DELETE"
                    }
                );


            if(!response.ok){
                throw new Error(
                    "خطا در حذف گفتگوها"
                );
            }


            currentConversationId =
                null;


            clearChat();


            await loadConversations();

        }catch(error){

            console.error(error);

        }

    };

   BUTTONS
========================= */

newChatButton.onclick =

historyButton.onclick =

        sidebar.classList.add(
            "open"
        );

        loadConversations();

    };


mobileMenu.onclick =

    };

========================= */

        alert(
            "قابلیت تحلیل فایل در مرحله بعد فعال می‌شود."
        );

    };


webButton.onclick =

        alert(

        );

    };


/* =========================
   INPUT
========================= */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";


        input.style.height =
            Math.min(
                input.scrollHeight,
                145
            ) + "px";

    }
);


send.onclick =
    sendMessage;


/* =========================
   START
========================= */

loadConversations();

input.focus();

</script>
