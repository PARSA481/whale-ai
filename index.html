<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Whale AI</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #080b12;
    --sidebar: #0d111a;
    --panel: #101621;
    --panel2: #151c28;
    --border: #202a3a;
    --text: #f2f5f8;
    --muted: #8c97a8;
    --accent: #5b8cff;
    --accent2: #3974ff;
    --user: #1d2940;
    --assistant: #121923;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

    background: var(--bg);

    color: var(--text);

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    overflow: hidden;
}


/* =====================================================
   APP
===================================================== */

.app {

    display: flex;

    width: 100%;
    height: 100vh;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    width: 285px;

    min-width: 285px;

    background: var(--sidebar);

    border-left:
        1px solid var(--border);

    display: flex;

    flex-direction: column;

    padding: 18px 14px;

}


/* =====================================================
   LOGO
===================================================== */

.logo {

    display: flex;

    align-items: center;

    gap: 12px;

    padding:
        8px 10px 18px;

}


.whale-logo {

    width: 45px;
    height: 45px;

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #284fba,
            #16377f
        );

    box-shadow:
        0 8px 25px
        rgba(49, 102, 255, .22);

    font-size: 25px;

}


.logo-title {

    font-size: 19px;

    font-weight: 700;

}


.logo-subtitle {

    font-size: 11px;

    color: var(--muted);

    margin-top: 2px;

}


/* =====================================================
   NEW CHAT
===================================================== */

.new-chat {

    width: 100%;

    border: 1px solid
        #293650;

    background:
        #121a28;

    color: var(--text);

    border-radius: 12px;

    padding: 12px 14px;

    cursor: pointer;

    font-size: 14px;

    transition: .2s;

    margin-bottom: 16px;

}


.new-chat:hover {

    background:
        #182238;

    border-color:
        #38528a;

}


/* =====================================================
   SIDEBAR TITLE
===================================================== */

.sidebar-title {

    font-size: 12px;

    color: var(--muted);

    padding:
        0 8px 8px;

}


/* =====================================================
   CONVERSATIONS
===================================================== */

.conversations {

    flex: 1;

    overflow-y: auto;

}


.conversation {

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        11px 10px;

    border-radius: 10px;

    cursor: pointer;

    margin-bottom: 4px;

    color: #c9d0dc;

    transition: .15s;

}


.conversation:hover {

    background:
        #141c29;

}


.conversation.active {

    background:
        #19253a;

    color: white;

}


.conversation-text {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    flex: 1;

    font-size: 13px;

}


.delete-conversation {

    opacity: 0;

    border: 0;

    background: transparent;

    color: #8994a5;

    cursor: pointer;

    font-size: 14px;

}


.conversation:hover
.delete-conversation {

    opacity: 1;

}


.delete-conversation:hover {

    color: #ff6f7d;

}


/* =====================================================
   SIDEBAR BOTTOM
===================================================== */

.sidebar-bottom {

    border-top:
        1px solid var(--border);

    padding-top: 12px;

    margin-top: 10px;

}


.sidebar-button {

    width: 100%;

    border: 0;

    background: transparent;

    color: #aeb7c5;

    padding: 10px;

    border-radius: 9px;

    text-align: right;

    cursor: pointer;

}


.sidebar-button:hover {

    background:
        #141b27;

    color: white;

}


/* =====================================================
   MAIN
===================================================== */

.main {

    flex: 1;

    min-width: 0;

    display: flex;

    flex-direction: column;

    position: relative;

}


/* =====================================================
   TOPBAR
===================================================== */

.topbar {

    height: 64px;

    min-height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 24px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(8, 11, 18, .88);

    backdrop-filter:
        blur(15px);

}


.topbar-title {

    font-size: 15px;

    font-weight: 600;

}


.status {

    display: flex;

    align-items: center;

    gap: 7px;

    color: var(--muted);

    font-size: 12px;

}


.status-dot {

    width: 7px;
    height: 7px;

    background: #39d98a;

    border-radius: 50%;

    box-shadow:
        0 0 10px
        rgba(57, 217, 138, .7);

}


/* =====================================================
   CHAT
===================================================== */

.chat {

    flex: 1;

    overflow-y: auto;

    padding:
        30px 20px 170px;

}


.chat-inner {

    width: 100%;

    max-width: 900px;

    margin:
        0 auto;

}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    min-height:
        calc(100vh - 250px);

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;

    padding: 40px 20px;

}


.welcome-whale {

    font-size: 62px;

    margin-bottom: 18px;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(60, 110, 255, .25)
        );

}


.welcome h1 {

    margin: 0;

    font-size: 30px;

}


.welcome p {

    margin-top: 10px;

    color: var(--muted);

    font-size: 14px;

}


/* =====================================================
   MESSAGE
===================================================== */

.message-row {

    display: flex;

    margin-bottom: 22px;

}


.message-row.user {

    justify-content: flex-start;

}


.message-row.assistant {

    justify-content: flex-end;

}


.message {

    max-width: 82%;

    border-radius: 17px;

    padding:
        13px 16px;

    line-height: 1.85;

    font-size: 14px;

    white-space: normal;

    overflow-wrap: anywhere;

}


.user-message {

    background:
        var(--user);

    border:
        1px solid #293b5e;

}


.assistant-message {

    background:
        var(--assistant);

    border:
        1px solid var(--border);

}


.message-role {

    font-size: 10px;

    color: var(--muted);

    margin-bottom: 4px;

}


/* =====================================================
   MARKDOWN
===================================================== */

.message h1,
.message h2,
.message h3 {

    margin-top: 12px;

    margin-bottom: 8px;

}


.message p {

    margin:
        5px 0;

}


.message ul,
.message ol {

    padding-right: 22px;

}


.message code {

    background:
        #080d15;

    border:
        1px solid #222d3d;

    border-radius: 5px;

    padding:
        2px 5px;

    direction: ltr;

}


.message pre {

    direction: ltr;

    text-align: left;

    overflow-x: auto;

    background:
        #080d15;

    border:
        1px solid #222d3d;

    padding: 13px;

    border-radius: 10px;

}


.message pre code {

    background: transparent;

    border: 0;

    padding: 0;

}


/* =====================================================
   ATTACHMENT
===================================================== */

.file-card {

    display: flex;

    align-items: center;

    gap: 9px;

    background:
        #101a2a;

    border:
        1px solid #2a3b5a;

    padding:
        8px 10px;

    border-radius: 9px;

    margin-bottom: 8px;

    font-size: 12px;

}


.file-icon {

    font-size: 18px;

}


.file-name {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

}


/* =====================================================
   TYPING
===================================================== */

.typing {

    display: flex;

    align-items: center;

    gap: 5px;

    padding: 8px;

}


.typing span {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #75839a;

    animation:
        typing 1.2s infinite;

}


.typing span:nth-child(2) {

    animation-delay: .15s;

}


.typing span:nth-child(3) {

    animation-delay: .3s;

}


@keyframes typing {

    0%,
    60%,
    100% {

        transform: translateY(0);

        opacity: .35;

    }

    30% {

        transform:
            translateY(-4px);

        opacity: 1;

    }

}


/* =====================================================
   INPUT AREA
===================================================== */

.input-area {

    position: absolute;

    bottom: 0;

    right: 0;

    left: 0;

    padding:
        18px 20px 20px;

    background:
        linear-gradient(
            transparent,
            var(--bg) 25%
        );

}


.input-container {

    max-width: 900px;

    margin: 0 auto;

}


.composer {

    background:
        #111824;

    border:
        1px solid #273449;

    border-radius: 18px;

    box-shadow:
        0 12px 35px
        rgba(0, 0, 0, .25);

    overflow: hidden;

    transition: .2s;

}


.composer:focus-within {

    border-color:
        #3d5d99;

    box-shadow:
        0 12px 40px
        rgba(40, 70, 130, .18);

}


textarea {

    width: 100%;

    min-height: 54px;

    max-height: 180px;

    resize: none;

    border: 0;

    outline: none;

    background: transparent;

    color: white;

    padding:
        16px 18px 5px;

    font-family: inherit;

    font-size: 14px;

    line-height: 1.7;

}


textarea::placeholder {

    color: #697587;

}


/* =====================================================
   COMPOSER BOTTOM
===================================================== */

.composer-bottom {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        7px 9px 9px;

}


.composer-tools {

    display: flex;

    align-items: center;

    gap: 5px;

}


.tool-button {

    width: 38px;
    height: 38px;

    border: 0;

    border-radius: 10px;

    background: transparent;

    color: #9ba6b7;

    cursor: pointer;

    font-size: 18px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.tool-button:hover {

    background:
        #1a2434;

    color: white;

}


.send-button {

    width: 40px;
    height: 40px;

    border: 0;

    border-radius: 12px;

    background:
        var(--accent);

    color: white;

    cursor: pointer;

    font-size: 18px;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: .2s;

}


.send-button:hover {

    background:
        var(--accent2);

    transform:
        translateY(-1px);

}


.send-button:disabled {

    opacity: .45;

    cursor: not-allowed;

    transform: none;

}


/* =====================================================
   FILE PREVIEW
===================================================== */

.file-preview {

    display: none;

    padding:
        8px 12px 0;

}


.file-preview.show {

    display: block;

}


.file-preview-inner {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    max-width: 100%;

    padding:
        7px 9px;

    border:
        1px solid #2a3a55;

    background:
        #0d1521;

    border-radius: 9px;

    font-size: 12px;

}


.remove-file {

    border: 0;

    background: transparent;

    color: #8f9aaa;

    cursor: pointer;

}


.remove-file:hover {

    color: #ff6d7b;

}


.hidden {

    display: none !important;

}


/* =====================================================
   MOBILE
===================================================== */

.mobile-menu {

    display: none;

}


@media (max-width: 800px) {

    .sidebar {

        position: fixed;

        right: -300px;

        top: 0;

        bottom: 0;

        z-index: 100;

        transition: .25s;

        box-shadow:
            -10px 0 40px
            rgba(0,0,0,.35);

    }


    .sidebar.open {

        right: 0;

    }


    .mobile-menu {

        display: flex;

        width: 38px;
        height: 38px;

        border: 0;

        border-radius: 10px;

        background:
            #141c29;

        color: white;

        align-items: center;

        justify-content: center;

        cursor: pointer;

        font-size: 18px;

    }


    .topbar {

        padding:
            0 14px;

    }


    .chat {

        padding:
            20px 12px 160px;

    }


    .message {

        max-width: 90%;

        font-size: 13px;

    }


    .input-area {

        padding:
            10px 10px 12px;

    }


    .welcome h1 {

        font-size: 25px;

    }

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {

    width: 7px;

}


::-webkit-scrollbar-track {

    background: transparent;

}


::-webkit-scrollbar-thumb {

    background:
        #263143;

    border-radius: 10px;

}


::-webkit-scrollbar-thumb:hover {

    background:
        #344258;

}

</style>

</head>


<body>


<div class="app">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="logo">

            <div class="whale-logo">
                🐋
            </div>

            <div>

                <div class="logo-title">
                    Whale AI
                </div>

                <div class="logo-subtitle">
                    دستیار هوشمند فارسی
                </div>

            </div>

        </div>


        <button
            class="new-chat"
            onclick="newConversation()"
        >
            ＋ گفتگوی جدید
        </button>


        <div class="sidebar-title">
            گفتگوهای اخیر
        </div>


        <div
            class="conversations"
            id="conversations"
        >
        </div>


        <div class="sidebar-bottom">

            <button
                class="sidebar-button"
                onclick="clearAllConversations()"
            >
                🗑 پاک کردن همه گفتگوها
            </button>

            <button
                class="sidebar-button"
                onclick="showMemory()"
            >
                🧠 حافظه Whale
            </button>

        </div>

    </aside>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <header class="topbar">

            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:10px;
                "
            >

                <button
                    class="mobile-menu"
                    onclick="toggleSidebar()"
                >
                    ☰
                </button>

                <div
                    class="topbar-title"
                    id="topbarTitle"
                >
                    گفتگوی جدید
                </div>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                آنلاین

            </div>

        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-whale">
                        🐋
                    </div>

                    <h1>
                        سلام، من Whale AI هستم
                    </h1>

                    <p>
                        سؤال خودت را بپرس یا یک فایل برای بررسی ارسال کن.
                    </p>

                </div>

            </div>

        </section>


        <!-- =================================================
             INPUT
        ================================================== -->

        <div class="input-area">

            <div class="input-container">

                <div class="composer">


                    <div
                        class="file-preview"
                        id="filePreview"
                    >

                        <div class="file-preview-inner">

                            <span class="file-icon">
                                📎
                            </span>

                            <span
                                class="file-name"
                                id="fileName"
                            >
                            </span>

                            <button
                                class="remove-file"
                                onclick="removeFile()"
                            >
                                ×
                            </button>

                        </div>

                    </div>


                    <textarea
                        id="messageInput"
                        placeholder="پیامت را برای Whale AI بنویس..."
                        rows="1"
                    ></textarea>


                    <div class="composer-bottom">

                        <div class="composer-tools">

                            <button
                                class="tool-button"
                                title="آپلود فایل"
                                onclick="document.getElementById('fileInput').click()"
                            >
                                📎
                            </button>

                            <input
                                id="fileInput"
                                type="file"
                                class="hidden"
                                accept=".txt,.md,.csv,.json,.pdf,.docx"
                                onchange="handleFile(event)"
                            >

                        </div>


                        <button
                            class="send-button"
                            id="sendButton"
                            onclick="sendMessage()"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let currentConversationId = null;

let selectedFile = null;

let selectedFileText = "";


/* =====================================================
   ELEMENTS
===================================================== */

const chat = document.getElementById(
    "chat"
);

const chatInner = document.getElementById(
    "chatInner"
);

const messageInput = document.getElementById(
    "messageInput"
);

const sendButton = document.getElementById(
    "sendButton"
);

const conversationsElement =
    document.getElementById(
        "conversations"
    );


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadConversations();

        messageInput.focus();

    }
);


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations() {

    try {

        const response =
            await fetch(
                "/conversations"
            );


        const data =
            await response.json();


        conversationsElement.innerHTML = "";


        data.forEach(
            conversation => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "conversation"
                    + (
                        conversation.id ===
                        currentConversationId
                            ? " active"
                            : ""
                    );


                item.onclick =
                    () => loadConversation(
                        conversation.id
                    );


                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "conversation-text";


                text.textContent =
                    conversation.title ||
                    "گفتگوی جدید";


                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-conversation";


                deleteButton.textContent =
                    "×";


                deleteButton.onclick =
                    event => {

                        event.stopPropagation();

                        deleteConversation(
                            conversation.id
                        );

                    };


                item.appendChild(text);

                item.appendChild(
                    deleteButton
                );

                conversationsElement.appendChild(
                    item
                );

            }
        );


    } catch (error) {

        console.error(error);

    }

}


/* =====================================================
   NEW CONVERSATION
===================================================== */

async function newConversation() {

    try {

        const response =
            await fetch(
                "/conversations",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        currentConversationId =
            data.id;


        clearChat();


        document.getElementById(
            "topbarTitle"
        ).textContent =
            "گفتگوی جدید";


        removeFile();

        await loadConversations();


        closeMobileSidebar();


        messageInput.focus();


    } catch (error) {

        alert(
            "ساخت گفتگو انجام نشد."
        );

    }

}


/* =====================================================
   LOAD CONVERSATION
===================================================== */

async function loadConversation(id) {

    try {

        const response =
            await fetch(
                `/conversations/${id}/messages`
            );


        const messages =
            await response.json();


        currentConversationId = id;


        clearChat();


        messages.forEach(
            message => {

                addMessage(
                    message.role,
                    message.content
                );

            }
        );


        const conversations =
            await fetch(
                "/conversations"
            );


        const list =
            await conversations.json();


        const conversation =
            list.find(
                item => item.id === id
            );


        document.getElementById(
            "topbarTitle"
        ).textContent =
            conversation
                ? conversation.title
                : "گفتگو";


        await loadConversations();


        closeMobileSidebar();


        scrollToBottom();


    } catch (error) {

        console.error(error);

    }

}


/* =====================================================
   DELETE CONVERSATION
===================================================== */

async function deleteConversation(id) {

    if (
        !confirm(
            "این گفتگو حذف شود؟"
        )
    ) {

        return;

    }


    try {

        await fetch(
            `/conversations/${id}`,
            {
                method: "DELETE"
            }
        );


        if (
            currentConversationId === id
        ) {

            currentConversationId = null;

            clearChat();

            document.getElementById(
                "topbarTitle"
            ).textContent =
                "گفتگوی جدید";

        }


        await loadConversations();


    } catch (error) {

        alert(
            "حذف گفتگو انجام نشد."
        );

    }

}


/* =====================================================
   CLEAR ALL
===================================================== */

async function clearAllConversations() {

    if (
        !confirm(
            "همه گفتگوها حذف شوند؟"
        )
    ) {

        return;

    }


    try {

        await fetch(
            "/conversations",
            {
                method: "DELETE"
            }
        );


        currentConversationId = null;

        clearChat();


        document.getElementById(
            "topbarTitle"
        ).textContent =
            "گفتگوی جدید";


        await loadConversations();


    } catch (error) {

        alert(
            "پاک کردن گفتگوها انجام نشد."
        );

    }

}


/* =====================================================
   CLEAR CHAT
===================================================== */

function clearChat() {

    chatInner.innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-whale">
                🐋
            </div>

            <h1>
                سلام، من Whale AI هستم
            </h1>

            <p>
                سؤال خودت را بپرس یا یک فایل برای بررسی ارسال کن.
            </p>

        </div>

    `;

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
    role,
    content,
    fileName = ""
) {

    const welcome =
        document.getElementById(
            "welcome"
        );


    if (welcome) {

        welcome.remove();

    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row "
        + (
            role === "user"
                ? "user"
                : "assistant"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message "
        + (
            role === "user"
                ? "user-message"
                : "assistant-message"
        );


    const roleText =
        document.createElement(
            "div"
        );


    roleText.className =
        "message-role";


    roleText.textContent =
        role === "user"
            ? "شما"
            : "Whale AI";


    message.appendChild(
        roleText
    );


    if (fileName) {

        const fileCard =
            document.createElement(
                "div"
            );


        fileCard.className =
            "file-card";


        fileCard.innerHTML = `

            <span class="file-icon">
                📎
            </span>

            <span class="file-name">
                ${escapeHtml(fileName)}
            </span>

        `;


        message.appendChild(
            fileCard
        );

    }


    const contentElement =
        document.createElement(
            "div"
        );


    contentElement.innerHTML =
        formatMarkdown(content);


    message.appendChild(
        contentElement
    );


    row.appendChild(
        message
    );


    chatInner.appendChild(
        row
    );


    scrollToBottom();

}


/* =====================================================
   MARKDOWN
===================================================== */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatMarkdown(text) {

    let html =
        escapeHtml(
            String(text)
        );


    html =
        html.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );


    html =
        html.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );


    html =
        html.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
        );


    html =
        html.replace(
            /^# (.*)$/gm,
            "<h1>$1</h1>"
        );


    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    html =
        html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


    html =
        html.replace(
            /^\- (.*)$/gm,
            "• $1"
        );


    html =
        html.replace(
            /\n/g,
            "<br>"
        );


    return html;

}


/* =====================================================
   TYPING
===================================================== */

function showTyping() {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row assistant";


    row.id =
        "typingMessage";


    row.innerHTML = `

        <div class="message assistant-message">

            <div class="message-role">
                Whale AI
            </div>

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    chatInner.appendChild(
        row
    );


    scrollToBottom();

}


function removeTyping() {

    const element =
        document.getElementById(
            "typingMessage"
        );


    if (element) {

        element.remove();

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (
        !text &&
        !selectedFileText
    ) {

        return;

    }


    sendButton.disabled = true;


    const fileName =
        selectedFile
            ? selectedFile.name
            : "";


    addMessage(
        "user",
        text,
        fileName
    );


    messageInput.value = "";

    autoResize();


    showTyping();


    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            conversation_id:
                                currentConversationId,

                            file_name:
                                fileName,

                            file_text:
                                selectedFileText

                        })

                }
            );


        const data =
            await response.json();


        removeTyping();


        if (!response.ok) {

            addMessage(
                "assistant",
                data.error ||
                "خطایی رخ داد."
            );

            return;

        }


        currentConversationId =
            data.conversation_id;


        addMessage(
            "assistant",
            data.content
        );


        removeFile();


        await loadConversations();


    } catch (error) {

        removeTyping();


        addMessage(
            "assistant",
            "ارتباط با سرور برقرار نشد."
        );

        console.error(error);

    } finally {

        sendButton.disabled =
            false;

        messageInput.focus();

    }

}


/* =====================================================
   FILE UPLOAD
===================================================== */

async function handleFile(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const maxSize =
        20 * 1024 * 1024;


    if (file.size > maxSize) {

        alert(
            "حجم فایل نباید بیشتر از 20MB باشد."
        );

        event.target.value = "";

        return;

    }


    selectedFile = file;

    selectedFileText = "";


    document.getElementById(
        "fileName"
    ).textContent =
        file.name;


    document.getElementById(
        "filePreview"
    ).classList.add(
        "show"
    );


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    try {

        const response =
            await fetch(
                "/upload",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "آپلود ناموفق بود."
            );

        }


        selectedFileText =
            data.text || "";


        if (
            !selectedFileText &&
            data.extension === "pdf"
        ) {

            alert(
                "متن قابل استخراجی از PDF پیدا نشد."
            );

        }


    } catch (error) {

        console.error(error);

        alert(
            error.message ||
            "آپلود فایل انجام نشد."
        );


        removeFile();

    }

}


/* =====================================================
   REMOVE FILE
===================================================== */

function removeFile() {

    selectedFile = null;

    selectedFileText = "";


    const input =
        document.getElementById(
            "fileInput"
        );


    input.value = "";


    document.getElementById(
        "filePreview"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "fileName"
    ).textContent = "";

}


/* =====================================================
   TEXTAREA
===================================================== */

messageInput.addEventListener(
    "input",
    autoResize
);


function autoResize() {

    messageInput.style.height =
        "auto";


    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            180
        ) + "px";

}


/* =====================================================
   ENTER
===================================================== */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom() {

    setTimeout(
        () => {

            chat.scrollTo({

                top:
                    chat.scrollHeight,

                behavior:
                    "smooth"

            });

        },
        50
    );

}


/* =====================================================
   MOBILE
===================================================== */

function closeMobileSidebar() {

    document
        .getElementById("sidebar")
        .classList.remove("open");

}


/* =====================================================
   MEMORY
===================================================== */

async function showMemory() {

    try {

        const response =
            await fetch(
                "/memory"
            );


        const data =
            await response.json();


        if (
            !data.memories ||
            data.memories.length === 0
        ) {

            alert(
                "حافظه Whale خالی است."
            );

            return;

        }


        const text =
            data.memories
                .map(
                    memory =>
                        `${memory.key}: ${memory.value}`
                )
                .join("\n");


        alert(
            "حافظه Whale:\n\n" + text
        );


    } catch (error) {

        alert(
            "دریافت حافظه انجام نشد."
        );

    }

}
