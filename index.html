```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Whale AI</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#050914;
    --bg2:#07111f;
    --panel:rgba(11,20,34,.78);
    --panel-solid:#0b1626;
    --panel-soft:rgba(255,255,255,.045);
    --border:rgba(255,255,255,.085);
    --border-blue:rgba(69,157,255,.32);
    --text:#f4f8ff;
    --muted:#8fa4bc;
    --muted2:#62778f;
    --blue:#3295ff;
    --blue2:#1264c9;
    --cyan:#43c7ff;
    --danger:#ff6678;
    --success:#42db8b;
    --shadow:0 25px 80px rgba(0,0,0,.35);
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    color:var(--text);
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    background:
        radial-gradient(
            circle at 75% -15%,
            rgba(38,123,214,.24),
            transparent 34%
        ),
        radial-gradient(
            circle at 15% 110%,
            rgba(20,87,170,.14),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #030711,
            #07111f 55%,
            #040913
        );
}

button,
textarea,
input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:focus-visible,
textarea:focus-visible,
input:focus-visible{
    outline:2px solid rgba(67,165,255,.55);
    outline-offset:2px;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:300px;
    height:100vh;
    flex:0 0 300px;
    display:flex;
    flex-direction:column;
    background:
        linear-gradient(
            180deg,
            rgba(10,21,36,.94),
            rgba(5,13,24,.96)
        );
    border-left:1px solid var(--border);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    z-index:50;
}

.brand{
    min-height:82px;
    padding:17px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
}

.brand-logo{
    width:48px;
    height:48px;
    flex:0 0 48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    background:
        linear-gradient(
            145deg,
            #36a4ff,
            #1262c6
        );
    box-shadow:
        0 10px 28px rgba(35,137,255,.28),
        inset 0 1px rgba(255,255,255,.24);
    overflow:hidden;
}

.brand-logo svg{
    width:31px;
    height:31px;
}

.brand-text{
    min-width:0;
}

.brand-title{
    font-size:18px;
    font-weight:800;
    letter-spacing:.2px;
}

.brand-subtitle{
    margin-top:3px;
    color:var(--muted);
    font-size:10px;
}

.new-chat{
    margin:17px;
    height:46px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    color:white;
    font-size:13px;
    font-weight:700;
    background:
        linear-gradient(
            135deg,
            #349aff,
            #1768ce
        );
    box-shadow:
        0 10px 28px rgba(31,125,236,.2);
    transition:.2s ease;
}

.new-chat svg{
    width:18px;
    height:18px;
}

.new-chat:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.history-header{
    padding:0 18px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.history-heading{
    color:var(--muted);
    font-size:11px;
    font-weight:700;
}

.history-label{
    color:var(--muted2);
    font-size:10px;
}

#historyList{
    flex:1;
    overflow-y:auto;
    padding:0 10px 15px;
}

.conversation{
    min-height:54px;
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:5px;
    padding:9px 10px;
    border:1px solid transparent;
    border-radius:13px;
    transition:.18s ease;
}

.conversation:hover{
    background:rgba(255,255,255,.045);
    border-color:rgba(255,255,255,.05);
}

.conversation.active{
    background:
        linear-gradient(
            135deg,
            rgba(43,143,255,.15),
            rgba(31,101,177,.07)
        );
    border-color:rgba(58,150,255,.16);
}

.conversation-info{
    flex:1;
    min-width:0;
    cursor:pointer;
}

.conversation-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:#e9f2fc;
    font-size:12px;
}

.conversation-count{
    margin-top:4px;
    color:var(--muted2);
    font-size:9px;
}

.delete-conversation{
    width:29px;
    height:29px;
    flex:0 0 29px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:transparent;
    color:#60758c;
    transition:.18s;
}

.delete-conversation svg{
    width:15px;
    height:15px;
}

.delete-conversation:hover{
    color:var(--danger);
    background:rgba(255,80,100,.1);
}

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border);
}

.clear-all{
    width:100%;
    height:39px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border-radius:11px;
    background:transparent;
    color:#71869c;
    font-size:11px;
    transition:.18s;
}

.clear-all svg{
    width:15px;
    height:15px;
}

.clear-all:hover{
    color:var(--danger);
    background:rgba(255,255,255,.04);
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    height:72px;
    flex:0 0 72px;
    padding:0 23px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:rgba(5,12,21,.58);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    z-index:10;
}

.top-left{
    display:flex;
    align-items:center;
    gap:11px;
}

.mobile-menu{
    display:none;
    width:38px;
    height:38px;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:rgba(255,255,255,.055);
    color:#e9f4ff;
}

.mobile-menu svg{
    width:19px;
    height:19px;
}

.model-info{
    display:flex;
    align-items:center;
    gap:9px;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 14px rgba(66,219,139,.75);
}

.model-name{
    font-size:13px;
    font-weight:800;
}

.model-status{
    margin-top:3px;
    color:var(--muted2);
    font-size:9px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.top-action{
    height:36px;
    padding:0 11px;
    display:flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--border);
    border-radius:10px;
    background:rgba(255,255,255,.045);
    color:#cbd9e8;
    font-size:11px;
    transition:.18s;
}

.top-action:hover{
    background:rgba(255,255,255,.075);
    border-color:rgba(255,255,255,.12);
}

.top-action svg{
    width:15px;
    height:15px;
}

/* =========================
   CHAT
========================= */

#chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:
        32px
        max(18px, calc((100% - 920px) / 2))
        40px;
    scroll-behavior:smooth;
}

.welcome{
    max-width:850px;
    margin:0 auto;
    padding:44px 20px 25px;
    text-align:center;
    animation:fadeIn .45s ease;
}

.welcome-logo{
    width:88px;
    height:88px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:28px;
    background:
        linear-gradient(
            145deg,
            #38a7ff,
            #1059b3
        );
    box-shadow:
        0 18px 55px rgba(26,124,235,.27),
        inset 0 1px rgba(255,255,255,.22);
}

.welcome-logo svg{
    width:54px;
    height:54px;
}

.welcome h1{
    margin:0;
    font-size:30px;
    font-weight:850;
    letter-spacing:-.5px;
}

.welcome h1 span{
    background:
        linear-gradient(
            90deg,
            #fff,
            #79c8ff
        );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.welcome p{
    margin:11px 0 0;
    color:var(--muted);
    font-size:13px;
}

.quick-actions{
    max-width:720px;
    margin:29px auto 0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.quick-card{
    min-height:92px;
    padding:15px;
    text-align:right;
    border:1px solid var(--border);
    border-radius:16px;
    background:rgba(255,255,255,.035);
    color:var(--text);
    transition:.2s ease;
}

.quick-card:hover{
    transform:translateY(-2px);
    border-color:var(--border-blue);
    background:rgba(40,130,220,.075);
}

.quick-icon{
    width:31px;
    height:31px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:rgba(52,150,255,.12);
    color:#62b7ff;
}

.quick-icon svg{
    width:17px;
    height:17px;
}

.quick-title{
    font-size:11px;
    font-weight:700;
}

.quick-desc{
    margin-top:4px;
    color:var(--muted2);
    font-size:9px;
}

.message-row{
    display:flex;
    margin:18px 0;
    animation:messageIn .22s ease;
}

.message-row.user-row{
    justify-content:flex-start;
}

.message-row.bot-row{
    justify-content:flex-end;
}

.avatar{
    width:34px;
    height:34px;
    flex:0 0 34px;
    margin:0 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
}

.avatar svg{
    width:19px;
    height:19px;
}

.user-avatar{
    background:linear-gradient(145deg,#1c76d9,#1259aa);
}

.bot-avatar{
    background:linear-gradient(145deg,#172b42,#0e1c2e);
    border:1px solid rgba(255,255,255,.07);
}

.message-box{
    max-width:min(78%,740px);
}

.message{
    padding:13px 16px;
    border-radius:17px;
    line-height:1.85;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:13.5px;
}

.user-message{
    color:#fff;
    background:
        linear-gradient(
            135deg,
            #217ddd,
            #145cae
        );
    border-bottom-left-radius:5px;
    box-shadow:0 8px 25px rgba(15,92,174,.13);
}

.bot-message{
    background:
        linear-gradient(
            145deg,
            rgba(17,33,52,.96),
            rgba(12,25,42,.94)
        );
    border:1px solid rgba(255,255,255,.065);
    border-bottom-right-radius:5px;
}

.message-actions{
    display:flex;
    justify-content:flex-start;
    gap:4px;
    margin-top:5px;
    direction:ltr;
}

.message-action{
    display:flex;
    align-items:center;
    gap:4px;
    padding:4px 7px;
    border-radius:7px;
    background:transparent;
    color:#71879e;
    font-size:10px;
    opacity:.65;
    transition:.18s;
}

.message-action:hover{
    opacity:1;
    background:rgba(255,255,255,.045);
    color:#c6d6e7;
}

.message-action svg{
    width:12px;
    height:12px;
}

#typing{
    display:none;
    align-items:center;
    justify-content:flex-end;
    margin:8px 0 14px;
    color:var(--muted2);
    font-size:10px;
}

.typing-box{
    display:flex;
    align-items:center;
    gap:7px;
}

.typing-dots{
    display:flex;
    gap:4px;
}

.typing-dots span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#7591ad;
    animation:bounce 1s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.15s;
}

.typing-dots span:nth-child(3){
    animation-delay:.3s;
}

/* =========================
   INPUT
========================= */

.input-wrapper{
    padding:
        10px
        max(14px, calc((100% - 940px) / 2))
        18px;
    background:
        linear-gradient(
            transparent,
            rgba(4,10,17,.94) 30%
        );
}

.input-box{
    max-width:920px;
    min-height:62px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:18px;
    background:
        linear-gradient(
            145deg,
            rgba(15,31,49,.97),
            rgba(10,23,38,.97)
        );
    box-shadow:var(--shadow);
    transition:.2s;
}

.input-box:focus-within{
    border-color:rgba(53,151,255,.45);
    box-shadow:
        0 0 0 3px rgba(42,139,238,.07),
        var(--shadow);
}

.input-tools{
    display:flex;
    align-items:center;
    gap:4px;
}

.tool-button{
    width:39px;
    height:39px;
    flex:0 0 39px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:transparent;
    color:#7890a8;
    transition:.18s;
}

.tool-button:hover{
    color:#b9d8f5;
    background:rgba(255,255,255,.055);
}

.tool-button.active{
    color:#68bcff;
    background:rgba(39,143,239,.12);
}

.tool-button svg{
    width:18px;
    height:18px;
}

#input{
    flex:1;
    min-width:0;
    max-height:145px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:#f7fbff;
    padding:9px 7px;
    font-size:13px;
    line-height:1.65;
}

#input::placeholder{
    color:#62788f;
}

#send{
    width:43px;
    height:43px;
    flex:0 0 43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:
        linear-gradient(
            145deg,
            #319cff,
            #1465c7
        );
    color:white;
    box-shadow:0 7px 22px rgba(30,126,235,.2);
    transition:.2s;
}

#send svg{
    width:19px;
    height:19px;
}

#send:hover{
    transform:scale(1.045);
}

#send:disabled{
    opacity:.42;
    transform:none;
    cursor:not-allowed;
}

.search-status{
    display:none;
    max-width:920px;
    margin:6px auto 0;
    padding:0 5px;
    color:#69baff;
    font-size:9px;
}

.hint{
    text-align:center;
    color:#4d637a;
    font-size:9px;
    margin-top:7px;
}

/* =========================
   MOBILE OVERLAY
========================= */

.sidebar-overlay{
    display:none;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:#1a3047;
    border-radius:20px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes bounce{
    0%,60%,100%{
        transform:translateY(0);
    }
    30%{
        transform:translateY(-4px);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    .sidebar{
        position:fixed;
        right:-310px;
        top:0;
        width:300px;
        flex-basis:300px;
        box-shadow:-25px 0 70px rgba(0,0,0,.42);
        transition:right .25s ease;
    }

    .sidebar.open{
        right:0;
    }

    .sidebar-overlay{
        position:fixed;
        inset:0;
        z-index:40;
        background:rgba(0,0,0,.45);
        backdrop-filter:blur(2px);
    }

    .sidebar-overlay.show{
        display:block;
    }

    .mobile-menu{
        display:flex;
    }

    .topbar{
        height:64px;
        flex-basis:64px;
        padding:0 12px;
    }

    .top-action.history-label-button{
        padding:0 9px;
    }

    .top-action span{
        display:none;
    }

    #chat{
        padding:20px 11px 28px;
    }

    .welcome{
        padding:30px 10px 20px;
    }

    .welcome-logo{
        width:72px;
        height:72px;
        border-radius:23px;
    }

    .welcome-logo svg{
        width:43px;
        height:43px;
    }

    .welcome h1{
        font-size:24px;
    }

    .quick-actions{
        grid-template-columns:1fr;
        max-width:420px;
        margin-top:23px;
    }

    .quick-card{
        min-height:auto;
        padding:12px;
        display:flex;
        align-items:center;
        gap:11px;
        text-align:right;
    }

    .quick-icon{
        margin:0;
        flex:0 0 31px;
    }

    .message-box{
        max-width:84%;
    }

    .message{
        font-size:13px;
    }

    .input-wrapper{
        padding:8px 8px 12px;
    }

    .input-box{
        min-height:57px;
        border-radius:16px;
    }

    .tool-button{
        width:35px;
        height:35px;
        flex-basis:35px;
    }

    #send{
        width:40px;
        height:40px;
        flex-basis:40px;
    }

    .hint{
        font-size:8px;
    }
}

@media(max-width:420px){

    .brand{
        padding:15px;
    }

    .topbar{
        padding:0 9px;
    }

    .model-name{
        font-size:12px;
    }

    .message-box{
        max-width:88%;
    }

    .avatar{
        width:30px;
        height:30px;
        flex-basis:30px;
        margin:0 5px;
    }

    .input-tools{
        gap:1px;
    }

    .tool-button{
        width:32px;
        height:32px;
        flex-basis:32px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="brand-logo">
                <svg viewBox="0 0 64 64" fill="none">
                    <path
                        d="M10 37c8 12 24 17 37 10 8-4 12-11 12-20-4 5-9 8-15 8-8 0-13-5-17-11-3-5-7-7-12-6 3 3 4 7 2 11-2 4-4 6-7 8Z"
                        fill="white"
                        opacity=".96"
                    />
                    <path
                        d="M39 14c2-5 6-8 11-9-1 4-1 8 1 11"
                        stroke="white"
                        stroke-width="4"
                        stroke-linecap="round"
                        opacity=".95"
                    />
                    <circle
                        cx="45"
                        cy="28"
                        r="2.4"
                        fill="#1265c9"
                    />
                </svg>
            </div>

            <div class="brand-text">
                <div class="brand-title">Whale AI</div>
                <div class="brand-subtitle">
                    دستیار هوشمند شما
                </div>
            </div>

        </div>

        <button class="new-chat" id="newChatButton">

            <svg viewBox="0 0 24 24" fill="none">
                <path
                    d="M12 5v14M5 12h14"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                />
            </svg>

            گفت‌وگوی جدید

        </button>

        <div class="history-header">
            <div class="history-heading">
                گفت‌وگوهای اخیر
            </div>

            <div class="history-label">
                Whale AI
            </div>
        </div>

        <div id="historyList"></div>

        <div class="sidebar-bottom">

            <button class="clear-all" id="clearAll">

                <svg viewBox="0 0 24 24" fill="none">
                    <path
                        d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

                حذف همه گفتگوها

            </button>

        </div>

    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">

<script>

let currentConversationId = null;
let isSending = false;

const input =

const send =

    document.getElementById("searchStatus");


/* =========================
   WELCOME
========================= */

function showWelcome(){
    welcome.style.display = "block";
}

function hideWelcome(){
    welcome.style.display = "none";
}


/* =========================
   MESSAGE
========================= */

function createIcon(type){

    if(type === "user"){

        return `
            <svg viewBox="0 0 24 24" fill="none">
                <circle
                    cx="12"
                    cy="8"
                    r="3"
                    stroke="currentColor"
                    stroke-width="1.7"
                />
                <path
                    d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                />
            </svg>
        `;

    }

    return `
        <svg viewBox="0 0 64 64" fill="none">
            <path
                d="M10 37c8 12 24 17 37 10 8-4 12-11 12-20-4 5-9 8-15 8-8 0-13-5-17-11-3-5-7-7-12-6 3 3 4 7 2 11-2 4-4 6-7 8Z"
                fill="currentColor"
            />
            <path
                d="M39 14c2-5 6-8 11-9-1 4-1 8 1 11"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
            />
            <circle
                cx="45"
                cy="28"
                r="2.4"
                fill="#07111f"
            />
        </svg>
    `;
}


function addMessage(text, type){

    hideWelcome();

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (
            type === "user"
                ? "user-row"
                : "bot-row"
        );


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            type === "user"
                ? "user-avatar"
                : "bot-avatar"
        );

    avatar.innerHTML =
        createIcon(type);


    const box =
        document.createElement("div");

    box.className =
        "message-box";


    const message =
        document.createElement("div");

    message.className =
        "message " +
        (
            type === "user"
                ? "user-message"
                : "bot-message"
        );

    message.textContent =
        text;


    box.appendChild(message);


    if(type === "bot"){

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.className =
            "message-action";

        copy.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none">
                <rect
                    x="8"
                    y="8"
                    width="11"
                    height="11"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.6"
                />
                <path
                    d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
                    stroke="currentColor"
                    stroke-width="1.6"
                />
            </svg>
            کپی
        `;


        copy.onclick =
            async () => {

                try{

                    await navigator.clipboard.writeText(
                        message.textContent
                    );

                    copy.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none">
                            <path
                                d="m5 12 4 4L19 6"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        کپی شد
                    `;

                    setTimeout(
                        () => {

                            copy.innerHTML = `
                                <svg viewBox="0 0 24 24" fill="none">
                                    <rect
                                        x="8"
                                        y="8"
                                        width="11"
                                        height="11"
                                        rx="2"
                                        stroke="currentColor"
                                        stroke-width="1.6"
                                    />
                                    <path
                                        d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
                                        stroke="currentColor"
                                        stroke-width="1.6"
                                    />
                                </svg>
                                کپی
                            `;

                        },
                        1500
                    );

                }catch(error){

                    console.error(error);

                }

            };


        actions.appendChild(copy);

        box.appendChild(actions);

    }


    if(type === "user"){

        row.appendChild(box);
        row.appendChild(avatar);

    }else{

        row.appendChild(avatar);
        row.appendChild(box);

    }


    chat.insertBefore(
        row,
        typing
    );

    chat.scrollTop =
        chat.scrollHeight;


    return message;
}

async function createNewConversation(){

    try{

        const response =
            await fetch(
                "/conversations",
                {
                    method:"POST"
                }
            );

        if(!response.ok){

            throw new Error(
                "خطا در ساخت گفتگو"
            );

        }

        const data =
            await response.json();

        currentConversationId =
            data.id;

        clearChat();

        closeSidebar();

        input.focus();

        await loadConversations();

    }catch(error){

        console.error(error);

    }
}


/* =========================
   SEND
========================= */

async function sendMessage(){

    if(isSending){
        return;
    }

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    isSending = true;

    send.disabled = true;

    addMessage(
        text,
        "user"
    );

    input.value = "";

    input.style.height =
        "auto";

    typing.style.display =
        "flex";

    try{

        const response =
            await fetch(
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:text,

                        conversation_id:
                            currentConversationId

                    })
                }
            );


        if(!response.ok){

            const errorData =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );

            throw new Error(
                errorData.error ||
                "خطا در ارتباط با سرور"
            );

        }


        typing.style.display =
            "none";


        const botMessage =
            addMessage(
                "",
                "bot"
            );


        if(!response.body){

            throw new Error(
                "پاسخی از سرور دریافت نشد."
            );

        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder("utf-8");

        let buffer = "";


        while(true){

            const result =
                await reader.read();

            if(result.done){
                break;
            }


            buffer +=
                decoder.decode(
                    result.value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split("\n");

            buffer =
                lines.pop();


            for(
                const line of lines
            ){

                const cleanLine =
                    line.trim();

                if(!cleanLine){
                    continue;
                }


                try{

                    const data =
                        JSON.parse(
                            cleanLine
                        );


                    if(
                        data.type ===
                        "text"
                    ){

                        botMessage.textContent +=
                            data.content;

                        chat.scrollTop =
                            chat.scrollHeight;

                    }


                    if(
                        data.type ===
                        "done"
                    ){

                        currentConversationId =
                            data.conversation_id;

                    }


                    if(
                        data.type ===
                        "error"
                    ){

                        botMessage.textContent =
                            data.content;

                    }

                }catch(error){

                    console.log(
                        "داده نامعتبر:",
                        cleanLine
                    );

                }

            }

        }


        await loadConversations();


    }catch(error){

        typing.style.display =
            "none";

        addMessage(
            error.message ||
            "ارتباط با سرور برقرار نشد.",
            "bot"
        );

        console.error(error);

    }


    typing.style.display =
        "none";

    isSending = false;

    send.disabled = false;

    input.focus();

}


/* =========================
   LOAD CONVERSATIONS
========================= */

async function loadConversations(){

    try{

        const response =
            await fetch(
                "/conversations"
            );


        if(!response.ok){

            throw new Error(
                "خطا در دریافت تاریخچه"
            );

        }


        const data =
            await response.json();


        historyList.innerHTML =
            "";


        if(data.length === 0){

            historyList.innerHTML = `
                <div style="
                    padding:20px 12px;
                    color:#647990;
                    font-size:10px;
                    text-align:center;
                ">
                    هنوز گفت‌وگویی وجود ندارد.
                </div>
            `;

            return;

        }


        data.forEach(
            conversation => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "conversation";


                if(
                    conversation.id ===
                    currentConversationId
                ){

                    row.classList.add(
                        "active"
                    );

                }


                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "conversation-info";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "conversation-title";

                title.textContent =
                    conversation.title ||
                    "گفت‌وگوی جدید";


                const count =
                    document.createElement(
                        "div"
                    );

                count.className =
                    "conversation-count";

                count.textContent =
                    conversation.message_count +
                    " پیام";


                info.appendChild(title);
                info.appendChild(count);


                info.onclick =
                    () => {

                        openConversation(
                            conversation.id
                        );

                    };


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "delete-conversation";

                deleteButton.title =
                    "حذف گفتگو";

                deleteButton.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none">
                        <path
                            d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                `;


                deleteButton.onclick =
                    event => {

                        event.stopPropagation();

                        deleteConversation(
                            conversation.id
                        );

                    };


                row.appendChild(info);
                row.appendChild(deleteButton);

                historyList.appendChild(row);

            }
        );


    }catch(error){

        console.error(error);

    }

}


/* =========================
   OPEN CONVERSATION
========================= */

async function openConversation(id){

    try{

        const response =
            await fetch(
                "/conversations/" +
                id +
                "/messages"
            );


        if(!response.ok){

            throw new Error(
                "خطا در دریافت گفتگو"
            );

        }


        const data =
            await response.json();


        currentConversationId =
            id;


        clearChat();


        data.forEach(
            message => {

                addMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "bot"
                );

            }
        );


        closeSidebar();

        await loadConversations();

        input.focus();


    }catch(error){

        console.error(error);

    }

}


/* =========================

========================= */

async function deleteConversation(id){

    if(
        !confirm(
            "این گفت‌وگو حذف شود؟"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                "/conversations/" +
                id,
                {
                    method:"DELETE"
                }
            );


        if(!response.ok){

            throw new Error(
                "خطا در حذف گفتگو"
            );

        }


        if(
            currentConversationId === id
        ){

            currentConversationId =
                null;

            clearChat();

        }


        await loadConversations();


    }catch(error){

        console.error(error);

    }

}
