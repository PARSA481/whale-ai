                    </div>

                    id="input"

                ></textarea>

<script>

let currentConversationId = null;
let isSending = false;

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chat =
    document.getElementById("chat");

const typing =
    document.getElementById("typing");

const welcome =
    document.getElementById("welcome");

const historyButton =
    document.getElementById("historyButton");

const historyList =
    document.getElementById("historyList");

const newChatButton =
    document.getElementById("newChatButton");

const clearAll =
    document.getElementById("clearAll");

const mobileMenu =
    document.getElementById("mobileMenu");

const sidebar =
    document.getElementById("sidebar");


function showWelcome() {
    welcome.style.display = "block";
}


function hideWelcome() {
    welcome.style.display = "none";
}


function addMessage(text, type) {

    hideWelcome();

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (type === "user"
            ? "user-row"
            : "bot-row");


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (type === "user"
            ? "user-avatar"
            : "bot-avatar");

    avatar.textContent =
        type === "user"
            ? "👤"
            : "🐋";


    const box =
        document.createElement("div");

    box.className =
        "message-box";


    const message =
        document.createElement("div");

    message.className =
        "message " +
        (type === "user"
            ? "user-message"
            : "bot-message");

    message.textContent =
        text;


    box.appendChild(message);


    if (type === "bot") {

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.className =
            "copy-btn";

        copy.textContent =
            "📋 کپی";


        copy.onclick = async () => {

            try {

                await navigator.clipboard.writeText(
                    message.textContent
                );

                copy.textContent =
                    "✓ کپی شد";

                setTimeout(() => {

                    copy.textContent =
                        "📋 کپی";

                }, 1500);

            } catch (error) {

                console.error(error);

            }

        };


        actions.appendChild(copy);

        box.appendChild(actions);

    }


    if (type === "user") {

        row.appendChild(box);
        row.appendChild(avatar);

    } else {

        row.appendChild(avatar);
        row.appendChild(box);

    }


    chat.insertBefore(
        row,
        typing
    );

    chat.scrollTop =
        chat.scrollHeight;


    return message;
}


function clearChat() {

    chat.querySelectorAll(
        ".message-row"
    ).forEach(
        element => element.remove()
    );

    showWelcome();
}


async function createNewConversation() {

    try {

        const response =
            await fetch(
                "/conversations",
                {
                    method: "POST"
                }
            );


        if (!response.ok) {
            throw new Error(
                "خطا در ساخت گفتگو"
            );
        }


        const data =
            await response.json();


        currentConversationId =
            data.id;


        clearChat();

        sidebar.classList.remove(
            "open"
        );

        input.focus();

        await loadConversations();


    } catch (error) {

        console.error(error);

    }
}


async function sendMessage() {

    if (isSending) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    isSending = true;

    send.disabled = true;


    addMessage(
        text,
        "user"
    );


    input.value = "";

    input.style.height =
        "auto";


    typing.style.display =
        "flex";


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message: text,

                        conversation_id:
                            currentConversationId

                    })
                }
            );


        if (!response.ok) {

            const errorData =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );


            throw new Error(
                errorData.error ||
                "خطا در ارتباط با سرور"
            );

        }


        typing.style.display =
            "none";


        const botMessage =
            addMessage(
                "",
                "bot"
            );


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder(
                "utf-8"
            );


        let buffer = "";


        while (true) {

            const result =
                await reader.read();


            if (result.done) {
                break;
            }


            buffer +=
                decoder.decode(
                    result.value,
                    {
                        stream: true
                    }
                );


            const lines =
                buffer.split("\n");


            buffer =
                lines.pop();


            for (
                const line of lines
            ) {

                const cleanLine =
                    line.trim();


                if (!cleanLine) {
                    continue;
                }


                try {

                    const data =
                        JSON.parse(
                            cleanLine
                        );


                    if (
                        data.type ===
                        "text"
                    ) {

                        botMessage.textContent +=
                            data.content;

                        chat.scrollTop =
                            chat.scrollHeight;

                    }


                    if (
                        data.type ===
                        "done"
                    ) {

                        currentConversationId =
                            data.conversation_id;

                    }


                    if (
                        data.type ===
                        "error"
                    ) {

                        botMessage.textContent =
                            data.content;

                    }


                } catch (error) {

                    console.log(
                        "داده نامعتبر:",
                        cleanLine
                    );

                }

            }

        }


        await loadConversations();


    } catch (error) {

        typing.style.display =
            "none";


        addMessage(
            error.message ||
            "ارتباط با سرور برقرار نشد.",
            "bot"
        );


        console.error(error);

    }


    typing.style.display =
        "none";


    isSending = false;

    send.disabled = false;

    input.focus();

}


async function loadConversations() {

    try {

        const response =
            await fetch(
                "/conversations"
            );


        if (!response.ok) {
            throw new Error(
                "خطا در دریافت تاریخچه"
            );
        }


        const data =
            await response.json();


        historyList.innerHTML =
            "";


        if (
            data.length === 0
        ) {

            historyList.innerHTML =
                '<div style="padding:15px;color:#71869d;font-size:12px;text-align:center;">هنوز گفت‌وگویی وجود ندارد.</div>';

            return;

        }


        data.forEach(
            conversation => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "conversation";


                if (
                    conversation.id ===
                    currentConversationId
                ) {

                    row.classList.add(
                        "active"
                    );

                }


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "conversation-info";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "conversation-title";


                title.textContent =
                    conversation.title ||
                    "گفت‌وگوی جدید";


                const count =
                    document.createElement(
                        "div"
                    );


                count.className =
                    "conversation-count";


                count.textContent =
                    conversation.message_count +
                    " پیام";


                info.appendChild(
                    title
                );

                info.appendChild(
                    count
                );


                info.onclick =
                    () => {

                        openConversation(
                            conversation.id
                        );

                    };


                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-conversation";


                deleteButton.textContent =
                    "🗑";


                deleteButton.onclick =
                    event => {

                        event.stopPropagation();

                        deleteConversation(
                            conversation.id
                        );

                    };


                row.appendChild(
                    info
                );

                row.appendChild(
                    deleteButton
                );


                historyList.appendChild(
                    row
                );

            }
        );


    } catch (error) {

        console.error(error);

    }

}


async function openConversation(id) {

    try {

        const response =
            await fetch(
                "/conversations/" +
                id +
                "/messages"
            );


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت گفتگو"
            );

        }


        const data =
            await response.json();


        currentConversationId =
            id;


        clearChat();


        data.forEach(
            message => {

                addMessage(
                    message.content,
                    message.role ===
                    "user"
                        ? "user"
                        : "bot"
                );

            }
        );


        sidebar.classList.remove(
            "open"
        );


        await loadConversations();


        input.focus();


    } catch (error) {

        console.error(error);

    }

}


async function deleteConversation(id) {

    if (
        !confirm(
