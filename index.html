
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#080b12">

<title>Whale AI</title>

<style>

/* =====================================================
   THEME VARIABLES
===================================================== */

:root {
    --bg: #080b12;
    --surface: #0d1119;
    --surface-2: #111824;
    --surface-3: #151d2a;

    --border: #202837;
    --border-strong: #29364b;

    --text: #f4f7fb;
    --text-soft: #bbc4d2;
    --muted: #7f8a9d;

    --accent: #5b8cff;
    --accent-hover: #4079f3;

    --user-bg: #1b2941;
    --user-border: #2b4167;

    --assistant-bg: #111923;
    --assistant-border: #222d3d;

    --code-bg: #080d15;

    --danger: #c94b5d;

    --shadow:
        0 15px 45px rgba(0,0,0,.28);

    --transition: .22s ease;
}


/* =====================================================
   LIGHT THEME
===================================================== */

body.light {

    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #ffffff;
    --surface-3: #eef2f7;

    --border: #dce2eb;
    --border-strong: #cbd4e2;

    --text: #172033;
    --text-soft: #4c586c;
    --muted: #778298;

    --accent: #4678ee;
    --accent-hover: #3567da;

    --user-bg: #e8f0ff;
    --user-border: #c8d9ff;

    --assistant-bg: #ffffff;
    --assistant-border: #dce2eb;

    --code-bg: #f0f3f7;

    --danger: #c94255;

    --shadow:
        0 15px 40px rgba(35,50,75,.12);
}


/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {

    background: var(--bg);
    color: var(--text);

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    overflow: hidden;

    overscroll-behavior: none;

    transition:
        background var(--transition),
        color var(--transition);
}

button,
textarea,
input {
    font: inherit;
}

button {
    -webkit-user-select: none;
    user-select: none;
}


/* =====================================================
   APP
===================================================== */

.app {
    width: 100%;
    height: 100dvh;

    display: flex;

    overflow: hidden;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    width: 280px;
    min-width: 280px;

    background: var(--surface);

    border-right:
        1px solid var(--border);

    display: flex;
    flex-direction: column;

    padding: 16px;

    z-index: 100;

    transition:
        background var(--transition),
        border-color var(--transition);
}


/* =====================================================
   BRAND
===================================================== */

.brand {

    display: flex;
    align-items: center;

    gap: 11px;

    padding:
        6px 6px 18px;
}

.brand-logo {

    width: 43px;
    height: 43px;

    border-radius: 13px;

    object-fit: cover;

    background: #111a2b;

    border:
        1px solid #263b60;

    box-shadow:
        0 8px 25px
        rgba(52,105,255,.18);
}

.brand-name {

    font-size: 18px;

    font-weight: 700;

    letter-spacing: -.2px;
}

.brand-subtitle {

    margin-top: 3px;

    font-size: 11px;

    color: var(--muted);
}


/* =====================================================
   NEW CHAT
===================================================== */

.new-chat {

    width: 100%;
    height: 44px;

    border:
        1px solid var(--border-strong);

    border-radius: 12px;

    background: var(--surface-2);

    color: var(--text);

    cursor: pointer;

    font-size: 13px;

    font-weight: 600;

    transition: var(--transition);

    margin-bottom: 18px;
}

.new-chat:hover {

    background: var(--surface-3);

    border-color: var(--accent);
}


/* =====================================================
   SIDEBAR TITLE
===================================================== */

.sidebar-title {

    color: var(--muted);

    font-size: 11px;

    font-weight: 600;

    padding:
        0 7px 8px;

    text-transform: uppercase;

    letter-spacing: .5px;
}


/* =====================================================
   CONVERSATIONS
===================================================== */

.conversations {

    flex: 1;

    overflow-y: auto;

    min-height: 0;
}

.conversation {

    width: 100%;

    display: flex;
    align-items: center;

    gap: 8px;

    padding:
        10px 9px;

    margin-bottom: 3px;

    border-radius: 10px;

    color: var(--text-soft);

    cursor: pointer;

    transition: var(--transition);
}

.conversation:hover {

    background: var(--surface-3);
}

.conversation.active {

    background: var(--user-bg);

    color: var(--text);
}

.conversation-text {

    flex: 1;
    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;
}

.delete-conversation {

    width: 25px;
    height: 25px;

    border: 0;

    border-radius: 7px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    opacity: 0;

    transition: .15s;
}

.conversation:hover
.delete-conversation {

    opacity: 1;
}

.delete-conversation:hover {

    color: #ff7180;

    background: rgba(255,70,90,.1);
}


/* =====================================================
   SIDEBAR BOTTOM
===================================================== */

.sidebar-bottom {

    border-top:
        1px solid var(--border);

    margin-top: 10px;

    padding-top: 10px;
}

.sidebar-button {

    width: 100%;

    border: 0;

    background: transparent;

    color: var(--text-soft);

    text-align: left;

    padding: 10px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 12px;

    transition: .15s;
}

.sidebar-button:hover {

    background: var(--surface-3);

    color: var(--text);
}


/* =====================================================
   MAIN
===================================================== */

.main {

    flex: 1;

    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;

    position: relative;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar {

    height: 62px;
    min-height: 62px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 22px;

    background:
        color-mix(
            in srgb,
            var(--bg) 88%,
            transparent
        );

    border-bottom:
        1px solid var(--border);

    backdrop-filter:
        blur(16px);

    z-index: 20;

    transition:
        background var(--transition),
        border-color var(--transition);
}

.topbar-left {

    display: flex;
    align-items: center;

    gap: 10px;

    min-width: 0;
}

.topbar-title {

    font-size: 14px;

    font-weight: 650;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =====================================================
   THEME BUTTON
===================================================== */

.theme-button {

    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid var(--border);

    border-radius: 10px;

    background: var(--surface-2);

    color: var(--text-soft);

    cursor: pointer;

    transition: var(--transition);
}

.theme-button:hover {

    background: var(--surface-3);

    color: var(--text);

    border-color: var(--accent);

    transform: translateY(-1px);
}

.theme-icon {

    width: 18px;
    height: 18px;
}


/* =====================================================
   STATUS
===================================================== */

.status {

    display: flex;

    align-items: center;

    gap: 7px;

    color: var(--muted);

    font-size: 11px;
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #37d98b;

    box-shadow:
        0 0 12px
        rgba(55,217,139,.65);
}


/* =====================================================
   CHAT
===================================================== */

.chat {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    overscroll-behavior-y: contain;

    padding:
        28px 18px 180px;
}

.chat-inner {

    width: 100%;

    max-width: 920px;

    margin: 0 auto;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    min-height:
        calc(100dvh - 250px);

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    padding: 35px 20px;
}

.welcome-logo {

    width: 72px;
    height: 72px;

    border-radius: 22px;

    object-fit: cover;

    margin-bottom: 19px;

    box-shadow:
        0 14px 45px
        rgba(52,105,255,.23);
}

.welcome h1 {

    margin: 0;

    font-size: 29px;

    letter-spacing: -.7px;
}

.welcome p {

    margin:
        10px 0 0;

    color: var(--muted);

    font-size: 13px;
}


/* =====================================================
   MESSAGE
===================================================== */

.message-row {

    display: flex;

    width: 100%;

    margin-bottom: 20px;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.assistant {
    justify-content: flex-start;
}

.message {

    max-width:
        min(82%,760px);

    border-radius: 16px;

    padding:
        12px 15px;

    line-height: 1.8;

    font-size: 14px;

    overflow-wrap: anywhere;

    word-break: break-word;

    transition:
        background var(--transition),
        border-color var(--transition);
}

.user-message {

    background: var(--user-bg);

    border:
        1px solid var(--user-border);

    border-bottom-right-radius: 5px;
}

.assistant-message {

    background: var(--assistant-bg);

    border:
        1px solid var(--assistant-border);

    border-bottom-left-radius: 5px;
}

.message-role {

    color: var(--muted);

    font-size: 10px;

    margin-bottom: 5px;

    font-weight: 600;
}


/* =====================================================
   MARKDOWN
===================================================== */

.message h1,
.message h2,
.message h3 {

    margin:
        13px 0 7px;

    line-height: 1.4;
}

.message h1 {
    font-size: 20px;
}

.message h2 {
    font-size: 17px;
}

.message h3 {
    font-size: 15px;
}

.message p {
    margin: 5px 0;
}

.message ul,
.message ol {

    margin:
        8px 0;

    padding-left: 23px;
}

.message li {
    margin-bottom: 4px;
}

.message a {

    color: var(--accent);

    text-decoration: none;
}

.message a:hover {
    text-decoration: underline;
}

.message code {

    background: var(--code-bg);

    border:
        1px solid var(--border-strong);

    border-radius: 5px;

    padding:
        2px 5px;

    font-family:
        Consolas,
        monospace;

    direction: ltr;

    unicode-bidi: plaintext;
}

.message pre {

    margin:
        10px 0;

    padding: 13px;

    background: var(--code-bg);

    border:
        1px solid var(--border-strong);

    border-radius: 10px;

    overflow-x: auto;

    direction: ltr;

    text-align: left;

    white-space: pre-wrap;
}

.message pre code {

    background: transparent;

    border: 0;

    padding: 0;
}


/* =====================================================
   FILE CARD
===================================================== */

.file-card {

    display: flex;

    align-items: center;

    gap: 9px;

    padding:
        8px 10px;

    margin-bottom: 8px;

    border-radius: 9px;

    background: var(--surface-3);

    border:
        1px solid var(--border-strong);

    font-size: 12px;
}

.file-name {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =====================================================
   THINKING
===================================================== */

.thinking {

    display: flex;

    align-items: center;

    gap: 9px;

    color: var(--muted);

    font-size: 12px;
}

.thinking-dots {

    display: flex;

    gap: 4px;
}

.thinking-dots span {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--muted);

    animation:
        thinking 1.1s infinite;
}

.thinking-dots span:nth-child(2) {
    animation-delay: .14s;
}

.thinking-dots span:nth-child(3) {
    animation-delay: .28s;
}

@keyframes thinking {

    0%,
    65%,
    100% {

        transform:
            translateY(0);

        opacity: .35;
    }

    32% {

        transform:
            translateY(-4px);

        opacity: 1;
    }
}


/* =====================================================
   INPUT
===================================================== */

.input-area {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        16px 18px 18px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            var(--bg) 28%
        );

    z-index: 30;
}

.input-container {

    max-width: 920px;

    margin: 0 auto;
}

.composer {

    background:
        var(--surface-2);

    border:
        1px solid var(--border-strong);

    border-radius: 17px;

    overflow: hidden;

    box-shadow:
        var(--shadow);

    transition:
        border-color .18s,
        box-shadow .18s,
        background var(--transition);
}

.composer:focus-within {

    border-color:
        var(--accent);

    box-shadow:
        0 15px 45px
        rgba(35,65,120,.16);
}


/* =====================================================
   FILE PREVIEW
===================================================== */

.file-preview {

    display: none;

    padding:
        9px 12px 0;
}

.file-preview.show {
    display: block;
}

.file-preview-inner {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    max-width: 100%;

    padding:
        7px 9px;

    border:
        1px solid var(--border-strong);

    background:
        var(--surface-3);

    border-radius: 9px;

    font-size: 12px;
}

.remove-file {

    width: 23px;
    height: 23px;

    border: 0;

    border-radius: 6px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;
}

.remove-file:hover {

    background:
        rgba(255,70,90,.1);

    color: #ff7381;
}


/* =====================================================
   TEXTAREA
===================================================== */

#messageInput {

    width: 100%;

    min-height: 52px;
    max-height: 170px;

    resize: none;

    border: 0;
    outline: none;

    background: transparent;

    color: var(--text);

    padding:
        15px 16px 5px;

    font-size: 14px;

    line-height: 1.65;

    overflow-y: auto;
}

#messageInput::placeholder {
    color: var(--muted);
}


/* =====================================================
   COMPOSER BOTTOM
===================================================== */

.composer-bottom {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        7px 9px 9px;
}

.composer-tools {

    display: flex;

    align-items: center;

    gap: 5px;
}

.tool-button {

    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 0;

    border-radius: 10px;

    background: transparent;

    color: var(--text-soft);

    cursor: pointer;

    transition: .15s;
}

.tool-button:hover,
.tool-button.active {

    background:
        var(--surface-3);

    color: var(--text);
}


/* =====================================================
   SEARCH
===================================================== */

.search-button {
    position: relative;
}

.search-button.active {

    color:
        var(--accent);

    background:
        var(--user-bg);
}

.search-indicator {

    position: absolute;

    right: 5px;
    top: 5px;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background:
        var(--accent);

    display: none;
}

.search-button.active
.search-indicator {
    display: block;
}


/* =====================================================
   SEND
===================================================== */

.send-button {

    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 0;

    border-radius: 12px;

    background:
        var(--accent);

    color: white;

    cursor: pointer;

    transition: .15s;
}

.send-button:hover {

    background:
        var(--accent-hover);

    transform:
        translateY(-1px);
}

.send-button.stop {
    background:
        var(--danger);
}

.send-button.stop:hover {
    background:
        #ad3e4f;
}

.send-button:disabled {

    cursor: not-allowed;

    opacity: .75;
}


/* =====================================================
   MOBILE MENU
===================================================== */

.mobile-menu {

    display: none;

    width: 38px;
    height: 38px;

    border: 0;

    border-radius: 10px;

    background:
        var(--surface-3);

    color:
        var(--text);

    cursor: pointer;

    align-items: center;
    justify-content: center;
}


/* =====================================================
   OVERLAY
===================================================== */

.sidebar-overlay {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.45);

    z-index: 90;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden {
    display: none !important;
}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {

    background:
        var(--border-strong);

    border-radius: 10px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:800px) {

    body {

        overflow: hidden;

        position: fixed;

        inset: 0;
    }

    .sidebar {

        position: fixed;

        top: 0;
        bottom: 0;

        left: -290px;

        width: 280px;

        transition:
            left .22s ease;

        box-shadow:
            12px 0 45px
            rgba(0,0,0,.4);
    }

    .sidebar.open {
        left: 0;
    }

    .sidebar-overlay.open {
        display: block;
    }

    .mobile-menu {
        display: flex;
    }

    .topbar {

        height: 57px;
        min-height: 57px;

        padding:
            0 12px;
    }

    .topbar-title {
        max-width: 200px;
    }

    .chat {

        padding:
            18px 10px 160px;
    }

    .message {

        max-width: 91%;

        font-size: 13px;

        line-height: 1.75;

        border-radius: 14px;
    }

    .input-area {

        padding:
            8px 8px
            calc(8px + env(safe-area-inset-bottom));
    }

    .composer {
        border-radius: 15px;
    }

    #messageInput {

        min-height: 48px;

        font-size: 16px;
    }

    .welcome {

        min-height:
            calc(100dvh - 240px);
    }

    .welcome-logo {

        width: 62px;
        height: 62px;
    }

    .welcome h1 {
        font-size: 23px;
    }

    .welcome p {
        font-size: 12px;
    }

    .status {
        display: none;
    }

    .theme-button {

        width: 36px;
        height: 36px;
    }
}

</style>
</head>


<body>


<div class="app">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar" id="sidebar">

    <div class="brand">

        <img
            class="brand-logo"
            src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f40b.svg"
            alt="Whale"
        >

        <div>

            <div class="brand-name">
                Whale AI
            </div>

            <div class="brand-subtitle">
                Intelligent Assistant
            </div>

        </div>

    </div>


    <button
        class="new-chat"
        onclick="newConversation()"
    >
        + New Chat
    </button>


    <div class="sidebar-title">
        Recent Chats
    </div>


    <div
        class="conversations"
        id="conversations"
    ></div>


    <div class="sidebar-bottom">

        <button
            class="sidebar-button"
            onclick="clearAllConversations()"
        >
            Delete All Chats
        </button>

        <button
            class="sidebar-button"
            onclick="showMemory()"
        >
            Whale Memory
        </button>

    </div>

</aside>


<div
    class="sidebar-overlay"
    id="sidebarOverlay"
    onclick="closeMobileSidebar()"
></div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


<header class="topbar">

    <div class="topbar-left">

        <button
            class="mobile-menu"
            onclick="toggleSidebar()"
            aria-label="Open menu"
        >
            ☰
        </button>


        <div
            class="topbar-title"
            id="topbarTitle"
        >
            New Chat
        </div>

    </div>


    <div
        style="
            display:flex;
            align-items:center;
            gap:10px;
        "
    >

        <!-- THEME BUTTON -->

        <button
            class="theme-button"
            id="themeButton"
            onclick="toggleTheme()"
            title="Switch theme"
            aria-label="Switch theme"
        >

            <svg
                class="theme-icon"
                id="themeIcon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            ></svg>

        </button>


        <div class="status">

            <span class="status-dot"></span>

            Online

        </div>

    </div>

</header>


<!-- =====================================================
     CHAT
===================================================== -->

<section
    class="chat"
    id="chat"
>

    <div
        class="chat-inner"
        id="chatInner"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <img
                class="welcome-logo"
                src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f40b.svg"
                alt="Whale"
            >

            <h1>
                Welcome to Whale AI
            </h1>

            <p>
                Ask anything, upload a file, or enable Web Search.
            </p>

        </div>

    </div>

</section>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="input-area">

    <div class="input-container">

        <div class="composer">


            <!-- FILE PREVIEW -->

            <div
                class="file-preview"
                id="filePreview"
            >

                <div class="file-preview-inner">

                    <span>📎</span>

                    <span
                        class="file-name"
                        id="fileName"
                    ></span>

                    <button
                        class="remove-file"
                        onclick="removeFile()"
                        aria-label="Remove file"
                    >
                        ×
                    </button>

                </div>

            </div>


            <!-- TEXTAREA -->

            <textarea
                id="messageInput"
                placeholder="Message Whale AI..."
                rows="1"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="sentences"
                spellcheck="true"
            ></textarea>


            <!-- BOTTOM -->

            <div class="composer-bottom">

                <div class="composer-tools">


                    <!-- FILE -->

                    <button
                        class="tool-button"
                        title="Attach file"
                        onclick="document.getElementById('fileInput').click()"
                    >

                        <svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                            />

                        </svg>

                    </button>


                    <input
                        id="fileInput"
                        type="file"
                        class="hidden"
                        accept=".txt,.md,.csv,.json,.pdf,.docx"
                        onchange="handleFile(event)"
                    >


                    <!-- WEB SEARCH -->

                    <button
                        class="tool-button search-button"
                        id="webSearchButton"
                        title="Web Search"
                        onclick="toggleWebSearch()"
                    >

                        <svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <circle
                                cx="11"
                                cy="11"
                                r="7"
                            />

                            <path
                                d="m20 20-4-4"
                            />

                        </svg>

                        <span
                            class="search-indicator"
                        ></span>

                    </button>

                </div>


                <!-- SEND -->

                <button
                    class="send-button"
                    id="sendButton"
                    onclick="handleSendButton()"
                    title="Send"
                >

                    <svg
                        id="sendIcon"
                        width="19"
                        height="19"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path d="M22 2 11 13"></path>

                        <path d="m22 2-7 20-4-9-9-4Z"></path>

                    </svg>

                </button>

            </div>

        </div>

    </div>

</div>

</main>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let currentConversationId = null;

let selectedFile = null;

let selectedFileText = "";

let webSearchEnabled = false;

let isSending = false;

let activeController = null;


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const sendIcon =
    document.getElementById("sendIcon");

const conversationsElement =
    document.getElementById("conversations");

const webSearchButton =
    document.getElementById("webSearchButton");

const themeButton =
    document.getElementById("themeButton");

const themeIcon =
    document.getElementById("themeIcon");


/* =====================================================
   THEME
===================================================== */

function applyTheme(theme) {

    if (theme === "light") {

        document.body.classList.add("light");

        localStorage.setItem(
            "whale-theme",
            "light"
        );

        themeButton.title =
            "Switch to dark mode";

        themeIcon.innerHTML = `

            <circle
                cx="12"
                cy="12"
                r="4"
            ></circle>

            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>

            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>

            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>

            <path d="m4.93 19.07 1.41-1.41"></path>
            <path d="m17.66 6.34 1.41-1.41"></path>

        `;

    } else {

        document.body.classList.remove("light");

        localStorage.setItem(
            "whale-theme",
            "dark"
        );

        themeButton.title =
            "Switch to light mode";

        themeIcon.innerHTML = `

            <path
                d="M21 12.79A9 9 0 1 1 11.21 3
                7 7 0 0 0 21 12.79Z"
            ></path>

        `;

    }

}


function toggleTheme() {

    const isLight =
        document.body.classList.contains(
            "light"
        );

    applyTheme(
        isLight
            ? "dark"
            : "light"
    );

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const savedTheme =
            localStorage.getItem(
                "whale-theme"
            );

        applyTheme(
            savedTheme === "light"
                ? "light"
                : "dark"
        );

        loadConversations();

        messageInput.focus();

    }
);


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

    document
        .getElementById("sidebarOverlay")
        .classList.toggle("open");
}


function closeMobileSidebar() {

    document
        .getElementById("sidebar")
        .classList.remove("open");

    document
        .getElementById("sidebarOverlay")
        .classList.remove("open");
}


/* =====================================================
   WEB SEARCH
===================================================== */

function toggleWebSearch() {

    webSearchEnabled =
        !webSearchEnabled;

    webSearchButton.classList.toggle(
        "active",
        webSearchEnabled
    );

    webSearchButton.title =
        webSearchEnabled
            ? "Web Search: ON"
            : "Web Search: OFF";
}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations() {

    try {

        const response =
            await fetch(
                "/conversations",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Conversation request failed."
            );
        }

        const data =
            await response.json();

        conversationsElement.innerHTML = "";

        data.forEach(
            conversation => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "conversation"
                    +
                    (
                        Number(conversation.id)
                        ===
                        Number(currentConversationId)
                            ? " active"
                            : ""
                    );

                item.onclick =
                    () =>
                        loadConversation(
                            conversation.id
                        );

                const text =
                    document.createElement(
                        "div"
                    );

                text.className =
                    "conversation-text";

                text.textContent =
                    conversation.title
                    ||
                    "New Chat";

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "delete-conversation";

                deleteButton.textContent =
                    "×";

                deleteButton.title =
                    "Delete chat";

                deleteButton.onclick =
                    event => {

                        event.stopPropagation();

                        deleteConversation(
                            conversation.id
                        );

                    };

                item.appendChild(text);

                item.appendChild(
                    deleteButton
                );

                conversationsElement.appendChild(
                    item
                );

            }
        );

    } catch (error) {

        console.error(
            "LOAD CONVERSATIONS:",
            error
        );

    }

}


/* =====================================================
   NEW CONVERSATION
===================================================== */

async function newConversation() {

    if (isSending) {

        stopGeneration();

    }

    try {

        const response =
            await fetch(
                "/conversations",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        currentConversationId =
            data.id;

        clearChat();

        document.getElementById(
            "topbarTitle"
        ).textContent =
            "New Chat";

        removeFile();

        await loadConversations();

        closeMobileSidebar();

        messageInput.focus();

    } catch (error) {

        console.error(error);

        alert(
            "Could not create a new chat."
        );

    }

}


/* =====================================================
   LOAD CONVERSATION
===================================================== */

async function loadConversation(id) {

    if (isSending) {

        stopGeneration();

    }

    try {

        const response =
            await fetch(
                `/conversations/${id}/messages`
            );

        const messages =
            await response.json();

        if (!response.ok) {

            throw new Error(
                messages.error
                ||
                "Failed to load chat."
            );
        }

        currentConversationId =
            Number(id);

        clearChat();

        messages.forEach(
            message => {

                addMessage(
                    message.role,
                    message.content
                );

            }
        );

        const conversationsResponse =
            await fetch(
                "/conversations"
            );

        const conversations =
            await conversationsResponse.json();

        const conversation =
            conversations.find(
                item =>
                    Number(item.id)
                    ===
                    Number(id)
            );

        document.getElementById(
            "topbarTitle"
        ).textContent =
            conversation
                ? conversation.title
                : "Chat";

        await loadConversations();

        closeMobileSidebar();

        scrollToBottom();

    } catch (error) {

        console.error(error);

        alert(
            "Could not load this chat."
        );

    }

}


/* =====================================================
   DELETE CHAT
===================================================== */

async function deleteConversation(id) {

    if (
        !confirm(
            "Delete this chat?"
        )
    ) {

        return;

    }

    try {

        const response =
            await fetch(
                `/conversations/${id}`,
                {
                    method: "DELETE"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Delete failed."
            );
        }

        if (
            Number(currentConversationId)
            ===
            Number(id)
        ) {

            currentConversationId =
                null;

            clearChat();

            document.getElementById(
                "topbarTitle"
            ).textContent =
                "New Chat";

        }

        await loadConversations();

    } catch (error) {

        console.error(error);

        alert(
            "Could not delete the chat."
        );

    }

}


/* =====================================================
   DELETE ALL
===================================================== */

async function clearAllConversations() {

    if (
        !confirm(
            "Delete all chats?"
        )
    ) {

        return;

    }

    try {

        const response =
            await fetch(
                "/conversations",
                {
                    method: "DELETE"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Delete all failed."
            );
        }

        currentConversationId =
            null;

        clearChat();

        document.getElementById(
            "topbarTitle"
        ).textContent =
            "New Chat";

        await loadConversations();

    } catch (error) {

        console.error(error);

        alert(
            "Could not delete the chats."
        );

    }

}


/* =====================================================
   CLEAR CHAT
===================================================== */

function clearChat() {

    chatInner.innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <img
                class="welcome-logo"
                src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f40b.svg"
                alt="Whale"
            >

            <h1>
                Welcome to Whale AI
            </h1>

            <p>
                Ask anything, upload a file, or enable Web Search.
            </p>

        </div>

    `;

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
    role,
    content,
    fileName = ""
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row "
        +
        (
            role === "user"
                ? "user"
                : "assistant"
        );

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message "
        +
        (
            role === "user"
                ? "user-message"
                : "assistant-message"
        );

    const roleText =
        document.createElement(
            "div"
        );

    roleText.className =
        "message-role";

    roleText.textContent =
        role === "user"
            ? "You"
            : "Whale AI";

    message.appendChild(
        roleText
    );

    if (fileName) {

        const fileCard =
            document.createElement(
                "div"
            );

        fileCard.className =
            "file-card";

        const icon =
            document.createElement(
                "span"
            );

        icon.textContent =
            "📎";

        const name =
            document.createElement(
                "span"
            );

        name.className =
            "file-name";

        name.textContent =
            fileName;

        fileCard.appendChild(icon);

        fileCard.appendChild(name);

        message.appendChild(
            fileCard
        );

    }

    const contentElement =
        document.createElement(
            "div"
        );

    contentElement.innerHTML =
        formatMarkdown(
            content
        );

    message.appendChild(
        contentElement
    );

    row.appendChild(
        message
    );

    chatInner.appendChild(
        row
    );

    scrollToBottom();

}


/* =====================================================
   MARKDOWN
===================================================== */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatMarkdown(text) {

    let html =
        escapeHtml(
            String(text)
        );

    const codeBlocks = [];

    html =
        html.replace(
            /```([\s\S]*?)```/g,
            (
                match,
                code
            ) => {

                const token =
                    `___CODE_${codeBlocks.length}___`;

                codeBlocks.push(
                    "<pre><code>"
                    +
                    code.trim()
                    +
                    "</code></pre>"
                );

                return token;

            }
        );

    html =
        html.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );

    html =
        html.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
        );

    html =
        html.replace(
            /^# (.*)$/gm,
            "<h1>$1</h1>"
        );

    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    html =
        html.replace(
            /\*([^*\n]+)\*/g,
            "<em>$1</em>"
        );

    html =
        html.replace(
            /`([^`\n]+)`/g,
            "<code>$1</code>"
        );

    html =
        html.replace(
            /^[-*] (.*)$/gm,
            "<li>$1</li>"
        );

    html =
        html.replace(
            /(<li>.*<\/li>)/gs,
            "<ul>$1</ul>"
        );

    html =
        html.replace(
            /\n/g,
            "<br>"
        );

    codeBlocks.forEach(
        (
            block,
            index
        ) => {

            html =
                html.replace(
                    `___CODE_${index}___`,
                    block
                );

        }
    );

    return html;

}


/* =====================================================
   THINKING
===================================================== */

function showThinking() {

    removeThinking();

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row assistant";

    row.id =
        "thinkingMessage";

    row.innerHTML = `

        <div class="message assistant-message">

            <div class="message-role">
                Whale AI
            </div>

            <div class="thinking">

                <div class="thinking-dots">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

                <span id="thinkingText">
                    Thinking
                </span>

            </div>

        </div>

    `;

    chatInner.appendChild(row);

    scrollToBottom();

    if (webSearchEnabled) {

        setThinkingText(
            "Searching the web"
        );

    }

}


function setThinkingText(text) {

    const element =
        document.getElementById(
            "thinkingText"
        );

    if (element) {

        element.textContent =
            text;

    }

}


function removeThinking() {

    const element =
        document.getElementById(
            "thinkingMessage"
        );

    if (element) {
        element.remove();
    }

}


/* =====================================================
   SEND
===================================================== */

function handleSendButton() {

    if (isSending) {

        stopGeneration();

        return;

    }

    sendMessage();

}


async function sendMessage() {

    if (isSending) {
        return;
    }

    const text =
        messageInput.value.trim();

    if (
        !text &&
        !selectedFileText
    ) {
        return;
    }

    isSending = true;

    activeController =
        new AbortController();

    updateSendButton(true);

    const fileName =
        selectedFile
            ? selectedFile.name
            : "";

    addMessage(
        "user",
        text ||
        "[Attached file]",
        fileName
    );

    messageInput.value = "";

    autoResize();

    showThinking();

    try {

        const response =
            await fetch(
                "/chat",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    signal:
                        activeController.signal,

                    body:
                        JSON.stringify({

                            message:
                                text,

                            conversation_id:
                                currentConversationId,

                            file_name:
                                fileName,

                            file_text:
                                selectedFileText,

                            web_search:
                                webSearchEnabled

                        })

                }
            );

        const data =
            await response.json();

        removeThinking();

        if (!response.ok) {

            addMessage(
                "assistant",
                data.error
                ||
                "Something went wrong."
            );

            return;
        }

        currentConversationId =
            data.conversation_id;

        addMessage(
            "assistant",
            data.content
        );

        removeFile();

        await loadConversations();

    } catch (error) {

        removeThinking();

        if (
            error.name ===
            "AbortError"
        ) {

            addMessage(
                "assistant",
                "Generation stopped."
            );

        } else {

            console.error(
                "SEND ERROR:",
                error
            );

            addMessage(
                "assistant",
                "Could not connect to the server."
            );

        }

    } finally {

        isSending = false;

        activeController = null;

        updateSendButton(false);

        messageInput.focus();

    }

}


/* =====================================================
   STOP
===================================================== */

function stopGeneration() {

    if (activeController) {

        activeController.abort();

    }

}


/* =====================================================
   SEND BUTTON UI
===================================================== */

function updateSendButton(
    sending
) {

    if (sending) {

        sendButton.classList.add(
            "stop"
        );

        sendButton.title =
            "Stop generating";

        sendIcon.innerHTML = `

            <rect
                x="6"
                y="6"
                width="12"
                height="12"
                rx="2"
            />

        `;

    } else {

        sendButton.classList.remove(
            "stop"
        );

        sendButton.title =
            "Send";

        sendIcon.innerHTML = `

            <path
                d="M22 2 11 13"
            ></path>

            <path
                d="m22 2-7 20-4-9-9-4Z"
            ></path>

        `;

    }

}


/* =====================================================
   FILE
===================================================== */

async function handleFile(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    const maxSize =
        20 * 1024 * 1024;

    if (
        file.size >
        maxSize
    ) {

        alert(
            "Maximum file size is 20 MB."
        );

        event.target.value =
            "";

        return;

    }

    selectedFile =
        file;

    selectedFileText =
        "";

    document.getElementById(
        "fileName"
    ).textContent =
        file.name;

    document.getElementById(
        "filePreview"
    ).classList.add(
        "show"
    );

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    try {

        const response =
            await fetch(
                "/upload",
                {

                    method:
                        "POST",

                    body:
                        formData

                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error
                ||
                "Upload failed."
            );
        }

        selectedFileText =
            data.text
            ||
            "";

        if (
            !selectedFileText
        ) {

            alert(
                "No readable text was extracted from this file."
            );

        }

    } catch (error) {

        console.error(
            "UPLOAD:",
            error
        );

        alert(
            error.message
            ||
            "File upload failed."
        );

        removeFile();

    }

}


/* =====================================================
   REMOVE FILE
===================================================== */

function removeFile() {

    selectedFile =
        null;

    selectedFileText =
        "";

    const input =
        document.getElementById(
            "fileInput"
        );

    input.value =
        "";

    document.getElementById(
        "filePreview"
    ).classList.remove(
        "show"
    );

    document.getElementById(
        "fileName"
    ).textContent =
        "";

}


/* =====================================================
   TEXTAREA
===================================================== */

messageInput.addEventListener(
    "input",
    autoResize
);

function autoResize() {

    messageInput.style.height =
        "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            170
        ) + "px";

}


/* =====================================================
   KEYBOARD
===================================================== */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
            &&
            !event.shiftKey
            &&
            !event.isComposing
        ) {

            event.preventDefault();

            if (!isSending) {
                sendMessage();
            }

        }

    }
);


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom() {

    requestAnimationFrame(
        () => {

            chat.scrollTo({

                top:
                    chat.scrollHeight,

                behavior:
                    "smooth"

            });

        }
    );

}


/* =====================================================
   MEMORY
===================================================== */

async function showMemory() {

    try {

        const response =
            await fetch(
                "/memory"
            );

        const data =
            await response.json();

        if (
            !data.memories
            ||
            data.memories.length === 0
        ) {

            alert(
                "Whale Memory is empty."
            );

            return;

        }

        const text =
            data.memories
                .map(
                    memory =>
                        `${memory.key}: ${memory.value}`
                )
                .join("\n");

        alert(
            "Whale Memory\n\n"
            +
            text
        );

    } catch (error) {

        console.error(error);

        alert(
            "Could not load memory."
        );

    }

}

</script>
